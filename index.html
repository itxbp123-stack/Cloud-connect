,"a":"B"},{"n":49,"q":"Proxy voting is best defined as a means for:","o":{"A":"a would-be acquirer to gain control.","B":"activist shareholders to pressure management.","C":"shareholders voting without attending a meeting in person."},"f":{"A":"Incorrect because this is but one use of the proxy voting process, and thus not the best description of it. Changes in corporate control via a takeover by shareholders or an acquirer may be pursued in several ways. One mechanism is the proxy contest (or proxy fight). In a proxy contest, a group seeking a controlling position on a company’s board of directors attempts to persuade shareholders to vote for the group.","B":"Incorrect because, while shareholder activists often pressure management to act using tactics such as initiating proxy fights, proposing shareholder resolutions, and publicizing issues of contention, this is but one use of the proxy voting process.","C":"Correct because shareholders unable to attend a meeting in person usually authorize another party to vote on their behalf in a proxy voting process, typically by submitting a ballot electronically or by mail. Proxy voting is the most common form of investor participation in general meetings"},"a":"C"},{"n":50,"q":"The NZD/EUR (amount of NZD per 1 EUR) spot rate is 1.5453. If the 3-month forward discount is 24 points, the 3-month forward rate is closest to:","o":{"A":"1.54290.","B":"1.54770.","C":"1.54901."},"f":{"A":"Correct because if the forward rate is less than the spot rate, the points (forward rate minus spot rate) are negative and the base currency is said to be trading at a forward discount. To convert quoted forward points into a forward rate, one would divide the number of points by 10,000 (to scale down to the fourth decimal place, the last decimal place in the spot quote) and then add the result to the spot exchange rate quote. Therefore, scaling down the forward points by dividing by 10,000 gives a forward discount of 24/10,000 = 0.0024. Since it is a discount, subtracting it from the spot rate results in a three-month forward rate of 1.5453 – 0.0024 = 1.54290.","B":"Incorrect because it adds, rather than subtracts, the forward discount; 1.5453 + 0.0024 = 1.54770.","C":"Incorrect because it multiplies the spot rate by (1 + the forward discount) rather than adding it; 1.5453 × (1 + 0.0024) ≈ 1.54901."},"a":"A"},{"n":51,"q":"An analyst calculates the following metrics about a sample of paired observations of a dependent variable Y and an independent variable X:\n§Variance of X    9\n§Variance of Y    15\n§Covariance of Y and X    12\nBased on the sample, the slope coefficient of the simple linear regression of Y to X is closest to:","o":{"A":"0.80.","B":"1.03.","C":"1.33."},"f":{"A":"Incorrect because it used the variance of Y, and not the variance of X, in the denominator, and calculates the slope = 12 / 1. It is also closest to the inverse of the correct answer, 9/12 = 0.75.","B":"Incorrect because it is the sample correlation between X and Y, and not the slope of the linear regression. The sample correlation, r, is the ratio of the covariance to the product of the standard deviations, and thus equals 12 / ((90.5)(150.5)) = 12 / 11.62 = 1.0328 ≈ 1.03.","C":"Correct because the slope of a linear regression is the ratio of the covariance between Y and X to the variance of X, thus slope = 12/9 ≈ 1.33."},"a":"C"},{"n":52,"q":"The third quintile corresponds to the:","o":{"A":"40th percentile.","B":"50th percentile.","C":"60th percentile."},"f":{"A":"Incorrect because the third quintile corresponds the 60th percentile. Statisticians use the word quantile (or fractile) as the most general term for a value at or below which a stated fraction of the data lies. While the 40th percentile is the beginning of the range that contains the values in the third quintile, it is not the value at which 60% of observations lie at or below it.","B":"Incorrect because the third quintile corresponds the 60th percentile. Statisticians use the word quantile (or fractile) as the most general term for a value at or below which a stated fraction of the data lies. While the 50th percentile is the midpoint of the range that contains the values in the third quintile, it is not the value at which 60% of observations lie at or below it.","C":"Correct because quartiles divide the distribution into quarters, quintiles into fifths, deciles into tenths, and percentiles into hundredths. Given a set of observations, the yth percentile is the value at or below which y% of observations lie. Quintiles divide the distribution based on the 20th, 40th, 60th, and 80th percentile. As such, the third quintile corresponds to the 60th percentile."},"a":"C"},{"n":53,"q":"Goodness of fit measures derived from analysis of variance (ANOVA) data most likely include the:","o":{"A":"coefficient of variation.","B":"regression coefficients.","C":"standard error of the estimate."},"f":{"A":"Incorrect because the coefficient of determination is a goodness of fit measure, not the coefficient of variation. The coefficient of variation is a measure of relative dispersion. The coefficient of variation, CV, is the ratio of the standard deviation of a set of observations to their mean value. The se, (the standard error of the estimate), along with the coefficient of determination and the F-statistic, is a measure of the goodness of the fit of the estimated regression line.","B":"Incorrect because the regression coefficients, the intercept and slope coefficient, are derived from the initial ordinary least squares regression, not the analysis of variance.","C":"Correct because we often represent the sums of squares from a regression model in an analysis of variance (ANOVA) table, which presents the sums of squares, the degrees of freedom, the mean squares, and the F-statistic. The se, (the standard error of the estimate), along with the coefficient of determination and the F-statistic, is a measure of the goodness of the fit of the estimated regression line."},"a":"C"},{"n":54,"q":"PP&E may be reported above its historical cost on the balance sheet under:","o":{"A":"the cost model only.","B":"the revaluation model only.","C":"both the cost model and the revaluation model."},"f":{"A":"Incorrect because the cost model allows only decreases in the values of long-lived assets compared with historical costs.","B":"Correct because the revaluation model may result in increases in the values of long-lived assets to amounts greater than historical costs.","C":"Incorrect because a key difference between the two models is that the cost model allows only decreases in the values of long-lived assets compared with historical costs but the revaluation model may result in increases in the values of long-lived assets to amounts greater than historical costs."},"a":"B"},{"n":55,"q":"An analyst gathers the following information about a company:\n§Market value of equity    $64 million\n§Cost of equity    14%\n§Market value of debt    $20 million\n§Before-tax cost of debt    5%\n§Marginal tax rate    30%\nThe company's WACC is closest to:","o":{"A":"11.02%.","B":"11.50%.","C":"11.86%."},"f":{"A":"Incorrect because the cost of debt is adjusted for tax by multiplying the cost of debt with the tax rate instead of multiplying it by (1 – the marginal tax rate). WACC ≠ 0.2381 × 5% × 30% + 0.7619 × 14% = 0.11024 ≈ 11.02%.","B":"Correct because WACC = wdrd(1 – t) + wprp + were wherewd = the proportion of debt that the company uses when it raises new funds,rd = the before-tax marginal cost of debt,t = the company’s marginal tax rate,wp = the proportion of preferred stock the company uses when it raises new funds,rp = the marginal cost of preferred stock,we = the proportion of equity that the company uses when it raises new funds,re = the marginal cost of equity.wd = $20m/($20m + $64m) = 0.2381 and we = $64m/($20m + $64m) = 0.7619WACC = 0.2381 × 5% × (1 – 30%) + 0.7619 × 14% = 11.50%.","C":"Incorrect because the cost of debt is not adjusted with the marginal tax rate. WACC ≠ 0.2381 × 5% + 0.7619 × 14% = 0.11857 ≈ 11.86%."},"a":"B"},{"n":56,"q":"An analyst uses the following information to forecast a company's gross profit margin: Current Amount (in  Forecasted\n§$ millions)    Growth\n§Sales    1,200    4%\n§Cost of sales    300    8%\nThe analyst's gross margin forecast would be closest to a(n):","o":{"A":"decrease of 4%.","B":"decrease of 1%.","C":"increase of 1%."},"f":{"A":"Incorrect because it assumes the starting values have the same base and takes the difference in the growth rates; –4% = sales growth – cost of sales growth = 4% – 8%.","B":"Correct because the gross profit for the current year is 900 (=1,200 – 300), therefore the current gross profit margin is 75%. If sales increase by 4% (to 1,248) and cost of sales increase by 8% (to 324), the forecasted gross profit is 924 (= 1,248 – 324), and the forecasted gross profit margin is 74.04%. This is a decrease of approximately 1% (= 74.04% – 75%).","C":"Incorrect because it computes the gross profit margin as cost of sales / sales. Current gross profit margin is 25% (= 300 / 1,200) and the forecasted gross profit margin is 25.96% (= 324 / 1,248) an increase of approximately 1%."},"a":"B"},{"n":57,"q":"A series of five annual tuition payments of $25,000 each will begin exactly 20 years from today. If the stated annual rate is 4%, the required investment today to fund all five payments is closest to:","o":{"A":"$50,794.","B":"$52,826.","C":"$54,939."},"f":{"A":"Incorrect because it discounts the present value of the projected ordinary annuity by 20 years instead of 19 years. The PV of the 5-year ordinary annuity at t = 19 (1 year before the first payment) equals $25,000[1 – 1/(1 + 0.04)5]/0.04 = $25,000[1 – 0.82193]/0.04 = $25,000(4.45182) = $111,295.56. The PV at t = 0 is equal to $111,295.56/(1 + 0.04)20 = $111,295.56/2.19112 = $50,793.84 ≈ $50,794. Calculator solution: in END mode; N = 5; I/Y = 4; PMT = 25,000; solve for PV = 111,295.56; then discount for 20 years: FV = 111,295.56; N = 20; I/Y = 4; solve for PV = 50,793.84.","B":"Correct because the present value formulas for an ordinary annuity and a lump sum are PV = A[1 – 1/(1 + r)N]/r and PV = FVN/(1 + r)N, respectively. The PV of the 5-year ordinary annuity at t = 19 (1 year before the first payment) equals $25,000[1 – 1/(1 + 0.04)5]/0.04 = $25,000[1 – 0.82193]/0.04 = $25,000(4.45182) = $111,295.56. The PV at t = 0 is equal to $111,295.56/(1 + 0.04)19 = $111,295.56/2.10685 = $52,825.59 ≈ $52,826. Calculator solution: in END mode; N = 5; I/Y = 4; PMT = 25,000; solve for PV = 111,295.56; then discount for 19 years: FV = 111,295.56; N = 19; I/Y = 4; solve for PV = 52,825.59 ≈ 52,826. Alternatively: in BGN mode; N = 5; I/Y = 4; PMT = 25,000; solve for PV = 115,747.38; then discount for 20 years: FV = 115,747.38; N = 20; I/Y = 4; solve for PV = 52,825.59.","C":"Incorrect because it calculates the present value of an annuity due at t = 20 and then discounts the PV of the projected annuity due by 19 years instead of 20 years. The PV of the 5-year annuity due at t = 20 equals $25,000{[1 – 1/(1 + 0.04)5]/0.04} (1.04) = $25,000{[1 − 0.82193]/0.04}(1.04) = $25,000(4.62990) = $115,747.38. The PV at t = 0 is equal to $115,747.38/(1 + 0.04)19 = $115,747.38/2.10685 = $54,938.62 ≈ $54,939. Calculator solution: in BGN mode; N = 5; I/Y = 4; PMT = 25,000; solve for PV = 115,747.38; then discount for 19 years: FV = 115,747.38; N = 19; I/Y = 4; solve for PV = 54,938.62."},"a":"B"},{"n":58,"q":"Which of the following companies would most likely be considered to have the lowest financial reporting quality, other things equal?","o":{"A":"A company that reports significant profits due to a favorable exchange rate movement.","B":"A company that reports the results from two different segments as a combined entity.","C":"A company that provides high quality, decision-useful information under GAAP but delays its reports."},"f":{"A":"Incorrect. This is an example of decision-useful information about a result that may not be sustainable. Reporting is not of the highest quality, but is better than biased reporting.","B":"Correct. Combining the results from two segments is an example of biased reporting, which falls in the middle of the quality spectrum. It is difficult to interpret the profitability of each segment when their results are combined.","C":"Incorrect. The company’s reports are high quality, but the delay in reporting impairs their usefulness somewhat. The reporting is still better than biased reporting."},"a":"B"},{"n":59,"q":"In which of the following business structures do owners share all risk and business liability?","o":{"A":"Corporations","B":"Limited partnerships","C":"General partnerships"},"f":{"A":"Incorrect because like a limited partnership, owners in a corporation (and US LLC) have limited liability, and don't share all risk and business liability.","B":"Incorrect because a limited partnership must have at least one general partner with unlimited liability who is responsible for the management of the business. Remaining partners, called limited partners, have limited liability, meaning they can lose only up to the amount of their investment in the limited partnership.","C":"Correct because general partnerships have a small number of partners who establish the business by contributing equal amounts of capital. A key feature of general partnerships is that partners share all risk and business liability."},"a":"C"},{"n":60,"q":"An analyst gathers the following information (in $ millions) about three companies: Company 1  Company 2  Company 3\n§Cash    2.5    2.0    1.5\n§Short-term marketable instruments    4.0    1.0    1.0\n§Receivables    2.0    2.0    1.0\n§Inventory    1.0    1.0    3.0\n§Current liabilities    5.0    2.5    2.0\nBased on the quick ratio, which company exhibits the lowest liquidity risk?","o":{"A":"Company 1","B":"Company 2","C":"Company 3"},"f":{"A":"Incorrect because Company 1 has the highest cash ratio but not the highest quick ratio.Cash ratio = (Cash + Short-term marketable instruments) / Current liabilitiesThe following is calculated in $ millions:Company 1 cash ratio = (2.5 + 4.0) / 5.0 = 1.30Company 2 cash ratio = (2.0 + 1.0) / 2.5 = 1.20Company 3 cash ratio = (1.5 + 1.0) / 2.0 = 1.25","B":"Correct because Company 2 has the highest quick ratio.Quick ratio = (Cash + Short-term marketable instruments + Receivables) / Current liabilitiesThe following is calculated in $ millions:Company 1 quick ratio = (2.5 + 4.0 + 2.0) / 5.0 = 1.70Company 2 quick ratio = (2.0 + 1.0 + 2.0) / 2.5 = 2.00Company 3 quick ratio = (1.5 + 1.0 + 1.0) / 2.0 = 1.75","C":"Incorrect because Company 3 has the highest current ratio but not the highest quick ratio. Current ratio = (Cash + Short-term marketable instruments + Receivables + Inventory) / Current liabilitiesThe following is calculated in $ millions:Company 1 current ratio = (2.5 + 4.0 + 2.0 + 1.0) / 5.0 = 1.90Company 2 current ratio = (2.0 + 1.0 + 2.0 + 1.0) / 2.5 = 2.40Company 3 current ratio = (1.5 + 1.0 + 1.0 + 3.0) / 2.0 = 3.25"},"a":"B"},{"n":61,"q":"For a company paying preferred dividends, the components needed to compute basic EPS are net income:","o":{"A":"and the weighted average number of common shares outstanding.","B":"preferred dividends, and the weighted average number of common shares outstanding.","C":"preferred dividends, additional shares issued if preferred is converted, and the weighted average number of common shares outstanding."},"f":{"A":"Incorrect because preferred dividends must be subtracted from net income before dividing by the weighted average number of shares outstanding.","B":"Correct. Basic EPS is calculated by subtracting preferred dividends from net income and then dividing the result by the weighted average number of shares outstanding.","C":"Incorrect because basic EPS is not adjusted for additional ordinary shares issued, an adjustment which uses the if-converted method for potentially dilutive securities. This method is applicable when determining diluted EPS."},"a":"B"},{"n":62,"q":"In monopolistically competitive markets, economic profits:","o":{"A":"cannot be earned.","B":"can be earned in the short run only.","C":"can be earned in the short run and in the long run."},"f":{"A":"Incorrect because in the short run a monopolistically competitive firm is able to earn a positive economic profit. In the short run, the profit-maximizing choice is the level of output at which Marginal Revenue = Marginal Cost","B":"Correct because in the short run a monopolistically competitive firm is able to earn a positive economic profit. In the short run, the profit-maximizing choice is the level of output at which Marginal Revenue = Marginal Cost. However, in the long run for the monopolistically competitive firm, economic profit will fall to zero.","C":"Incorrect because in the long run for the monopolistically competitive firm, economic profit will fall to zero."},"a":"B"},{"n":63,"q":"An analyst is comparing the solvency of a company over the past two years using the information below:\n§Year 2    ¥ Millions\n§Total debt    2,300\n§Total shareholders’ equity    17,000\n§Total assets    20,000\n§Net income    375\n§Interest payments/interest expense    200\n§Taxes paid    125\nRatios in Year 1\n§Debt to capital    12.7%\n§Interest coverage    2.9\nThe best conclusion the analyst can make about Year 2 is that compared with Year 1, the company’s solvency has:","o":{"A":"deteriorated because both ratios have weakened.","B":"remained the same.","C":"improved because both ratios have strengthened."},"f":{"A":"Incorrect because it calculates interest coverage using net income instead of EBIT (1.875), and interprets the change in debt to capital as a deterioration because the value has decreased.","B":"Incorrect because both ratios have improved from Year 1 to Year 2, thus the company is more solvent in Year 2","C":"Correct because both ratios have improved from Year 1 to Year 2, thus the company is more solvent in Year 2.\n§Year 1    Year 2 calculations    Year 2\n§Debt to capital    12.7%    2,300/(2,300 + 17,000) = 11.9%    11.9%\n§Interest coverage    2.9    (375 + 200 + 125)/200 = 3.5    3.5"},"a":"C"},{"n":64,"q":"In hypothesis testing, the critical value is determined by the:","o":{"A":"p-value.","B":"sample's mean.","C":"level of significance."},"f":{"A":"Incorrect because the p-value is the area in the probability distribution outside the calculated test statistic.","B":"Incorrect because the critical value or values we choose are based on the level of significance and the probability distribution associated with the test statistic.","C":"Correct because the critical value or values we choose are based on the level of significance and the probability distribution associated with the test statistic."},"a":"C"},{"n":65,"q":"If the prices of tech stocks usually rise when interest rates fall, the correlation between the two variables is most likely:","o":{"A":"negative.","B":"zero.","C":"positive."},"f":{"A":"Correct because a negative correlation close to −1 indicates a strong negative (that is, inverse) linear relationship. The stem states that prices of tech stocks and interest rates move in opposite directions.","B":"Incorrect because a correlation of 0 (uncorrelated variables) indicates an absence of any linear (that is, straight-line) relationship between the variables.","C":"Incorrect because a positive correlation close to +1 indicates a strong positive linear relationship. The stem states that prices of tech stocks and interest rates move in opposite directions, not the same direction that would indicate a positive correlation."},"a":"A"},{"n":66,"q":"Interest payable decreased during a company’s fiscal year. Compared with the amount of cash interest payments made, interest expense is most likely:","o":{"A":"lower.","B":"the same.","C":"higher."},"f":{"A":"Correct. If the interest payable decreases during the year, then the interest expense on an accrual basis will be lower than the amount of cash interest payments. The cash paid would be the full amount of the expense plus the amounts paid to reduce the interest payable. For example,\n§Interest expense    100\n§Plus decrease in interest payable    +12\n§Cash paid for interest    112","B":"Incorrect. No change in interest payable would mean that interest expense equals cash paid for interest. In this case, interest payable has decreased.","C":"Incorrect. An increase in interest payable would mean that interest expense is higher than cash paid for interest. In this case, interest payable has decreased."},"a":"A"},{"n":67,"q":"An analyst gathers the following year-end prices for a non-dividend-paying stock that was purchased at the end of Year 1 and sold at the end of Year 3:\n§Year    Price\n§1    €6\n§2    €10\n§3    €12\nWhich of the following returns is the largest?","o":{"A":"The geometric mean annual return","B":"The arithmetic mean annual return","C":"The two-year holding period return"},"f":{"A":"Incorrect because the geometric mean return is 41.42%, less than the two-year holding period return of 100%.","B":"Incorrect because the arithmetic mean return is 43.34%, less than the two-year holding period return of 100%.","C":"Correct because the two-year holding period return is the largest of the three returns.The annual HPRs over the first and second years are, respectively:R1 = P1/P0 – 1 = €10/€6 – 1 = 66.67% and R2 = P2/P1 – 1 = €12/€10 – 1 = 20%.Two-year HPR = P2/P0 – 1 = €12/€6 – 1 = 100%.Geometric mean return RG = √[(1 + R1) × (1 + R2)] – 1 = √[(1 + 0.6667) × (1 + 0.2)] – 1 ≈ 41.42%.Arithmetic mean return RA = (R1 + R2)/2 = (66.67% + 20%)/2 = 43.34%."},"a":"C"},{"n":68,"q":"A company makes all sales on credit. According to the converged accounting standards for revenue recognition, a contract asset is most likely recognized on the seller's balance sheet when:","o":{"A":"goods or services are delivered and payment is received.","B":"payment is received in advance of transferring the goods or services.","C":"revenue is recognized related to some of the contractual performance obligations that have been met."},"f":{"A":"Incorrect because if the delivery was on credit, a related asset, such as trade or accounts receivable, is created. Later, when cash changes hands, the company’s financial records simply reflect that cash has been received to settle an account receivable.","B":"Incorrect because a contract liability, instead of contract asset, should be recognized. If consideration is received in advance of transferring good(s) or service(s), the seller presents a contract liability.","C":"Correct because when revenue is recognized, a contract asset is presented on the balance sheet. It is only at the point when all performance obligations have been met except for payment that a receivable appears on the seller’s balance sheet."},"a":"C"},{"n":69,"q":"Which of the following statements relating to the financial reporting of defined contribution pension plans is correct?","o":{"A":"The only balance sheet impact from contributions to defined-contribution plans is on an asset account","B":"Under a defined-contribution plan, company contributions to the plan are treated as an operating cash flow","C":"Defined-contribution plans require companies to make several assumptions in order to estimate their pension obligations"},"f":{"A":"Incorrect because, if some portion of the agreed-upon contribution has not been paid by fiscal year end, a liability is recognized on the balance sheet.","B":"Correct. Under a defined-contribution plan, company contribution to the plan are treated as an operating cash flow.","C":"Incorrect because defined benefit plans (not defined-contribution plans) require companies to make several assumptions in order to estimate their pension obligations."},"a":"B"},{"n":70,"q":"Line items can be expressed as a percentage of net revenue on which of the following common-size financial statements?","o":{"A":"The income statement only","B":"The statement of cash flows only","C":"Both the income statement and the statement of cash flows"},"f":{"A":"Incorrect because line items can be expressed as a percentage of net revenue in common-size analysis of both a company’s income statement and statement of cash flows.","B":"Incorrect because line items can be expressed as a percentage of net revenue in common-size analysis of both a company’s income statement and statement of cash flows.","C":"Correct because in common-size analysis of a company’s income statement, each income and expense line item is expressed as a percentage of net revenues (net sales). For the common-size cash flow statement, there are two alternative approaches. The first approach is to express each line item of cash inflow (outflow) as a percentage of total inflows (outflows) of cash, and the second approach is to express each line item as a percentage of net revenue."},"a":"C"},{"n":71,"q":"An analyst gathers the following annual returns on a stock:\n§Year    Return\n§1    5%\n§2    –2%\n§3    3%\n§4    8%\nIf the annual target return is 4%, the sample target semideviation of returns is closest to:","o":{"A":"3.0%.","B":"3.5%.","C":"4.2%."},"f":{"A":"Incorrect because it wrongly uses n, not n – 1, as denominator in calculating the target semideviation. Hence, target semideviation = sqrt(0.0037/4) = 0.0304 ≈ 3.0%.","B":"Correct because the target downside deviation, also referred to as the target semideviation, is a measure of dispersion of the observations (here, returns) below the target. The target semideviation, sTarget, is: sTarget = sqrt[Σfor all Xi≤B n (Xi − B)2 / (n − 1)]. Calculation as below: Deviation from the Deviations below  Squared Deviations\n§Year Observation    4% Target    the Target    below the Target\n§1    5%    1%    —    —\n§2    –2%    –6%    –6%    0.0036\n§3    3%    –1%    –1%    0.0001\n§4    8%    4%    —    —\n§Sum    0.0037\nHence, target semideviation = sqrt(0.0037/3) = 0.0351 ≈ 3.5%.","C":"Incorrect because it is the standard deviation, not the target semideviation. The mean is (5% +（–2%) + 3% + 8%)/4 = 3.5%. The standard deviation is sqrt{[(5% – 3.5%)2 + (–2% – 3.5%)2 + (3% – 3.5%)2 + (8% – 3.5%)2]/3} = sqrt(0.0053/3) = 0.0420 ≈ 4.2%."},"a":"B"},{"n":72,"q":"A manufacturing company decides to invest in the maintenance of its IT hardware and software. This best describes a(n):","o":{"A":"expansion project.","B":"going concern project.","C":"innovation opportunity."},"f":{"A":"Incorrect because expansion projects can be achieved by companies expanding the scale of existing activities or extending their reach into new product or service categories and markets. Expansion projects are those that increase business size, usually by investing in the development of new products or services and/or acquiring other companies.","B":"Correct because going concern projects are those investments needed to continue the company’s current operations and maintain the existing size of the business. The most common going concern projects are replacements of assets that reach the end of their useful life and spending to maintain IT hardware and software.","C":"Incorrect because a company’s management will decide to invest in a unique activity outside, or only minimally related to, the company’s strategy. This happens more often with firms that are privately held or under the control of a founding owner or significant shareholder. Whether these projects are seen as special situations offering atypical growth or investment opportunities or innovation opportunities for the company’s business or business model, these projects are likely to be at the riskier end of capital investments."},"a":"B"},{"n":73,"q":"A retailer that prepares its financial statements in accordance with IFRS has 100 office chairs in its inventory with a suggested retail price of $240 each, for which it paid a supplier an average of $200 a chair.\nDemand for the chairs has been low for quite a while, and in response the supplier has lowered its selling price to $160 each. However, the retailer estimates it can sell the chairs for $180 each if it offers free shipping to its customers. Shipping costs to the retailer are estimated to be $10 per chair, on average.\nThe total carrying amount of these 100 office chairs on the retailer’s balance sheet is closest to:","o":{"A":"$16,000.","B":"$17,000.","C":"$18,000."},"f":{"A":"Incorrect because this answer uses the $160 replacement cost.","B":"Correct because IFRS measures inventory at lower of cost and net realizable value. Net realizable value under IFRS is defined as the estimated selling price less the estimated costs necessary to get the inventory ready for sale and make the sale:\nSelling price: $180 Costs to get ready to sell: $10 (Free shipping is required in order to sell these chairs at $180) Net realizable value per chair: $170 For 100 chairs: $17,000","C":"Incorrect because costs (free shipping) to make a sale must be taken into consideration when determining net realizable value (not $180)."},"a":"B"},{"n":74,"q":"Which of the following statements is most accurate? The role of financial reporting is to:","o":{"A":"forecast future net income and cash flow.","B":"value a security for making investment decisions.","C":"provide information about a company's performance, financial position, and changes in financial position."},"f":{"A":"Incorrect because this is a role of financial analysis. In evaluating financial reports, analysts typically have a specific economic decision in mind. Examples of these decisions can include forecasting future net income and cash flow.","B":"Incorrect because this is a role of financial analysis. In evaluating financial reports, analysts typically have a specific economic decision in mind. Examples of these decisions can include valuing a security for making an investment recommendation to others. Although financial reports do not show the value of an entity they are useful in estimating the value of an entity.","C":"Correct because the role of financial statements issued by companies is to provide information about a company’s performance, financial position, and changes in financial position that is useful to a wide range of users in making economic decisions."},"a":"C"},{"n":75,"q":"Which of the following financial statement disclosures regarding inventory are required under both IFRS and US GAAP?","o":{"A":"Events leading to a reversal of a write-down","B":"The amount of any reversal of any write-down","C":"The amount of any write-down recognized as an expense"},"f":{"A":"Incorrect because reversals of prior-year write-downs are not permitted under US GAAP, so the events leading to a reversal and the amount of the reversal are not applicable under US GAAP.","B":"Incorrect because reversals of prior-year write-downs are not permitted under US GAAP, so the events leading to a reversal and the amount of the reversal are not applicable under US GAAP.","C":"Correct because both IFRS and US GAAP require disclosure of the amount of any write-down of inventories recognized as an expense during the period."},"a":"C"},{"n":76,"q":"The principal tool used to align the interests of management and shareholders is:","o":{"A":"regulation.","B":"proxy voting.","C":"compensation."},"f":{"A":"Incorrect because in practice, compensation is the principal tool used to align the interests of management and shareholders.","B":"Incorrect because in practice, compensation is the principal tool used to align the interests of management and shareholders.","C":"Correct because in practice, compensation is the principal tool used to align the interests of management and shareholders."},"a":"C"},{"n":77,"q":"The redistribution of income and wealth is most directly associated with:","o":{"A":"fiscal policy only.","B":"monetary policy only.","C":"both fiscal policy and monetary policy."},"f":{"A":"Correct because in addition, fiscal policy can be used to redistribute income and wealth.","B":"Incorrect because the redistribution of income and wealth is associated with fiscal policy and not monetary policy. Instead, monetary policy refers to government or central bank activities that are directed toward influencing the quantity of money and credit in an economy.","C":"Incorrect because the redistribution of income and wealth is associated with fiscal policy and not monetary policy. Instead, monetary policy refers to government or central bank activities that are directed toward influencing the quantity of money and credit in an economy."},"a":"A"},{"n":78,"q":"Deductible temporary differences could arise when the:","o":{"A":"taxable income exceeds accounting profit.","B":"carrying amount of an asset exceeds its tax base.","C":"financial accounting income tax expense exceeds income taxes payable."},"f":{"A":"Correct because deductible temporary differences result in a deferred tax asset when the tax base of an asset exceeds its carrying amount and, in the case of a liability, when the carrying amount of the liability exceeds its tax base. In addition, deferred tax assets, which appear on the balance sheet, arise when an excess amount is paid for income taxes (taxable income higher than accounting profit) and the company expects to recover the difference during the course of future operations.","B":"Incorrect because it results in taxable temporary difference instead of deductible temporary difference. Taxable temporary differences result in a deferred tax liability when the carrying amount of an asset exceeds its tax base and, in the case of a liability, when the tax base of the liability exceeds its carrying amount.","C":"Incorrect because it results in a taxable temporary difference instead of deductible temporary difference. Taxable temporary differences result in a deferred tax liability when the carrying amount of an asset exceeds its tax base and, in the case of a liability, when the tax base of the liability exceeds its carrying amount. In addition, deferred tax liabilities, which also appear on the balance sheet, arise when a deficit amount is paid for income taxes and the company expects to eliminate the deficit over the course of future operations. In this case, financial accounting income tax expense exceeds income taxes payable."},"a":"A"},{"n":79,"q":"Sampling error is the difference between the observed value of a statistic and the:","o":{"A":"mean of the sample.","B":"quantity it is intended to estimate.","C":"observed value of the random variable."},"f":{"A":"Incorrect because sampling error is the difference between the observed value of a statistic and the quantity it is intended to estimate as a result of using subsets of the population, and not the mean of the sample.","B":"Correct because sampling error is the difference between the observed value of a statistic and the quantity it is intended to estimate as a result of using subsets of the population.","C":"Incorrect because sampling error is the difference between the observed value of a statistic and the quantity it is intended to estimate as a result of using subsets of the population, and not the observed value of the random variable."},"a":"B"},{"n":80,"q":"An analyst estimates the following risk premiums for a long-term corporate bond:\n§Inflation premium    1.5%\nDefault risk premium  2.0%\n§Liquidity premium    1.0%\n§Maturity premium    1.5%\nIf the short-term nominal risk-free interest rate is 4.0%, the yield on the bond is closest to:","o":{"A":"6.0%.","B":"8.5%.","C":"10.0%."},"f":{"A":"Incorrect because it is the sum of the nominal risk-free rate and the default risk premium and thus does not account for other risk premiums reflected in the interest rate; 4.0% + 2.0% = 6.0% (or 1.04 × 1.02 – 1 = 6.1% if multiplicative approach is used). It is also the sum of all given risk premiums: 1.5% + 2.0% + 1.0% + 1.5% = 6.0% (or 1.015 × 1.02 × 1.01 × 1.015 – 1 = 6.1% if multiplicative approach is used), which does not account for the real risk-free interest rate. Taking the perspective of investors in analyzing market-determined interest rates, we can view an interest rate r as being composed of a real risk-free interest rate plus a set of four premiums that are required returns or compensation for bearing distinct types of risk: r = Real risk-free interest rate + Inflation premium + Default risk premium + Liquidity premium + Maturity premium.","B":"Correct because taking the perspective of investors in analyzing market-determined interest rates, we can view an interest rate r as being composed of a real risk-free interest rate plus a set of four premiums that are required returns or compensation for bearing distinct types of risk: r = Real risk-free interest rate + Inflation premium + Default risk premium + Liquidity premium + Maturity premium. Given that the sum of the real risk-free interest rate and the inflation premium is the nominal risk-free interest rate, the interest rate can be derived as r = Nominal risk-free interest rate + Default risk premium + Liquidity premium + Maturity premium = 4.0% + 2.0% + 1.0% + 1.5% = 8.5% (or 1.04 × 1.02 × 1.01 × 1.015 – 1 = 8.7% if multiplicative approach is used).","C":"Incorrect because it double counts the inflation premium by using the nominal risk-free interest rate instead of the real risk-free interest rate, wrongly calculating r = 4.0% + 1.5% + 2.0% + 1.0% + 1.5% = 10% (or 1.04 × 1.015 × 1.02 × 1.01 × 1.015 – 1 = 10.4% if multiplicative approach is used). Taking the perspective of investors in analyzing market-determined interest rates, we can view an interest rate r as being composed of a real risk-free interest rate plus a set of four premiums that are required returns or compensation for bearing distinct types of risk: r = Real risk-free interest rate + Inflation premium + Default risk premium + Liquidity premium + Maturity premium, and the sum of the real risk-free interest rate and the inflation premium is the nominal risk-free interest rate."},"a":"B"},{"n":81,"q":"An increase in which of the following will most likely allow governments to directly change income distribution?","o":{"A":"Transfer payments","B":"Flat income tax rates","C":"Infrastructure investments"},"f":{"A":"Correct because transfer payments exist to provide a basic minimum level of income for low-income households, and they also provide a means by which a government can change the overall income distribution in a society.","B":"Incorrect because with progressive income taxes rates households and corporations should pay proportionately more as their incomes rise. However, some people advocate ‘flat' tax rates, whereby all should pay the same proportion of taxable income. When a flat tax rate is applied to taxable income, the income distribution between high-income and low-income households does not change. For example, if the high-income household has 10 times as much taxable income as the low-income household, then the amount after tax for the high-income household is also 10 times as much.","C":"Incorrect because infrastructure investment would assist an economy's growth, but the direct impact on income distribution would not be clear. Government spending on infrastructure is justified on the basis of economic and social grounds. For example, to provide such services as defense that benefit all citizens equally."},"a":"A"},{"n":82,"q":"Because of significant changes in the marketplace, the demand for a company’s product has fallen and is not expected to recover to previous levels. The following information is related to the patent under which the product is produced:\n$\n§Item Description    thousands\n§Carrying value amount    36,000\nUndiscounted expected future cash 38,000 flows\nPresent value of expected future cash 32,000 flows $\n§Item Description    thousands\n§Fair value if sold    34,000\n§Costs to sell    4,000\nWhich of the following statements is most accurate? The patent is impaired under:","o":{"A":"IFRS only.","B":"both IFRS and US GAAP.","C":"US GAAP only."},"f":{"A":"Correct. Under IFRS (International Financial Reporting Standards), first determine the recoverable amount, which is the higher of:\n1. value in use (the present value of the expected future cash flows) = $32,000 or 2. fair value minus costs to sell = $34,000 – 4,000 = $30,000\nThe recoverable amount ($32,000) is lower than the carrying value ($36,000). Therefore, the asset is impaired and should be written down to that amount.Under US GAAP, to assess impairment, the carrying value ($36,000) is compared with the undiscounted expected future cash flows ($38,000). In this case, the carrying value is lower so the patent is not impaired.","B":"Incorrect because it is not impaired under US GAAP.","C":"Incorrect it is not impaired under US GAAP because the carrying value is greater than the undiscounted cash flows."},"a":"A"},{"n":83,"q":"A liquidity trap is most closely associated with:","o":{"A":"deflation.","B":"an inelastic demand for money.","C":"a positive nominal central bank policy rate."},"f":{"A":"Correct because a liquidity trap arises when the demand for money is infinitely elastic because individuals elect to hold additional money balances rather than respond to stimulative rate cuts by spending. As a result, weakening consumption leads to deflation.","B":"Incorrect because a liquidity trap is associated with an infinitely elastic (rather than inelastic) demand for money.","C":"Incorrect because a liquidity trap arises in the extreme instance under which the monetary authority has cut nominal interest rates to zero to stimulate the economy and cannot cut rates any further."},"a":"A"},{"n":84,"q":"An exchange rate between two currencies has decreased to 1.3500. If the base currency has depreciated by 7% against the price currency, the initial exchange rate between the two currencies was closest to:","o":{"A":"1.2617.","B":"1.4445.","C":"1.4516."},"f":{"A":"Incorrect. The calculation incorrectly divides the current exchange rate by 1 plus the percentage depreciation in the exchange rate: 1.3500 ÷ 1.07 = 1.2617.","B":"Incorrect. The calculation incorrectly multiplies the current exchange rate by 1 plus the percentage depreciation in the exchange rate: 1.3500 × 1.07 = 1.4445.","C":"Correct. To calculate the initial exchange rate, the current exchange rate is divided by 1 minus the percentage depreciation in the exchange rate of the base currency: 1.3500 ÷ (1 – 0.07) = 1.3500 ÷ 0.93 = 1.4516."},"a":"C"},{"n":85,"q":"If interest is tax deductible, as the tax rate increases, the after-tax cost of debt for a company:","o":{"A":"decreases.","B":"remains the same.","C":"increases."},"f":{"A":"Correct because referencing the equation rd(1 – t), if t increases, the after-tax cost of debt decreases. If interest can be deducted in full, the tax deductibility of debt reduces the effective marginal cost of debt to reflect the income shielded from taxation and the marginal cost of debt is rd(1 – t).","B":"Incorrect because referencing the equation rd(1 – t), if t increases, the after-tax cost of debt decreases, not remains the same. If interest can be deducted in full, the tax deductibility of debt reduces the effective marginal cost of debt to reflect the income shielded from taxation and the marginal cost of debt is rd(1 – t).","C":"Incorrect because referencing the equation rd(1 – t), if t increases, the after-tax cost of debt decreases, not increases. If interest can be deducted in full, the tax deductibility of debt reduces the effective marginal cost of debt to reflect the income shielded from taxation and the marginal cost of debt is rd(1 – t)."},"a":"A"},{"n":86,"q":"Firms in monopolistic competition most likely have:","o":{"A":"no pricing power.","B":"some pricing power.","C":"substantial pricing power."},"f":{"A":"Incorrect because only under perfect competition do firms have no pricing power. This is due to an absence of non-price competition combined with a standardized product, unlike monopolistic competition where firms have a differentiated product and can engage in non-price competition.","B":"Correct because firms have some but not considerable pricing power under monopolistic competition. In this market structure, sellers are able to differentiate their products but at the same time can face a large number of competitors and low barriers to entry. The result is that firms have more pricing power than they would have under perfect competition (where there is no product differentiation) but less pricing power than in an oligopoly where entry barriers are high and there are fewer sellers.","C":"Incorrect because firms only have considerable pricing power in oligopolistic or monopoly market structures. Under monopolistic competition there are still many sellers due to low entry barriers, hence firms have some but not considerable pricing power."},"a":"B"},{"n":87,"q":"Amounts recorded as deferred revenue most likely become included in income when they are:","o":{"A":"paid.","B":"earned.","C":"invoiced."},"f":{"A":"Incorrect because in situations in which a company is paid in advance for the delivery of a service or product in the future, it will recognize the cash received as an asset, but it also must recognize a liability for its obligation to deliver service or product in the future, typically referred to as deferred revenue. A deferred revenue liability account is derecognized upon the recognition of revenue when the entity satisfies its performance obligations.","B":"Correct because in situations in which a company is paid in advance for the delivery of a service or product in the future, it will recognize the cash received as an asset, but it also must recognize a liability for its obligation to deliver service or product in the future, typically referred to as deferred revenue. A deferred revenue liability account is derecognized upon the recognition of revenue when the entity satisfies its performance obligations.","C":"Incorrect because in situations in which a company is paid in advance for the delivery of a service or product in the future, it will recognize the cash received as an asset, but it also must recognize a liability for its obligation to deliver service or product in the future, typically referred to as deferred revenue. A deferred revenue liability account is derecognized upon the recognition of revenue when the entity satisfies its performance obligations."},"a":"B"},{"n":88,"q":"The role of lender of last resort in an economy is most likely fulfilled by the:","o":{"A":"government.","B":"central bank.","C":"banking system."},"f":{"A":"Incorrect because most central banks act as the banker to the government and to other banks. They also act as a lender of last resort to banks. Because the central bank effectively has the capacity to print money, it is in the position to be able to supply the funds to banks that are facing a damaging shortage.","B":"Correct because most central banks act as the banker to the government and to other banks. They also act as a lender of last resort to banks. Because the central bank effectively has the capacity to print money, it is in the position to be able to supply the funds to banks that are facing a damaging shortage.","C":"Incorrect because generally central banks are \"the supervisor of the banking system\" and act as the banker to the government and to other banks. They also act as a lender of last resort to banks. Because the central bank effectively has the capacity to print money, it is in the position to be able to supply the funds to banks that are facing a damaging shortage."},"a":"B"},{"n":89,"q":"Which of the following attributes is most accurate for a typical company in its start-up stage?","o":{"A":"Cash flows are negative","B":"The company can raise equity in public markets","C":"Debt is a significant component of the capital structure"},"f":{"A":"Correct because at this early stage, debt capital is typically not available or available only at a high cost. Most lenders require stable and positive cash flow to service debt and/or collateral to secure it. An early-stage company often has neither, making it a high-risk prospect to lenders. With cash flows that are negative and unpredictable, a typical start-up would have difficulty making regular debt payments, or 'servicing the debt.'","B":"Incorrect because early in its life, a company is typically a cash consumer. Investment is required to advance concepts through the prototype stage and into commercial production. Revenues are zero or minimal, and risk of business failure is high. The company must raise capital, and since the timing and potential for cash flow generation are highly uncertain, it will generally raise equity rather than debt. Equity for start-ups is usually sourced privately (e.g., through venture capital rather than in public markets through an IPO), in part because many stock exchange listing requirements include minimum profitability levels, which most start-ups have yet to achieve.","C":"Incorrect because at this early stage, debt capital is typically not available or available only at a high cost. Additionally, debt is a negligible component of the capital structures of most start-up companies."},"a":"A"},{"n":90,"q":"Monte Carlo simulations:","o":{"A":"require analytical pricing formulas to value securities.","B":"can be used as a complement to analytical methods.","C":"provide better insight than analytical methods in cause-and-effect relationships."},"f":{"A":"Incorrect because an important use of Monte Carlo simulation in investments is as a tool for valuing complex securities for which no analytic pricing formula is available.","B":"Correct because it is important to note that Monte Carlo simulation is a complement to analytical methods. It provides only statistical estimates, not exact results.","C":"Incorrect because analytical methods, where available, provide more insight into cause-and-effect relationships.\nRetake Review\n§90%    81    1:02    1:34:07\n§Out of 90 points    Avg Time Per Question    Time for this Attempt\nYour Answers:"},"a":"B"}],"ME3-2":[{"n":1,"q":"Valuation of a swap during its life will least likely involve the:","o":{"A":"use of replication.","B":"investor’s risk aversion.","C":"application of the principle of no arbitrage."},"f":{"A":"Incorrect because replication is used in pricing swaps.","B":"Correct because risk neutrality, not risk aversion, is a key element of derivatives pricing, including swaps. Risk aversion is not involved in pricing swaps.","C":"Incorrect because the principle of no arbitrage is applied in pricing swaps."},"a":"B"},{"n":2,"q":"A passive investment strategy most likely outperforms an active investment strategy when:","o":{"A":"there are few market participants.","B":"asset prices reflect information quickly.","C":"intrinsic values are less than market values."},"f":{"A":"Incorrect because a large number of investors (individual and institutional) follow the major financial markets closely on a daily basis, and if mispricings exist in these markets investors will act so that these mispricings disappear quickly. A low number of participants contributes to a market's inefficiency, which in turn provides an opportunity for active rather than passive investment. If investors believe a market is highly efficient, they will usually accept market prices as accurately reflecting intrinsic values.","B":"Correct because an efficient market is a market in which asset prices reflect new information quickly and rationally. In a highly efficient market, a passive investment strategy (i.e., buying and holding a broad market portfolio) that does not seek superior risk-adjusted returns is preferred to an active investment strategy because of lower costs (for example, transaction and information-seeking costs).","C":"Incorrect because if investors believe a market is highly efficient, they will usually accept market prices as accurately reflecting intrinsic values. Active investors seek to own assets selling below perceived intrinsic value in the marketplace and to sell or sell short assets selling above perceived intrinsic value."},"a":"B"},{"n":3,"q":"A bond that allows the issuer to pay interest in the form of additional amounts of the existing bond issue rather than a cash payment best describes a:","o":{"A":"step-up coupon bond.","B":"deferred coupon bond.","C":"payment-in-kind coupon bond."},"f":{"A":"Incorrect because the coupon of a step-up coupon bond, which may be fixed or floating, increases by specified margins at specified dates. It does not allow the issuer to pay interest in the form of additional amounts of the bond issue in lieu of a cash payment.","B":"Incorrect because a deferred coupon bond, sometimes called a split coupon bond, pays no coupons for its first few years but then pays a higher coupon than it otherwise normally would for the remainder of its life. It does not allow the issuer to pay interest in the form of additional amounts of the bond issue in lieu of a cash payment.","C":"Correct because a payment-in-kind (PIK) coupon bond typically allows the issuer to pay interest in the form of additional amounts of the bond issue rather than as a cash payment."},"a":"C"},{"n":4,"q":"The justified forward P/E ratio calculated based on the Gordon growth model is always positively related to the:","o":{"A":"payout ratio.","B":"dividend growth rate.","C":"required rate of return."},"f":{"A":"Incorrect because based on the Gordon growth model, the justified forward P/E is calculated by dividing the dividend payout ratio by the difference between the required rate of return and dividend growth rate. The P/E and the payout ratio appear to be positively related. This relationship may not be true, however, because a higher payout ratio may imply a slower growth rate as a result of the company retaining a lower proportion of earnings for reinvestment.","B":"Correct because, based on the Gordon growth model, the justified forward P/E is calculated by dividing the dividend payout ratio by the difference between the required rate of return and dividend growth rate. The P/E is inversely related to the required rate of return and positively related to the growth rate; that is, as the required rate of return increases, the P/E declines, and as the growth rate increases, the P/E increases.","C":"Incorrect because, based on the Gordon growth model, the justified forward P/E is calculated by dividing the dividend payout ratio by the difference between the required rate of return and dividend growth rate. The P/E is inversely related to the required rate of return. As the required rate of return increases, the P/E declines."},"a":"B"},{"n":5,"q":"With respect to leveraged buyouts, the current management team will continue to manage the company in:","o":{"A":"management buy-ins only.","B":"management buyouts only.","C":"both management buy-ins and management buyouts."},"f":{"A":"Incorrect because the leveraged buyout may also be of a specific type. In management buyouts (MBOs), the current management team is involved in the acquisition, and in management buy-ins (MBIs), the current management team is being replaced and the acquiring team will be involved in managing the company.","B":"Correct because the leveraged buyout may also be of a specific type. In management buyouts (MBOs), the current management team is involved in the acquisition, and in management buy-ins (MBIs), the current management team is being replaced and the acquiring team will be involved in managing the company.","C":"Incorrect because the leveraged buyout may also be of a specific type. In management buyouts (MBOs), the current management team is involved in the acquisition, and in management buy-ins (MBIs), the current management team is being replaced and the acquiring team will be involved in managing the company."},"a":"B"},{"n":6,"q":"Electronic trading in cryptocurrencies on centralized exchanges is most likely:","o":{"A":"hosted on public servers.","B":"direct without any intermediating broker or dealer.","C":"regulated to the same standard as exchanges for more traditional assets."},"f":{"A":"Incorrect because trading is hosted on private servers, exposing the centralized exchanges and their clients to security vulnerabilities.","B":"Correct because trading is electronic and direct, without any intermediating broker or dealer.","C":"Incorrect because unlike the exchanges for more traditional assets, such as equity securities and futures contracts, cryptocurrency and cryptocurrency trading venues are largely unregulated, and individuals or groups may engage in fraud or market manipulation."},"a":"B"},{"n":7,"q":"Which of the following objectives of a client's IPS is best described as a relative risk objective? For the next year, a client's portfolio objective is to:","o":{"A":"have a 95% value at risk that is less than $100,000.","B":"outperform the local stock market index by 100 basis points.","C":"earn a return within plus or minus 2 percentage points of the local stock market index return."},"f":{"A":"Incorrect because value at risk is an absolute risk measure, not a relative one. Examples of an absolute risk objective would be a desire not to suffer any loss of capital or not to lose more than a given percentage of capital in any 12-month period. For example, the desire not to lose more than 4% of capital in any 12-month period might be restated as an objective that with 95% probability the portfolio not lose more than 4% in any 12-month period. Measures of absolute risk include the variance or standard deviation of returns and value at risk.","B":"Incorrect because it represents a relative return objective, not a relative risk objective. The return objective can be stated on a relative basis—for example, relative to a benchmark return. The benchmark could be an equity market index, such as the S&P 500 or the FTSE 100, or a cash rate of interest. A relative return objective might be stated as, for example, a desire to outperform the benchmark index by one percentage point per year.","C":"Correct because some clients may choose to express relative risk objectives, which relate risk relative to one or more benchmarks perceived to represent appropriate risk standards. When a policy portfolio is used, the risk objective may be expressed as a desire for the portfolio return to be within a band of plus or minus X% of the benchmark return calculated by assigning an index or benchmark to represent each asset class present in the policy portfolio. Again, this objective may be more usefully interpreted as a statement of probability—for example, a 95% probability that the portfolio return will be within X% of the benchmark return over a stated period."},"a":"C"},{"n":8,"q":"Which of the following is not a credit enhancement in asset-backed securities?","o":{"A":"Credit tranching","B":"Overcollateralization","C":"Representations and warranties"},"f":{"A":"Incorrect because credit tranching is a form of credit enhancement in ABS structures. It is common for securitizations to include a form of internal credit enhancement called subordination, also referred to as credit tranching.","B":"Incorrect because overcollateralization is a form of credit enhancement in ABS structures. Credit enhancements are provisions that are used to reduce the credit risk of a bond issue. They include (1) internal credit enhancements, such as subordination, overcollateralization, and reserve accounts, and (2) external credit enhancements, such as financial guarantees by banks or insurance companies, letters of credit, and cash collateral accounts.","C":"Correct because representations and warranties are only provisions in the legal documentation of an ABS, not a credit enhancement. An important legal document is the purchase agreement between the seller of the collateral and the SPE, which sets forth the representations and warranties that the seller makes about the assets sold. These representations and warranties assure investors about the quality of the assets, an important consideration when assessing the risks associated with the ABS."},"a":"C"},{"n":9,"q":"A bond has an annual modified duration of 5.359, an annual convexity of 248.23, and is currently yielding 3.5%. If the bond’s yield-to-maturity increases to 3.7%, the expected percentage price change is closest to:","o":{"A":"–1.02%.","B":"–0.97%","C":"1.12%."},"f":{"A":"Correct because the expected price change is: %ΔPVFull ≈ (– AnnModDur x chg.Yield) + [1/2 x AnnConvexity x (ΔYield)2] = (–5.359 x 0.002) + [1/2 x 248.230 x (0.002)2] ≈ –0.01022 ≈ –1.02%.","B":"Incorrect because the expected price change is: %ΔPVFull ≈ (– AnnModDur x chg.Yield) + [1/2 x AnnConvexity x (ΔYield)2]. This answer fails to multiply the second term by 1/2: (–5.359 x 0.002) + [248.230 x (0.002)2] ≈ –0.00973 ≈ –0.97%.","C":"Incorrect because the expected price change is: %ΔPVFull ≈ (– AnnModDur x chg.Yield) + [1/2 x AnnConvexity x (ΔYield)2]. This answer ignores the negative sign in front of the AnnModDur term: (5.359 x 0.002) + [1/2 x 248.230 x (0.002)2] = 0.01121 ≈ 1.12%."},"a":"A"},{"n":10,"q":"In limited partnership agreements, which of the following benefits the general partner? A:","o":{"A":"catch-up clause.","B":"clawback provision.","C":"high-water mark clause."},"f":{"A":"Correct because catch-up clauses benefit general partners. A catch-up clause allows the GP to receive 100% of the distributions above the hurdle rate until 20% (i.e., the performance fee) of the profits generated is received, and then every excess dollar is split 80/20 between the LPs and GP. By contrast, absent a catch-up clause, the entire distribution above the hurdle rate is split 80/20 between the LPs and GP, reducing the GP’s return. Hence, a catch-up clause benefits the GP.","B":"Incorrect because clawback provisions benefit limited partners by allowing them to clawback prior incentive fees. A clawback provision reflects the right of LPs to reclaim part of the GP’s performance fee if a GP ever accrues (or actually pays itself) an incentive fee on gains that are not yet fully realized and then subsequently gives back these gains, an investor is typically able to claw back prior incentive fee accruals and payments. Hence, a clawback provision benefits the investors, not the general partners.","C":"Incorrect because high-water marks protect the clients (i.e., limited partners) who invest with general partners. A high-water mark clause states that a hedge fund manager must recuperate declines in value from the high-water mark before performance fees can be charged on newly generated profits. The use of high-water marks protects clients from paying twice for the same performance. Hence, a high-water mark benefits the limited partners, not the general partners."},"a":"A"},{"n":11,"q":"Which of the following methods of investing in alternative investments requires the least amount of investment expertise?","o":{"A":"Co-investing","B":"Fund investing","C":"Direct investing"},"f":{"A":"Incorrect because one of the advantages of fund investing is that it provides access to alternative investments without possessing a high degree of investment expertise. On the other hand, co-investing requires more active involvement compared with fund investing, which can be challenging if resources and due diligence experience are limited. Co-investing requires more active involvement from the investor, who must evaluate both investment opportunities and the fund manager, which demands more resources, concentration, and expertise.","B":"Correct because one of the advantages of fund investing is that it provides access to alternative investments without possessing a high degree of investment expertise.","C":"Incorrect because one of the advantages of fund investing is that it provides access to alternative investments without possessing a high degree of investment expertise, whereas direct investing requires more investment expertise and a higher level of financial sophistication compared with fund investing and co-investing."},"a":"B"},{"n":12,"q":"The first decision when constructing a security market index is most likely:","o":{"A":"identifying the target market.","B":"identifying the investment universe.","C":"determining the constituent securities."},"f":{"A":"Correct because the first decision in index construction is identifying the target market, market segment, or asset class that the index is intended to represent.","B":"Incorrect because identifying the investment universe for inclusion is the second step when creating an index. The target market determines the investment universe and the securities available for inclusion in the index.","C":"Incorrect because determining the constituent securities is the last―not first―decision to be made when creating an index. Identifying the target market is the first decision and determines the investment universe and the securities available for inclusion in the index."},"a":"A"},{"n":13,"q":"The assets underlying an infrastructure investment are most likely:","o":{"A":"intended for private use.","B":"owned by a government entity.","C":"expected to have a short operational life."},"f":{"A":"Incorrect because infrastructure investments are intended for public, not private use. Infrastructure investments are real, capital-intensive, and long-lived assets intended for public use and provide essential services.","B":"Correct because most infrastructure assets are financed, owned, and operated by governments.","C":"Incorrect because infrastructure assets are typically long-lived, as opposed to having a short operational life. Infrastructure investments are real, capital-intensive, and long-lived assets intended for public use and provide essential services."},"a":"B"},{"n":14,"q":"During times of severe market turmoil, the risk reduction from portfolio diversification most likely:","o":{"A":"decreases.","B":"remains the same.","C":"increases."},"f":{"A":"Correct because although portfolio diversification generally does reduce risk, it does not necessarily provide the same level of risk reduction during times of severe market turmoil as it does when the economy and markets are operating ‘normally.' In fact, if the economy or markets fail totally (which has happened numerous times around the world), then diversification is a false promise.","B":"Incorrect because although portfolio diversification generally does reduce risk, it does not necessarily provide the same level of risk reduction during times of severe market turmoil as it does when the economy and markets are operating ‘normally.' In fact, if the economy or markets fail totally (which has happened numerous times around the world), then diversification is a false promise.","C":"Incorrect because although portfolio diversification generally does reduce risk, it does not necessarily provide the same level of risk reduction during times of severe market turmoil as it does when the economy and markets are operating ‘normally.' In fact, if the economy or markets fail totally (which has happened numerous times around the world), then diversification is a false promise."},"a":"A"},{"n":15,"q":"Free-cash-flow-to-equity is equal to cash flow from operations:","o":{"A":"less fixed capital investment less net borrowing.","B":"less fixed capital investment plus net borrowing.","C":"plus fixed capital investment less net borrowing."},"f":{"A":"Incorrect because free-cash-flow-to-equity (FCFE) can be expressed as FCFE = CFO – FCInv + Net borrowing (not minus net borrowing) where CFO is cash flow from operations and FCInv is fixed capital investment.","B":"Correct because free-cash-flow-to-equity (FCFE) can be expressed as FCFE = CFO – FCInv + Net borrowing where CFO is cash flow from operations and FCInv is fixed capital investment.","C":"Incorrect because free-cash-flow-to-equity (FCFE) can be expressed as FCFE = CFO – FCInv (not plus FCInv) + Net borrowing (not minus net borrowing) where CFO is cash flow from operations and FCInv is fixed capital investment."},"a":"B"},{"n":16,"q":"A 5% corporate bond makes annual coupon payments on 19 March of each year. If the bond is priced for settlement on 25 March at a yield-to-maturity of 5%, its flat price is:","o":{"A":"below par.","B":"par.","C":"above par."},"f":{"A":"Correct because the flat price of the bond is below par value, even though the coupon rate and the yield-to-maturity are equal, because the accrued interest does not take into account the time value of money (and the flat price is the full price minus accrued interest). The accrued interest is the portion of the next coupon payment owed to the seller of a bond, because although the seller held the bond for a partial coupon period, the full coupon will be received by the buyer. Note that the accrued interest portion of the full price does not depend on the yield-to-maturity. Therefore, it is only the flat price that is affected by a change in interest rates.","B":"Incorrect because the flat price of the bond is below par value, even though the coupon rate and the yield-to-maturity are equal, because the accrued interest does not take into account the time value of money. Note that the accrued interest portion of the full price does not depend on the yield-to-maturity. Therefore, it is only the flat price that is affected by a change in interest rates.","C":"Incorrect because the flat price of the bond is a little below par value, even though the coupon rate and the yield-to-maturity are equal, because the accrued interest does not take into account the time value of money."},"a":"A"},{"n":17,"q":"A good risk management framework:","o":{"A":"is a top-down process and guidance directing risk management activities.","B":"seeks to prioritize avoidance of financial loss over defining policies and processes.","C":"is typically a process that addresses a common set of factors within different organizations."},"f":{"A":"Incorrect. Risk governance is the top-down process and guidance that directs risk management activities to align with and support the overall enterprise.","B":"Incorrect. A good risk management framework prioritizes the definition of policies and procedures over avoidance of financial loss.","C":"Correct. Good risk management may not prevent losses but provides a framework that addresses common factors, such as risk governance, risk infrastructure, policies and procedures, risk monitoring, and integration, among others. A risk management framework flows logically from the definition of risk management that was previously given: It is the infrastructure, process, and analytics needed to support effective risk management in an organization. This process should fully integrate the “risk” and “return” aspects of the enterprise into decisions in support of best achieving its goals within its tolerance for risk. Risk management is not a “one-size-fits-all” solution; it is integral to the enterprise’s goals and needs. Despite customization, every risk management framework should address the common factors listed above."},"a":"C"},{"n":18,"q":"Indifference curves are plotted on a graph, with returns on the vertical axis and risk on the horizontal axis. For a risk-averse investor, the slope of the indifference curve is most likely:","o":{"A":"negative.","B":"zero.","C":"positive."},"f":{"A":"Incorrect because the risk-loving investor's indifference curve exhibits a negative slope, implying that the risk-lover is happy to substitute risk for return.","B":"Incorrect because the indifference curves of risk-neutral investors are horizontal (flat) because the utility is invariant with risk.","C":"Correct because the indifference curve for risk-averse investors runs from the southwest to the northeast because of the risk–return trade–off. If risk increases (going east) then it must be compensated by higher return (going north) to generate the same utility. The greater the slope, the higher is the risk aversion of the investor as a greater increment in return is required to accept a given increase in risk."},"a":"C"},{"n":19,"q":"In the binomial option model, when the volatility of the underlying increases, the value of a call option:","o":{"A":"decreases.","B":"remains unchanged.","C":"increases."},"f":{"A":"Incorrect because if volatility increases, the difference between S1 + and S1 − increases, which widens the range between c1 + and c1 −, leading to a higher option value. So, the option value will increase, not decrease.","B":"Incorrect because if volatility increases, the difference between S1 + and S1 − increases, which widens the range between c1 + and c1 −, leading to a higher option value. So, the option value will increase, not remain unchanged.","C":"Correct because if volatility increases, the difference between S1 + and S1 − increases, which widens the range between c1 + and c1 −, leading to a higher option value."},"a":"C"},{"n":20,"q":"A corporation issues 5-year fixed-rate bonds. Its treasurer expects interest rates to decline for all maturities for at least the next year. She enters into a 1-year agreement with a bank to receive quarterly fixed-rate payments and to make payments based on floating rates benchmarked on 3-month Libor. This agreement is best described as a:","o":{"A":"swap.","B":"futures contract.","C":"forward contract."},"f":{"A":"Correct because a swap is an agreement between two parties to exchange a series of future cash flows. In this case, the corporation receives fixed interest rate payments and makes variable interest rate payments. Given that the contract is for one year and the floating rate is based on three-month Libor, at least four payments will be made during the year.","B":"Incorrect because a forward contract includes one payment only. The swap described has a series of four quarterly payments.","C":"Incorrect because the instrument described is a swap."},"a":"A"},{"n":21,"q":"A trader buys 500 shares of a stock on margin at $36 a share using an initial leverage ratio of 1.66. The maintenance margin requirement for the position is 30%. The stock price at which the margin call will occur is closest to:","o":{"A":"$20.57.","B":"$25.20.","C":"$30.86."},"f":{"A":"Correct because initial equity (%) in the margin transaction = 1/Leverage ratio = 1/1.66 = 0.60. Initial equity per share at the time of purchase = $36 × 0.60 = $21.60Price (P) at which margin call\n§occurs:    Equity per share/Price per share = Maintenance margin\n§(%)    ($21.60 + P – $36)/P = 0.30    0.7P = $14.40    P = $20.57","B":"Incorrect because it takes (1 – maintenance margin %) of the initial price as the critical price for margin call: $36 × (1 – 0.3) = $25.20.","C":"Incorrect because it calculates the initial equity per share at the time of purchase = $36 × 0.40 = $14.40 (where 0.4 is the incorrect %\n§of initial equity).Price at which margin call occurs:    Equity per share/Price per\n§share = Maintenance margin %    ($14.40 + P – $36)/P = 0.30    0.7P =\n§$21.60    P = $30.86"},"a":"A"},{"n":22,"q":"The type of developed market bond that most likely has the greatest risk of default is a:","o":{"A":"revenue bond.","B":"sovereign bond.","C":"general obligation bond."},"f":{"A":"Correct because revenue bonds have greater risk than both sovereign debt and general obligation bonds. Government bonds in developed countries have traditionally been viewed as the default risk-free rate off of which all other credits are priced. Revenue bonds, which are issued to finance a specific project, have a higher degree of risk than GO (general obligation) bonds because they are dependent on a single source of revenue.","B":"Incorrect because sovereign debt in developed markets is the least risky among bond market segments because sovereigns have the ability to use monetary policy, unlike non-sovereign governments. Government bonds in developed countries have traditionally been viewed as the default risk-free rate off of which all other credits are priced.","C":"Incorrect because general obligation bonds are less risky than revenue bonds but more risky than sovereign debt. Government bonds in developed countries have traditionally been viewed as the default risk-free rate off of which all other credits are priced. Revenue bonds, which are issued to finance a specific project, have a higher degree of risk than GO (general obligation) bonds because they are dependent on a single source of revenue."},"a":"A"},{"n":23,"q":"An index provider launches a new index that will include value stocks in a specific country. This index will most likely be a:","o":{"A":"style index.","B":"large-capitalization index.","C":"fundamentally weighted index."},"f":{"A":"Correct because style indexes represent a group of securities classified according to market capitalization, value, and growth or a combination of these characteristics. Therefore, the new index will most likely be a style index with a value classification.","B":"Incorrect because large-capitalization indexes represent and track the largest securities in terms of market capitalization. They do not represent the category of value stocks.","C":"Incorrect because fundamentally weighted indexes use measures such as book value, cash flow, revenues, earnings, dividends, and number of employees to weight the constituent securities. Securities of different styles and sectors could be included in the same fundamentally weighted index. Therefore, fundamentally weighted indexes do not represent the category of value stocks."},"a":"A"},{"n":24,"q":"If a market is semi-strong-form efficient, fundamental analysis most likely:","o":{"A":"enables investors to generate consistent abnormal returns.","B":"helps participants understand the value implications of information.","C":"attempts to profit by looking at patterns of prices and trading volumes."},"f":{"A":"Incorrect because if securities markets are weak-form and semi-strong-form efficient, the implication is that active trading, whether attempting to exploit price patterns or public information, is not likely to generate abnormal returns. And, although fundamental analysis requires costly information, this analysis can be profitable in terms of generating abnormal returns if the analyst creates a comparative advantage with respect to this information; however, this is not \"most likely\". Portfolio managers cannot beat the market on a consistent basis.","B":"Correct because fundamental analysis is necessary in a well-functioning market because this analysis helps market participants understand the value implications of information.","C":"Incorrect because fundamental analysis is the examination of publicly available information and the formulation of forecasts to estimate the intrinsic value of assets. Instead, investors using technical analysis attempt to profit by looking at patterns of prices and trading volumes."},"a":"B"},{"n":25,"q":"The yield-to-maturity of a 5-year, 8% annual-pay bond priced at 108.42 is closest to:","o":{"A":"6.00%.","B":"7.38%.","C":"9.40%."},"f":{"A":"Correct because the yield-to-maturity is the discount rate, r, that equates the price of the bond to the present value of the coupon payments and par value: 8/(1+r) + 8/(1+r)2 + 8/(1+r)3 + 8/(1+r)4 + 108/(1+r)5 = 108.42, r = 6.00%. N=5, PV= – 108.42, PMT=8, FV=100, I/Y = 6.00%.","B":"Incorrect because the yield-to-maturity is the discount rate, r, that equates the price of the bond to the present value of the coupon payments and par value. This answer computes the current yield instead of the yield to maturity. The current yield is the sum of the coupon payments received over the year divided by the flat price. 8/108.42 ≈ 7.38%.","C":"Incorrect because the yield-to-maturity is the discount rate, r, that equates the pri
