lying. Therefore, the maximum loss to the put seller occurs when ST = 0, in which case the profit to the seller is –Max(0,$15 – 0) + $0.90 = –$15 + $0.90 = –$14.10 which is equal to a loss of $14.10. This loss is greater than the loss of the other two responses.","B":"Incorrect because the largest dollar amount loss out of the three answer options is $14.10, which occurs for the case of selling a put with a strike price of $15 for $0.90. In the case of this response (buying a call with a strike price of $15 for $11.25, the profit to the call buyer is Π = Max(0,ST – X) – c0, where c0 is the call price or premium paid by the call buyer. A call buyer is subject to limited loss and unlimited gains. The maximum loss occurs when ST ≤ X, in which case the profit is –c0 which is equal to a loss of c0. Therefore, the maximum loss is c0 = $11.25, which is less than $14.10.","C":"Incorrect because the largest dollar amount loss out of the three answer options is $14.10, which occurs for the case of selling a put with a strike price of $15 for $0.90. In the case of this response (buying a put with a strike price of $37.50 for $12.75), the profit to the put buyer is equal to Π = Max(0,X – ST) – p0. The put buyer has a limited loss, with a maximum loss occurring when ST ≥ X, in which case the profit is –p0, which is a loss of p0. Therefore, the maximum loss is p0 = 12.75, which is less than $14.10."},"a":"A"},{"n":42,"q":"When securitizing a corporation’s loans, a special purpose entity most likely:","o":{"A":"services the corporation’s loans.","B":"sells the collateral underlying the corporation’s loans.","C":"purchases the corporation’s loans to use as collateral."},"f":{"A":"Incorrect because the SPE purchases the loans or receivables and uses them as collateral to issue the ABS.","B":"Incorrect because the seller of the collateral is sometimes called the depositor. The SPE purchases the loans or receivables and uses them as collateral to issue the ABS.","C":"Correct because the SPE purchases the loans or receivables and uses them as collateral to issue the ABS."},"a":"C"},{"n":43,"q":"All else being equal, which of the following securities is the most risky for an investor?","o":{"A":"Putable preference shares","B":"Callable preference shares","C":"Non-callable preference shares"},"f":{"A":"Incorrect because putable preference shares are less risky than callable preference shares. For example, from an investor's point of view, putable common or preference shares are less risky than their callable or non-callable counterparts because they give the investor the option to sell the shares to the issuer at a pre-determined price.","B":"Correct because callable common or preference shares are riskier than their non-callable counterparts because the issuer has the option to redeem the shares at a pre-determined price.","C":"Incorrect because non-callable preference shares are less risky than callable preference shares."},"a":"B"},{"n":44,"q":"An investor analyzes the stock market of a specific country and discovers that the stock prices are very slow to reflect new information. The investor can best profit from this situation using a(n):","o":{"A":"active fund.","B":"passive fund.","C":"low cost approach."},"f":{"A":"Correct. In an efficient market, asset prices reflect new information quickly. Conversely, an inefficient market reflects new information slowly. In a very inefficient market, as implied in this situation, opportunities may exist for active investment strategies (such as those used by active funds) to achieve superior risk-adjusted returns as compared with passive investment strategies (such as those used by equity index funds or passive funds).","B":"Incorrect. An efficient market is a market in which asset prices reflect new information quickly. Conversely, an inefficient market reflects new information slowly. In a very inefficient market, as implied in this situation, opportunities may exist for active investment strategies (such as those employed by active funds) to achieve superior risk-adjusted returns as compared with passive investment strategies (such as those employed by equity index funds or passive funds).","C":"Incorrect. An efficient market is a market in which asset prices reflect new information quickly. Conversely, an inefficient market reflects new information slowly. In a very inefficient market, as implied in this situation, opportunities may exist for active investment strategies (such as those employed by active funds) to achieve superior risk-adjusted returns despite higher costs as compared with passive investment strategies (such as those employed by equity index funds or passive funds)."},"a":"A"},{"n":45,"q":"If a bond has a modified duration of 7.1 and convexity of 49.2, the percentage change in price for a 50 basis point increase in yield is closest to:","o":{"A":"–3.61%.","B":"–3.49%.","C":"–1.65%."},"f":{"A":"Incorrect because the %ΔPVFull ≈ (-AnnModDur × ΔYield) + (1/2 AnnConvexity × (ΔYield)2). This incorrect answer subtracts the convexity. Using the data provided, (–7.1 × 0.005) – (1/2 × 49.2 × (0.005)2 = –0.0355 –0.00062 = –0.03612 ≈ –0.0361 or –3.61%.","B":"Correct because the %ΔPVFull ≈ (-AnnModDur × ΔYield) + (1/2 AnnConvexity × (ΔYield)2). Using the data provided, (– 7.1 × 0.005) + (1/2 × 49.2 × (0.005)2 = – 0.0355 + 0.00062 = –0.03488 ≈ –0.0349 or 3.49%.","C":"Incorrect because the %ΔPVFull ≈ (-AnnModDur × ΔYield) + (1/2 AnnConvexity × (ΔYield)2). This incorrect answer multiplies the wrong side of the equation by 1/2 to be (-–7.1 × 0.005 × 1/2) + 49.2 × (0.005)2 = -–0.01775 + 0.00123 = –0.01652 or –1.65%."},"a":"B"},{"n":46,"q":"An analyst gathers the following information about a portfolio:\n§Security    Standard Deviation  Portfolio Weight\n§A    16%    60%\n§B    27%    40%\nIf the portfolio's standard deviation of returns is 20.4%, the correlation between the securities is closest to:","o":{"A":"−1.","B":"0.","C":"1."},"f":{"A":"Incorrect because using a correlation of -1 to calculate standard deviation results in a standard deviation of\n§10.3%    = 10.3%","B":"Incorrect because using a correlation of 0 to calculate standard deviation results in a standard deviation of\n§14.45%    = 14.45%","C":"Correct because using a correlation of 1 to calculate standard deviation results in a standard deviation of\n§20.4%    = 20.4%"},"a":"C"},{"n":47,"q":"The capital asset pricing model (CAPM) is based on the assumption that investors are risk:","o":{"A":"averse.","B":"neutral.","C":"seeking."},"f":{"A":"Correct because the capital asset pricing model is based on the assumption that investors are risk-averse, utility-maximizing, rational individuals.","B":"Incorrect because the capital asset pricing model is based on the assumption that investors are risk-averse, utility-maximizing, rational individuals.","C":"Incorrect because the capital asset pricing model is based on the assumption that investors are risk-averse, utility-maximizing, rational individuals."},"a":"A"},{"n":48,"q":"A buy-and-hold investor purchases a fixed-rate bond at issuance and holds it until maturity. With respect to interest rate risk, this investor is exposed to:","o":{"A":"market price risk only.","B":"coupon reinvestment risk only.","C":"both market price risk and coupon reinvestment risk."},"f":{"A":"Incorrect because market price risk matters more when the investor has a short-term horizon relative to the time-to-maturity. For example, an investor who sells the bond before the first coupon is received has only market price risk.","B":"Correct because coupon reinvestment risk matters more when the investor has a long-term horizon relative to the time-to-maturity of the bond. For instance, a buy-and-hold investor only has coupon reinvestment risk.","C":"Incorrect because coupon reinvestment risk matters more when the investor has a long-term horizon relative to the time-to-maturity of the bond. For instance, a buy-and-hold investor only has coupon reinvestment risk."},"a":"B"},{"n":49,"q":"The value effect anomaly:","o":{"A":"contradicts semi-strong market efficiency.","B":"was identified using time series of data only.","C":"states that growth stocks have consistently outperformed value stocks."},"f":{"A":"Correct because the value stock anomaly contradicts semi-strong market efficiency because all the information used to categorize stocks in this manner is publicly available.","B":"Incorrect because the anomalies are placed into categories because based on the research method that identified the anomaly. Time-series anomalies were identified using time series of data. Cross-sectional anomalies were identified based on analyzing a a cross section of companies that differ on some key characteristics. The value effect was found based on cross-sectional analysis.","C":"Incorrect because the value stock anomaly refers to the studies that have shown that value stocks have consistently outperformed growth stocks over long periods of time."},"a":"A"},{"n":50,"q":"A bond's price sensitivity to a non-parallel shift in the benchmark yield curve is best measured by:","o":{"A":"key rate duration.","B":"effective duration.","C":"modified duration."},"f":{"A":"Correct because key rate duration (or partial duration) is a measure of a bond’s sensitivity to a change in the benchmark yield curve at a specific maturity segment. In contrast to effective duration, key rate durations help identify 'shaping risk' for a bond—that is, a bond’s sensitivity to changes in the shape of the benchmark yield curve (e.g., the yield curve becoming steeper or flatter, i.e. a non-parallel shift as opposed to a parallel shift).","B":"Incorrect because effective duration is a curve duration statistic in that it measures interest rate risk in terms of a parallel shift in the benchmark yield curve.","C":"Incorrect because approximate modified duration is a yield duration statistic in that it measures interest rate risk in terms of a change in the bond’s own yield-to-maturity. It is a measure tied to an individual bond, not the benchmark yield curve. It also assumes a parallel shift in rates."},"a":"A"},{"n":51,"q":"Which of the following instruments is most likely to offer investors some protection against increases in the market interest rate?","o":{"A":"Fixed-rate bonds","B":"Floating-rate notes","C":"Inverse floating-rate notes"},"f":{"A":"Incorrect because fixed-rate bonds will decline in value when the market interest rate increases. The price of a fixed-rate bond will change as the interest rate used to discount future cash flows changes. For any time-value-of-money calculation, a higher discount rate results in a lower present value for any fixed future cash flow and a lower discount rate results in a higher present value. Therefore, bond yields-to-maturity and prices move in opposite directions.","B":"Correct because bonds with variable interest payments are called floating-rate notes (FRNs). Floating-rate notes will be less affected when market interest rates increase because the coupon rate varies directly with market interest rates and is reset at regular intervals.","C":"Incorrect because floating-rate tranches can also be structured as inverse floaters, where the interest paid changes in the opposite direction of the change in interest rates. They are used to hedge interest rate risk in portfolios. When market interest rates increase, the coupon rate on an inverse floating-rate note will fall."},"a":"B"},{"n":52,"q":"An investor gathers the following information about a portfolio and the risk-free asset:\n§Average portfolio return    8.50%\nPortfolio standard deviation of 16.00% returns\n§Portfolio beta    1.10\n§Risk-free asset return    1.75%\nThe portfolio's Sharpe ratio is closest to:","o":{"A":"0.06.","B":"0.42.","C":"0.53."},"f":{"A":"Incorrect because it is the Treynor ratio, not the Sharpe ratio, for the portfolio. Treynor ratio = (Rp – Rf)/βp = (8.50% – 1.75%)/1.10 = 0.0614 ≈ 0.06.","B":"Correct because the Sharpe ratio is determined by using the following equation: SR = (Rp – Rf)/σp = (8.50% – 1.75%)/16.00% = 0.4219 ≈ 0.42.","C":"Incorrect because it omits the risk-free rate from the calculation for the Sharpe ratio; (8.50% – 0%)/16.00% = 0.5313 ≈ 0.53."},"a":"B"},{"n":53,"q":"Which of the following types of investors most likely has a long-term investment time horizon and high liquidity needs?","o":{"A":"Endowments","B":"Life insurance companies","C":"Defined benefit pension plans"},"f":{"A":"Incorrect because while endowments have a very long term investment time horizon, they generally have low liquidity needs.","B":"Correct because life insurance companies have a long term investment time horizon and high liquidity needs to meet claims.","C":"Incorrect because while defined benefit pension plans have a very long term investment time horizon, they generally have low liquidity needs."},"a":"B"},{"n":54,"q":"All else being equal, which of the following bonds most likely has the lowest price?","o":{"A":"Putable bond","B":"Callable bond","C":"Option-free bond"},"f":{"A":"Incorrect, as because a put provision has value to the bondholders, the price of a putable bond will be higher than the price of an otherwise similar bond issued without the put provision. Similarly, the yield on a bond with a put provision will be lower than the yield on an otherwise similar non-putable bond. The lower yield compensates the issuer for the value of the put option to the investor.","B":"Correct because callable bonds are advantageous to the issuer of the security. Put another way, the call option has value to the issuer. For this reason, callable bonds have to offer a higher yield and sell at a lower price than otherwise similar non-callable bonds.","C":"Incorrect callable bonds have to offer a higher yield and sell at a lower price than otherwise similar non-callable bonds."},"a":"B"},{"n":55,"q":"Using the rating scale from Standard & Poor's or Fitch, the lowest rating for an investment-grade bond is:","o":{"A":"BBB–.","B":"BBB.","C":"BBB+."},"f":{"A":"Correct because bonds rated Baa3 or higher by Moody's and BBB– or higher by Standard & Poor's and Fitch are considered investment grade.","B":"Incorrect because bonds rated Baa3 or higher by Moody's and BBB– or higher by Standard & Poor's and Fitch are considered investment grade.","C":"Incorrect because bonds rated Baa3 or higher by Moody's and BBB– or higher by Standard & Poor's and Fitch are considered investment grade."},"a":"A"},{"n":56,"q":"If a risk-free asset is added to a portfolio of risky assets, the highest achievable return for a given level of risk most likely:","o":{"A":"decreases.","B":"remains unchanged.","C":"increases."},"f":{"A":"Incorrect because an investor's portfolio improves if a risk-free asset is added to the mix. In other words, a combination of the risk-free asset and a risky asset can result in a better risk–return trade-off than an investment in only one type of asset because the risk-free asset has zero correlation with the risky asset. A better risk–return trade-off means that the investor's highest achievable return for a given level of risk increases.","B":"Incorrect because an investor's portfolio improves if a risk-free asset is added to the mix. In other words, a combination of the risk-free asset and a risky asset can result in a better risk–return trade-off than an investment in only one type of asset because the risk-free asset has zero correlation with the risky asset. A better risk–return trade-off means that the investor's highest achievable return for a given level of risk increases.","C":"Correct because an investor's portfolio improves if a risk-free asset is added to the mix. In other words, a combination of the risk-free asset and a risky asset can result in a better risk–return trade-off than an investment in only one type of asset because the risk-free asset has zero correlation with the risky asset. A better risk–return trade-off means that the investor's highest achievable return for a given level of risk increases."},"a":"C"},{"n":57,"q":"Which of the following statements best describes the relationship between the net costs of carry and the forward price?","o":{"A":"If the costs of carry exceed the benefits, the forward price would be lower","B":"If the costs of carry exceed the benefits, the forward price would be higher","C":"If the benefits exceed the costs of carry, the forward price would be higher"},"f":{"A":"Incorrect because if the costs exceed the benefits, the forward price would be higher because the forward contract avoids the costs at the expense of the lesser benefits.","B":"Correct because if the costs exceed the benefits, the forward price would be higher because the forward contract avoids the costs at the expense of the lesser benefits.","C":"Incorrect because the formula adjusts the forward price downward when benefits exceed costs of carry. So the forward price would be lower, not higher, when the present value of benefits exceeds the present value of costs."},"a":"B"},{"n":58,"q":"A European call option is in the money whenever the value of the underlying is:","o":{"A":"less than the exercise price.","B":"equal to the exercise price.","C":"greater than the exercise price."},"f":{"A":"Incorrect because a European call option is out of the money when the value of the underlying is less than the exercise price of the option.","B":"Incorrect because a European call option is at the money when the value of the underlying is equal to the exercise price of the option.","C":"Correct because a European call option is in the money when the value of the underlying is greater than the exercise price of the option."},"a":"C"},{"n":59,"q":"Compared to trading an underlying directly, trading a derivative on the underlying most likely involves:","o":{"A":"lower transaction costs.","B":"a lower degree of leverage.","C":"a larger amount of required capital."},"f":{"A":"Correct because derivatives have lower transaction costs than the underlying. The transaction costs of derivatives can be high relative to the value of the derivatives, but these costs are typically low relative to the value of the underlying.","B":"Incorrect because derivatives are widely used and involve a high degree of leverage, it is a given that they would be seen in a crash.","C":"Incorrect because derivative markets also typically have greater liquidity than the underlying spot markets, a result of the smaller amount of capital required to trade derivatives than to get the equivalent exposure directly in the underlying."},"a":"A"},{"n":60,"q":"Which of the following statements about alternative investments' compensation structures is most accurate?","o":{"A":"A hurdle rate protects clients from paying twice for the same performance","B":"The management fee for a private equity fund is based on committed capital until fully drawn","C":"The management fee is earned only after the fund achieves a return known as a high-water mark"},"f":{"A":"Incorrect because it is a high-water mark (not a hurdle rate) that protects clients from paying twice for the same performance. The hurdle rate is a minimum rate of return, typically 8%, that the GP must exceed in order to earn the performance fee.","B":"Correct because until the committed capital is fully drawn down and invested, the management fee for a private equity fund is based on committed capital, not invested capital.","C":"Incorrect because performance fee (not a management fee) is earned only after the fund achieves a return known as a hurdle rate (not a high-water mark). The hurdle rate is a minimum rate of return, typically 8%, that the GP must exceed in order to earn the performance fee."},"a":"B"},{"n":61,"q":"According to put–call forward parity, a long put is equal to:","o":{"A":"a long call, a long risk-free bond and a long forward.","B":"a long call, a long risk-free bond and a short forward.","C":"a short call, a long risk-free bond and a short forward."},"f":{"A":"Incorrect because the put–call forward parity is equal to: F0(T)(1 + r)–T + p0 = c0 + X(1+ r)–T, thus p0 = c0 + X(1+ r)–T - F0(T)(1 + r)–T , where p0 is a put, c0 is a call, X(1+ r)–T is a risk free bond, F0(T)(1 + r)–T is a forward (in present values).","B":"Correct because the put–call forward parity is equal to: F0(T)(1 + r)–T + p0 = c0 + X(1+ r)–T, thus p0 = c0 + X(1+ r)–T - F0(T)(1 + r)–T , where p0 is a put, c0 is a call, X(1+ r)–T is a risk free bond, F0(T)(1 + r)–T is a forward (in present values).","C":"Incorrect because the put–call forward parity is equal to: F0(T)(1 + r)–T + p0 = c0 + X(1+ r)–T, thus p0 = c0 + X(1+ r)–T - F0(T)(1 + r)–T , where p0 is a put, c0 is a call, X(1+ r)–T is a risk free bond, F0(T)(1 + r)–T is a forward (in present values)."},"a":"B"},{"n":62,"q":"An analyst gathers the following information about a margin transaction:\n§Initial stock price    $80\n§Leverage ratio    2.5\nIf the first margin call occurs at a stock price below $60, the maintenance margin is closest to:","o":{"A":"15.0%.","B":"20.0%.","C":"46.7%."},"f":{"A":"Incorrect because this response is calculated by incorrectly using the initial stock price [$80] as opposed to P, the price below which a margin call will first\n§take place [$60]. This calculation is as follows:    =    = 0.15 or 15%.","B":"Correct because the maintenance margin is solved using the\n§following equation:    =    = Maintenance\nmargin in percentage terms. Where P is equal to the price below which a margin call will first\n§take place. Here this is $60.Equity per share = Percentage of equity    Initial stock price, where\n§the percentage of equity is equal to    =    = 0.4 or 40%. Therefore the Equity per\n§share is equal to 0.4  $80 = $32. Therefore the maintenance margin is    =    =\n20%.","C":"Incorrect because Equity per share is incorrectly calculated with the wrong percentage of equity formula: (1  1 / leverage ratio) [as opposed to the correct\n§calculation of: 1 / leverage ratio] = (1    1/2.5) = (1    0.4) = 0.6 or 60%.Using 60% to calculate\nthe Equity per share, the equity per share = 60%  $80 = $48 Applying this incorrect\n§percentage of equity [60%] into the formula for maintenance margin -    =\n§=    =    = 46.7%."},"a":"B"},{"n":63,"q":"An analyst uses a valuation model to estimate the value of an option-free bond at 92.733 to yield 11%. If the value is 94.474 for a 60 bps decrease in yield and 91.041 for a 60 bps increase in yield, the approximate modified duration of the bond is closest to:","o":{"A":"1.85.","B":"3.09.","C":"6.17."},"f":{"A":"Incorrect because it uses ΔYield = 0.01 (1%).","B":"Correct because the approximate modified duration of a\n§bond is    ApproxModDur = ((PV-) - (PV+))/2*(ΔYield)*(PV0)where PV_, PV0, and\nPV+ are the values of the bond when the yield falls, under the current yield, and when the yield rises, respectively, and ΔYield is the size of the yield change. Therefore,  ApproxModDur = (94.474 - 91.041)/(2*0.0060*92.733) = 3.09","C":"Incorrect because it ignores the 2 in the denominator."},"a":"B"},{"n":64,"q":"A hedge fund that implements trades based on a top-down analysis of expected movements in economic variables most likely uses a(n):","o":{"A":"macro strategy.","B":"relative value strategy.","C":"event-driven strategy."},"f":{"A":"Correct because macro strategies emphasize a top-down approach, and trades are made based on expected movements of economic variables.","B":"Incorrect because relative value strategies focus on pricing discrepancies between related securities.","C":"Incorrect because event-driven strategies focus on short-term events that are expected to affect individual companies. The approach is thus “bottom up.”"},"a":"A"},{"n":65,"q":"An analyst gathers the following information about three bonds: Total Issuer Debt Outstanding\n§Bond    Issuer Credit Rating    ($ Billions)\n§1    B    1\n§2    BB    1\n§3    BB    30\nAll else being equal, the bond with the greatest market liquidity risk is most likely:","o":{"A":"Bond 1.","B":"Bond 2.","C":"Bond 3."},"f":{"A":"Correct because the two main issuer-specific factors that affect market liquidity risk are (1) the size of the issuer (that is, the amount of publicly traded debt an issuer has outstanding) and (2) the credit quality of the issuer. In general, the less debt an issuer has outstanding, the less frequently its debt trades, and thus the higher the market liquidity risk. And the lower the quality of the issuer, the higher the market liquidity risk. As the issuer of Bond 1 has the equal lowest amount of debt outstanding and also the lowest rating of B, this bond is most likely to have the greatest liquidity risk, all else being equal.","B":"Incorrect because although the issuer of Bond 2 has the equal lowest amount of debt outstanding, it also has a higher credit rating relative to the issuer of Bond 1, of BB. A higher credit rating likely means that Bond 2 has less liquidity risk than Bond 1, all else being equal.","C":"Incorrect because the issuer of Bond 3 has the equal highest credit rating and also the greatest amount of debt outstanding. A greater amount of debt outstanding likely means that, all else being equal, Bond 3 has less liquidity risk than Bond 2 and, therefore, less liquidity risk than Bond 1 as well."},"a":"A"},{"n":66,"q":"Four years ago, a 5% coupon, annual-pay bond with a 10-year maturity was issued at par. If the current market discount rate is 7%, the price of the bond per 100 of par value is closest to:","o":{"A":"90.34.","B":"90.47.","C":"93.23."},"f":{"A":"Incorrect because semi-annual coupons are used instead of annual coupons. Changing calculator inputs to N = 12, PMT = 2.5, I = 3.5, the price is 90.3367 ≈ 90.34.","B":"Correct because the price four years after issuance is 90.47:P0 = PMT1/(1+r) + … + PMTn/(1+r)n + FV/(1+r)nwhere: PV0= the current market price or present value of the bond; PMTt = the coupon payment in period t; r = the yield to maturity per period; n = the number of periods remaining to maturity; FV = the maturity value of the bond.So: P0 = 5/(1.07) + 5/(1.07)2 +…+ 105/(1.07)6 = 90.4669 ≈ 90.47.Using HP12C financial calculator for six years to maturity, FV = 100, N = 6, I = 7, PMT = 5, the PV or price = 90.4669 ≈ 90.47.","C":"Incorrect because the price is calculated for issuance six years ago (not four years), using annual coupons. Calculator inputs are changed to N = 4 for the remaining years to maturity, PMT = 5, I = 7. The price is 93.2256 ≈ 93.23. Also, if semi-annual coupons are used for 4 years to maturity, then N = 8, PMT = 2.5, I = 3.5. The price is 93.1260 ≈ 93.13 and is closest to the incorrect answer C."},"a":"B"},{"n":67,"q":"In an investment policy statement, which of the following investment constraints most likely outlines a client's preference for environmentally sustainable investments?","o":{"A":"Time horizon","B":"Unique circumstances","C":"Legal and regulatory factors"},"f":{"A":"Incorrect because the section about time horizon states the time horizon over which the investor is investing.","B":"Correct because the section on unique circumstances of the IPS should cover any other aspect of the client's circumstances that is not covered by other sections and that is likely to have a material impact on the composition of the portfolio. ESG considerations - such as a preference for environmentally sustainable investments - fall into this category.","C":"Incorrect because this section of the IPS should state any legal and regulatory restrictions that constrain how the portfolio is invested. The decision to pursue socially responsible investing does not need to be driven by legal and regulatory factors."},"a":"B"},{"n":68,"q":"For an institutional investor, the investment committee's approach to appointing and reviewing investment managers for the portfolio is most likely set out during the:","o":{"A":"portfolio construction process.","B":"strategic asset allocation decision.","C":"preparation of the investment policy statement."},"f":{"A":"Incorrect because portfolio planning can be defined as a program developed in advance of constructing a portfolio that is expected to satisfy the client's investment objectives. The written document governing this process is the investment policy statement (IPS). In the case of an institution, such as a pension plan or university endowment, the IPS may set out the governance arrangements that apply to the investment funds. Next comes the portfolio construction process, including the first step of specifying a strategic asset allocation for the client.","B":"Incorrect because only once the IPS has been compiled, the investment manager can construct a suitable portfolio. Strategic asset allocation is a traditional focus of the first steps in portfolio construction. The strategic asset allocation is stated in terms of percent allocations to asset classes.The process of formulating a strategic asset allocation is based on the IPS and capital market expectations.","C":"Correct because in the case of an institution, such as a pension plan or university endowment, the IPS may set out the governance arrangements that apply to the investment funds. For example, this information could cover the investment committee's approach to appointing and reviewing investment managers for the portfolio, and the discretion that those managers have."},"a":"C"},{"n":69,"q":"All else being equal, for option-free bonds, the percentage price change for a given yield change is most likely greater for a bond:","o":{"A":"with a high coupon than for a bond with a low coupon.","B":"with a short time-to-maturity than for a bond with a long time-to-maturity.","C":"when the market discount rate goes down than when the market discount rate goes up."},"f":{"A":"Incorrect because the coupon effect states that for the same time-to-maturity, a lower-coupon bond has a greater percentage price change than a higher-coupon bond when their market discount rates change by the same amount.","B":"Incorrect because the maturity effect states that generally, for the same coupon rate, a longer-term bond has a greater percentage price change than a shorter-term bond when their market discount rates change by the same amount.","C":"Correct because the convexity effect states that for the same coupon rate and time-to-maturity, the percentage price change is greater (in absolute value, meaning without regard to the sign of the change) when the market discount rate goes down than when it goes up."},"a":"C"},{"n":70,"q":"Which of the following statements is most accurate? Smart beta strategies:","o":{"A":"invest in high market beta stocks to generate an abnormal return.","B":"use simple rules-based strategies as a basis for investment decisions.","C":"typically have lower portfolio turnover than passive market-cap weighted strategies."},"f":{"A":"Incorrect because asset managers are increasingly offering other strategies beyond traditional market-cap-weighted exposures. Some of these other strategies, commonly known as smart beta, are based on such factors as size, value, momentum, or dividend characteristics. As such, smart beta strategies seek abnormal return from factors other than the market beta, which measures the market-cap-weighted exposures. Moreover, a stock's performance does not necessarily have a one-to-one relationship with these additional factors (such that a higher exposure generates a higher abnormal return).","B":"Correct because smart beta, involves the use of simple, transparent, rules-based strategies as a basis for investment.","C":"Incorrect because typically, smart beta strategies feature somewhat higher management fees and higher portfolio turnover (not lower) relative to passive market-cap weighted strategies."},"a":"B"},{"n":71,"q":"An analyst gathers the following information about a hedge fund:\n§Beginning-of-year assets under management (AUM)    £200,000,000\n§Management fee (based on end-of-year AUM before fees)    2%\n§Incentive fee    10%\n§Soft hurdle rate    5%\n§Annual return before fees    20%\nIf the incentive fee is calculated independently of the management fee, total fees for the year are:","o":{"A":"£7,800,000.","B":"£8,320,000.","C":"£8,800,000."},"f":{"A":"Incorrect because the hurdle rate was treated as a hard hurdle rate and not a soft hurdle rate. The calculation becomes:Management fee = (200,000,000 × 1.20) × 0.02 = 4,800,000Incentive fee = ((200,000,000 × (0.20 – 0.05)) × 0.10 = 3,000,000Total fees = 7,800,000.","B":"Incorrect because the incentive fee has been calculated net of the management fee and not independently of the management fee. The calculation becomes:Management fee = (200,000,000 × 1.20) × 0.02 = 4,800,000Incentive fee = ((200,000,000 × 0.2) – 4,800,000) × 0.10 = 3,520,000Total fees = 8,320,000.","C":"Correct because the partnership agreement usually specifies that the performance fee is earned only after the fund achieves a return known as a hurdle rate. The hurdle rate is a minimum rate of return, typically 8%, that the GP must exceed in order to earn the performance fee. GPs typically receive 20% of the total profit of the private equity fund net of any hard hurdle rate, in which case the GP earns fees on annual returns in excess of the hurdle rate, or net of the soft hurdle rate, in which case the fee is calculated on the entire annual gross return as long as the set hurdle is exceeded. Accordingly, the fees are calculated as:Management fee = (200,000,000 × 1.20) × 0.02 = 4,800,000As the return before fees is higher than the soft hurdle rate, the incentive fee is:Incentive fee = (200,000,000 × 0.2) × 0.10 = 4,000,000Total fees = 8,800,000."},"a":"C"},{"n":72,"q":"Which of the following is most likely one of the main functions of the financial system?","o":{"A":"Determining an equilibrium interest rate","B":"Ensuring that markets are informationally efficient","C":"Ensuring that all investment projects receive sufficient funding"},"f":{"A":"Correct, one of the main functions of the financial system is to determine the equilibrium interest rate, which is the only interest rate that would exist if all securities were equally risky, had equal terms, and were equally liquid.","B":"Incorrect, because informational market efficiency is not a key function of the financial system, rather that of regulatory framework.","C":"Incorrect, because the financial system provides sufficient funding only to the most productive projects. An important function of the financial system is to direct resources away from wealth-diminishing projects."},"a":"A"},{"n":73,"q":"Which of the following is most likely a distinction between futures and forward contracts? Futures contracts are:","o":{"A":"easily customized.","B":"traded on an exchange.","C":"more attractive than forwards for long positions when futures prices are negatively correlated to interest rates."},"f":{"A":"Incorrect because futures contracts differ from forward contracts in that they have standard terms, are traded on a futures exchange, and are more heavily regulated, whereas forward contracts are typically private, customized transactions. Therefore, it is more likely that forwards would be customizable than future contracts.","B":"Correct because futures contracts differ from forward contracts in that they have standard terms, are traded on a futures exchange, and are more heavily regulated, whereas forward contracts are typically private, customized transactions.","C":"Incorrect because a negative correlation between futures prices and interest rates leads to the opposite interpretation, with forwards being more desirable than futures to the long position. The more desirable contract will tend to have the higher price."},"a":"B"},{"n":74,"q":"Which of the following is most likely a long-term benefit of adding alternative investments to a portfolio of traditional investments?","o":{"A":"Enhanced liquidity of the combined portfolio","B":"High correlation with traditional asset returns","C":"Improved risk-return profile of the combined portfolio"},"f":{"A":"Incorrect because features that may distinguish alternative investments include the following: Illiquidity, long investment time horizons, and large capital outlays. Hence, adding alternative investments is likely decreasing the liquidity of the combined portfolio.","B":"Incorrect because features that may distinguish alternative investments include the following: Typically low correlation of returns with more traditional asset classes. Hence, adding alternative investments is likely decreasing the correlation with traditional asset returns.","C":"Correct because investors often consider alternative investments in pursuit of greater portfolio diversification and/or increased expected returns."},"a":"C"},{"n":75,"q":"In the event of a default, which of the following mortgage structures exposes a lender to the greatest risk of loss?","o":{"A":"Interest-only, recourse loan","B":"Fully amortizing, recourse loan","C":"Balloon payment, non-recourse loan"},"f":{"A":"Incorrect because in a recourse loan, the lender has a claim against the borrower for the shortfall between the amount of the outstanding mortgage balance and the proceeds received from the sale of the property. In a non-recourse loan, the lender does not have such a claim and thus can look only to the property to recover the outstanding mortgage balance. Therefore, an interest-only, recourse loan exposes the lender to less risk than a balloon payment, non-recourse loan.","B":"Incorrect because in a recourse loan, the lender has a claim against the borrower for the shortfall between the amount of the outstanding mortgage balance and the proceeds received from the sale of the property. Moreover, in a fully amortizing loan, the sum of all the scheduled principal repayments during the mortgage's life is such that when the last mortgage payment is made, the loan is fully repaid. Therefore, a fully-amortizing, recourse loan exposes a lender to less risk than a balloon payment, non-recourse loan.","C":"Correct because in a recourse loan, the lender has a claim against the borrower for the shortfall between the amount of the outstanding mortgage balance and the proceeds received from the sale of the property. In a non-recourse loan, the lender does not have such a claim and thus can look only to the property to recover the outstanding mortgage balance. Moreover, in a fully amortizing loan, the sum of all the scheduled principal repayments during the mortgage's life is such that when the last mortgage payment is made, the loan is fully repaid. Whereas in a partially amortizing loan [i.e. a loan with a balloon payment], the sum of all the scheduled principal repayments is less than the amount borrowed. Therefore, a balloon payment, non-recourse loan exposes a lender to more risk than a fully-amortizing, recourse loan."},"a":"C"},{"n":76,"q":"Which of the following statements about infrastructure investing is most accurate? Infrastructure:","o":{"A":"assets are typically unlevered.","B":"assets are intended for public use.","C":"cash flows typically have a negative correlation with inflation."},"f":{"A":"Incorrect because infrastructure is funded via a mix of debt and equity, and is thus typically levered. Debt financing for infrastructure projects can be both private debt and publicly traded debt.","B":"Correct because infrastructure investments are real, capital-intensive, and long-lived assets intended for public use.","C":"Incorrect because infrastructure investors expect the assets to primarily generate stable long-term cash flows that also adjust for economic growth and inflation. Infrastructure investments provide some protection for changes in GDP growth, and offer some protection against inflation."},"a":"B"},{"n":77,"q":"An investor uses the following data and Gordon’s constant growth dividend discount model to evaluate a company’s common stock. To estimate growth, she uses the average of the: 1. average value of the compounded annual dividend growth rate over the period of Year 1 to Year 6, and< 2. dividend payout ratio for Year 6.\n§Year    Earnings per Share    Dividend per Share    Return on Equity\n§6    $3.20    $1.92    12%\n§5    $3.60    $1.85    17%\n§4    $2.44    $1.74    13%\n§3    $2.08    $1.62    15%\n§2    $2.76    $1.35    11%\n§1    $2.25    $1.25    9%\nIf her required return is 15%, the stock’s intrinsic value is closest to:","o":{"A":"$25.31.","B":"$23.71.","C":"$30.14."},"f":{"A":"Correct because V0 = D1 / (r – g); First estimate the two growth rates. Compound annual dividend growth rate over the period of Year 1 to Year 6 = 1.25 × (1 + g)5 = 1.92 g = 8.96% ≈ 9% Sustainable growth rate for Year 6 using the dividend payout ratio: b = earnings retention rate = (1 – Dividend payout ratio) = [1 – (1.92 / 3.20)] = 0.40 g = b × ROE; g = 0.40 × 12% = 4.8% Average of the two approaches = (9 + 4.8) / 2 = 6.90% V0 = D1 / (r – g) = (1.92 × 1.069) / (0.15 – 0.069) = 2.05 / 0.081 = $25.31","B":"Incorrect because it uses D0 instead of D1. $1.92/(0.15 – 0.069) = $1.92/0.081 = $23.71","C":"Incorrect because it uses the payout ratio instead of the retention ratio in computing sustainable growth rate: g = 0.60 × 12% = 7.2%; Average of the two approaches = (9 + 7.2)/2 = 8.1%; V0 = D1/(r – g) = $1.92(1.081)/(0.15 – 0.081) = $2.08/0.069 = $30.14"},"a":"A"},{"n":78,"q":"Which of the following is least likely a component of yield spread?","o":{"A":"Taxation","B":"Credit risk","C":"Expected inflation rate"},"f":{"A":"Incorrect because taxation is part of the yield spread providing the investor with compensation for the tax impact of holding a specific bond.","B":"Incorrect because credit risk is part of the yield spread providing the investor with compensation for the credit risks of holding a specific bond.","C":"Correct. Building blocks of the yield curve are spread (risk premium) and a benchmark (risk-free rate of return). Expected inflation rate and expected real rate are components of the risk-free rate of return (i.e., the benchmark)."},"a":"C"},{"n":79,"q":"The earnings multiplier for a stock increases with a decrease in the:","o":{"A":"expected dividend growth rate.","B":"expected dividend payout ratio.","C":"estimated required rate of return on equity."},"f":{"A":"Incorrect because a decrease in the dividend growth rate will decrease the earnings multiplier because the denominator in the model is larger.","B":"Incorrect because a decrease in the dividend payout ratio will decrease the earnings multiplier because the numerator is smaller.","C":"Correct because a decrease in the required rate of return means the denominator has decreased, which increases the earnings multiplier (P/E) based on the earnings multiplier model: P0/E1 = D1/E1 / (r – g)."},"a":"C"},{"n":80,"q":"The most appropriate measure of interest rate risk for a bond to a parallel shift in the benchmark yield curve is:","o":{"A":"effective duration.","B":"modified duration.","C":"Macaulay duration."},"f":{"A":"Correct because there are several types of bond duration. In general, these can be divided into yield duration and curve duration. Yield duration is the sensitivity of the bond price with respect to the bond’s own yield-to-maturity. Curve duration is the sensitivity of the bond price (or more generally, the market value of a financial asset or liability) with respect to a benchmark yield curve. A curve duration statistic often used is effective duration.","B":"Incorrect because modified duration is a yield duration statistic. There are several types of bond duration. In general, these can be divided into yield duration and curve duration. Yield duration is the sensitivity of the bond price with respect to the bond’s own yield- to- maturity.","C":"Incorrect because Macaulay duration is a yield duration statistic. Yield duration statistics used in fixed-income analysis include Macaulay duration, modified duration, money duration, and the price value of a basis point (PVBP). A curve duration statistic often used is effective duration."},"a":"A"},{"n":81,"q":"A successful portfolio risk budget will most likely:","o":{"A":"be based on multiple sources of risk.","B":"produce superior performance compared to passive investing.","C":"lead to investment in assets with the highest return per unit of risk."},"f":{"A":"Incorrect because a portfolio risk budgeting process using only a single simple risk measure can provide substantial benefits to the organization","B":"Incorrect because risk budgeting need not result in active investment decisions; the superior sources of return per unit of risk might be passive investment vehicles.","C":"Correct because whether the risk budgeting process focuses explicitly on it or not, it should result in choosing assets based on their ability to add the best return for each unit of the risk budget they use. Although some risk budgeting processes consider multiple risk sources, even a process based on a single risk can provide substantial benefits to an organization. While risk budgeting focuses on allocating the portfolio’s risk tolerance to its best uses, this does not necessary define a portfolio that will beat passive benchmarks. Risk might be best budgeted to passive investments."},"a":"C"},{"n":82,"q":"In an order-driven market, if the trade price is determined by the limit price of an order, the market most likely operates under the:","o":{"A":"uniform pricing rule.","B":"derivative pricing rule.","C":"discriminatory pricing rule."},"f":{"A":"Incorrect because under the uniform pricing rule all trades execute at the same price. The market chooses the price that maximizes the total quantity traded.","B":"Incorrect because under the derivative pricing rule the price is derived from another market, typically at the midpoint of the best bid and ask quotes published by the exchange at which the security primarily trades.","C":"Correct because under the discriminatory pricing rule the limit price of the order or quote that first arrived—the standing order—determines the trade price."},"a":"C"},{"n":83,"q":"An investor sells a European put option with the following characteristics:\n§Put price    50\n§Exercise price    1,640\nIf the price of the underlying at expiration is 1,670, the profit for the seller is:","o":{"A":"20.","B":"30.","C":"50."},"f":{"A":"Incorrect because it represents the put price p0 less the difference between the exercise price X and the price of the underlying ST at expiration: 50 – (1,670 – 1,640) = 20. This would be the profit to the seller of a call option, Π = –Max(0,ST – X) + c0, with the same exercise price and the same selling price. By contrast, to the put seller, the profit is Π = –Max(0,X – ST) + p0. Therefore, Π = –Max(0,(1,640 – 1,670)) + 50 = 50.","B":"Incorrect because it represents the payoff to the call buyer cT = Max(0,ST – X), where ST is the price of the underlying at expiration and X is the exercise price. Therefore, cT = Max(0,(1,670 – 1,640)) = 30. By contrast, to the put seller, the profit is Π = – Max(0,X – ST) + p0, where p0 is the put price. Therefore, Π = –Max(0,(1,640 – 1,670)) + 50 = 50.","C":"Correct because to the put seller, the profit is Π = –Max(0,X – ST) + p0, where X is the exercise price, ST is the price of the underlying at expiration, and p0 is the put price. Therefore, Π = –Max(0,(1,640 – 1,670)) + 50 = 50."},"a":"C"},{"n":84,"q":"Validity instructions indicate:","o":{"A":"how to fill an order.","B":"when an order may be filled.","C":"how to arrange final settlement of an order."},"f":{"A":"Incorrect because validity instructions indicate when the order may be filled, while execution instructions indicate how to fill the order.","B":"Correct because validity instructions indicate when the order may be filled.","C":"Incorrect because validity instructions indicate when the order may be filled, while clearing instructions indicate how to arrange the final settlement of the trade if the order fills."},"a":"B"},{"n":85,"q":"When the forward price of a commodity exceeds the spot price, the commodity market is most likely in:","o":{"A":"carry.","B":"contango.","C":"backwardation."},"f":{"A":"Incorrect because carry does not relate to the relationship between spot and forward prices. In the context of commodities, cost of carry is the opportunity cost of holding these assets, and mirrors the risk-free rate and the cost of storing, transporting, and insuring the commodity.","B":"Correct because when the spot price is below the forward prices, there is contango.","C":"Incorrect because when the spot price is above the forward prices, there is backwardation not contango."},"a":"B"},{"n":86,"q":"Which of the following is private debt funding used by companies that are in the seed stage of their life cycle?","o":{"A":"Venture debt","B":"Direct lending","C":"Mezzanine financing"},"f":{"A":"Correct because venture debt is private debt funding that provides venture capital backing to start-up or early-stage companies that may be generating little or negative cash flow. Venture debt is applicable to companies that are in the seed life cycle stage.","B":"Incorrect, because direct lending is applicable to companies that are in the growth, maturity, or decline life cycle stage, but not in the seed life cycle stage.","C":"Incorrect, because mezzanine financing is applicable to companies that are in the growth, maturity, or decline life cycle stage, but not in the seed life cycle stage."},"a":"A"},{"n":87,"q":"For a fixed-rate bond, Macaulay duration is:","o":{"A":"unrelated to the bond’s yield-to-maturity.","B":"inversely related to the bond’s yield-to-maturity.","C":"positively related to the bond’s yield-to-maturity."},"f":{"A":"Incorrect because duration is inversely related (not unrelated) to the bond’s yield to maturity.","B":"Correct because Macaulay duration is inversely related to a bond’s yield-to-maturity. All else being equal, a higher yield-to-maturity reduces the weighted average time to receipt of the bond’s cash flows. This places more weight on near-term cash flows and less weight on more-distant cash flows, resulting in a lower duration.","C":"Incorrect because duration is inversely (not positively) related to the bond’s yield-to-maturity."},"a":"B"},{"n":88,"q":"With respect to portfolio construction, combining long-term capital market expectations with the objectives and constraints from the investment policy statement determines a portfolio's:","o":{"A":"security selection.","B":"tactical asset allocation.","C":"strategic asset allocation."},"f":{"A":"Incorrect because security selection is an attempt to generate higher returns than the asset class benchmark by selecting securities with a higher expected return. Risk budgeting implies that the portfolio manager has to choose, for every asset class, whether to deploy security selection as a return generator. This choice is generally referred to as the choice between active or passive management. Contrary to strategic asset allocation, where exposures to sources of systematic risk are selected and sized, security selection is not rewarded with a long-run payoff to risk. Security selection is a zero-sum game: All investors in an asset class are competing with each to identify a typically limited number of assets that are misvalued. Combining the objectives and constraints from the IPS with the long-term capital market expectations determines the strategic asset allocation.","B":"Incorrect because apart from the exposures to systematic risk factors specified in the strategic asset allocation, the returns of an investment strategy depend on two other sources: tactical asset allocation and security selection. Tactical asset allocation is the decision to deliberately deviate from the policy exposures to systematic risk factors (i.e., the policy weights of asset classes) with the intent to add value based on forecasts of the near-term returns of those asset classes. Tactical asset allocation depends on near-term capital market expectations, not long-term ones.","C":"Correct because a strategic asset allocation results from combining the constraints and objectives articulated in the IPS and long-term capital market expectations regarding the asset classes. Capital market expectations are the investor’s expectations concerning the risk and return prospects of asset classes, however broadly or narrowly the investor defines those asset classes. When associated with the client’s investment objectives, the result is the strategic asset allocation that is expected to allow the client to achieve his or her investment objectives."},"a":"C"},{"n":89,"q":"The correlation of cryptocurrencies with traditional assets has been:","o":{"A":"decreasing.","B":"steady.","C":"increasing."},"f":{"A":"Incorrect because the correlation of cryptocurrencies with traditional assets is on the rise.","B":"Incorrect because the correlation of cryptocurrencies with traditional assets is on the rise.","C":"Correct because the correlation of cryptocurrencies with traditional assets is on the rise."},"a":"C"},{"n":90,"q":"§Initial investment capital    $100 million\n§Return at the end of one year    12%\n§Management fee based on assets under management    1%\n§Incentive fee based on the return net of the management fee    10%\nAssume management fees are calculated using end-of-period valuation. The investor’s net return given this fee structure is closest to:","o":{"A":"9.68%.","B":"9.79%.","C":"10.88%."},"f":{"A":"Incorrect. It ignores the fact that the incentive fee is calculated net of management fees. Management fee: 1% of $112 million = $1.12 million. Incentive fee: 10% of $12 million = $1.2 million. Fund value after fees: $112 million – $1.12 million – $1.2 million = $109.68 million Investor return: ($109.68 million / $100 million) - 1 = 9.68%","B":"Correct. Management fee: 1% of $112 million = $1.12 million Incentive fee: 10% of ($12 million – $ 1.12 million) = $1.088 million Fund value after fees: $112 million – $1.12 million – $1.088 million = $109.792 million Investor return: ($109.792 million/$100 million) – 1 = 9.79%","C":"Incorrect. It neglects the incentive fee. Management fee: 1% of $112 million = $1.12 million Fund value after fees: $112 million – $1.12 million = $110.88 million Investor return: ($110.88 million/$100 million) – 1 = 10.88%\nRetake"},"a":"B"}],"ME5-1":[{"n":1,"q":"To claim compliance with the GIPS standards, a firm is most likely required to:","o":{"A":"have a verification of the firm's claim of compliance performed.","B":"initially present a minimum of five years of compliant investment performance.","C":"include all discretionary and non-discretionary fee-paying accounts in its composites."}},{"n":2,"q":"Tyler Cowen, CFA, retains all records relating to recommendations to buy or sell a security, but discards all notes that do not lead to a change in recommendations. Cowen’s colleague Marie Thomsen, CFA, maintains all her records in electronic form but does not retain hard copies for some of her recommendations. Who has most likely violated the Standard relating to record retention?","o":{"A":"Cowen only","B":"Thomsen only","C":"Both Cowen and Thomsen"}},{"n":3,"q":"Renee Robinson, CFA, an independent contractor, acts as chief compliance officer for multiple firms, where she is responsible for overseeing adherence to security laws, firm policies, and the CFA Institute Standards of Professional Conduct. Robinson works remotely and determines her own hours. Her signed agreement with each firm outlines her responsibilities and discloses the potential conflicts of interest due to having multiple clients in the same role and industry. Is Robinson most likely in violation of any CFA Institute Standard of Professional Conduct?","o":{"A":"No","B":"Yes, with regard to having multiple clients","C":"Yes, with regard to being an independent contractor"}},{"n":4,"q":"Kathy Lau, CFA, is a portfolio manager. After a comprehensive analysis, Lau buys Top Technology Company (TTC) IPO for all her clients for whom the investment is appropriate, including her brother's fee-paying account. Lau does not have beneficial ownership in her brother's account. Has Lau violated the Standards by buying shares for her brother's account?","o":{"A":"No","B":"Yes, the Standard relating to disclosure of conflicts","C":"Yes, the Standard relating to priority of transactions"}},{"n":5,"q":"Ekta Prakash, CFA, works as an investment advisor for TXM Investments (TXM). Prakash advises a client to transfer $150,000 from a tax-deferred investment account to TXM's multi-cap fund. Prakash discloses to her client that withdrawals from the tax-deferred account will attract a penalty of $15,000 but assures the client that the cost can be recovered through better investment returns from TXM's fund. Prakash has violated the Standard(s) relating to:","o":{"A":"only misrepresentation.","B":"only loyalty, prudence, and care.","C":"both misrepresentation and loyalty, prudence, and care."}},{"n":6,"q":"According to the GIPS standards, which of the following statements is most accurate? Verification:","o":{"A":"ensures the accuracy of composite presentations.","B":"is required to maintain compliance with the GIPS standards.","C":"tests whether a firm has complied with composite construction requirements on a firm-wide basis."}},{"n":7,"q":"John Smith, CFA, was hired by the Dunlap Investment Consulting Group to manage equity investments for the Allied Company Defined Benefit Pension Plan. Smith is required to report quarterly performance results to Allied Company's board. Smith owes a primary duty of loyalty, prudence, and care to:","o":{"A":"Allied Company employees.","B":"Dunlap Investment Consulting Group.","C":"The Allied Company Pension Plan Trustees."}},{"n":8,"q":"Shika Agarwal is a Level I candidate in the CFA program. Immediately after taking the exam, Agarwal posts in a social media group for CFA candidates arguing that the move to computer-based testing would have an adverse impact on the quality of the CFA program. She also states how surprised she was that the exam did not have quantitative questions on portfolio management. Has Agarwal violated the Standards?","o":{"A":"No.","B":"Yes, by stating that the exam did not have quantitative questions on portfolio management.","C":"Yes, by arguing that the move to computer-based testing would have an adverse impact on the quality of the CFA program."}},{"n":9,"q":"Regarding ethical standards in the investment industry, which of the following is most accurate? CFA Institute:","o":{"A":"requires charterholders to engage in their professional communities.","B":"aims to build market integrity by calling for regulations that align the interests of firms and clients.","C":"promotes the highest standards of ethics, education, and professional excellence for the ultimate benefit of shareholders."}},{"n":10,"q":"Jorge Fernandez, CFA, is an equity analyst at a brokerage company. He suspects his colleague is trading on shares prior to his research reports being distributed to clients. When Fernandez asks his colleague about it, he is told to mind his own\nbusiness. To comply with the Standard relating to knowledge of law, Fernandez should most likely:","o":{"A":"report his suspicions to his supervisor.","B":"continue to observe his colleague's trades.","C":"discuss his colleague's trades with other analysts at the firm."}},{"n":11,"q":"Century Investment Management, Inc., (CIM), promotes Pierre Ash, CFA, to a supervisory position. Ash cannot discharge his supervisory responsibilities because CIM’s compliance system is inadequate. Ash declines in writing to accept the supervisory responsibility. Has Ash violated the Standards?","o":{"A":"No","B":"Yes, the Standard relating to loyalty, prudence and care","C":"Yes, the Standard relating to responsibilities of supervisors"}},{"n":12,"q":"Maria Perez, CFA, is a portfolio manager for an advisory firm that utilizes external mutual funds. The firm has a committee that selects external funds, using an analytical model to determine their choices. Although Perez has no reason to question the committee's research process, she does not like the committee's choice for a bond fund because it is not appropriate for all her clients. She researches and selects a different bond fund that better meets her clients' needs, but her manager tells her that she is not permitted to make independent fund purchase decisions. She then invests in the fund chosen by the committee for all of her clients. Has Perez most likely violated the Standards?","o":{"A":"No","B":"Yes, the Standard relating to suitability","C":"Yes, the Standard relating to diligence and reasonable basis"}},{"n":13,"q":"Nidhi Mehta, CFA, is a fund manager at XYZ Investments. Mehta's fund delivers excellent returns for the year. A large investor in the fund offers Mehta cash compensation along with free tickets to the opening night of a sold-out opera as a reward for the fund's performance. Firm policy requires employees to inform supervisors about monetary compensation received from clients. Mehta does not inform her supervisor as she only accepts the tickets and not the cash compensation. Has Mehta violated the Standards?","o":{"A":"No","B":"Yes, the Standard relating to fair dealing","C":"Yes, the Standard relating to additional compensation arrangements"}},{"n":14,"q":"Which of the following is a recommended procedure for compliance with the Standard relating to diligence and reasonable basis? Members should encourage their firms to:","o":{"A":"consider the suitability of each investment solely on its own merits.","B":"develop maximum levels of scenario testing of computer-based models used in evaluating financial instruments.","C":"appoint an individual employee or a group of employees to determine that research reports have a reasonable and adequate basis."}},{"n":15,"q":"Faiza Hassan, CFA, is an equity analyst specializing in social media companies. Recently, she placed a “buy” rating on WeGab Corp. Following her initial report on the company, Hassan’s brother has purchased a large amount of WeGab stock. Hassan has no beneficial ownership in her brother’s account. Hassan has been asked to write a follow-up report on WeGab because of strong takeover rumors relating to the company. Will Hassan violate the Standards if she writes the follow-up report without disclosing her brother's shareholding in the company?","o":{"A":"No","B":"Yes, the Standard relating to avoid or disclose conflicts","C":"Yes, the Standard relating to loyalty, prudence, and care"}},{"n":16,"q":"Asset owners most likely benefit from a firm being GIPS compliant because it:","o":{"A":"eliminates the need for in-depth due diligence only.","B":"facilitates the understanding of the sources of risk and excess return only.","C":"both eliminates the need for in-depth due diligence and facilitates the understanding of the sources of risk and excess return."}},{"n":17,"q":"Which of the following policy recommendations is consistent with the Standards?\nInvestment banking personnel should approve any changes in investment\n§Recommendation 1    recommendations from the research side.\nFirewalls should separate reporting structures for personnel on the research side and\n§Recommendation 2    personnel on the investment banking side.\nCompensation arrangements should link research analyst remuneration directly to\n§Recommendation 3    invest­ment banking assignments in which analysts may participate as team members.","o":{"A":"Recommendation 1","B":"Recommendation 2","C":"Recommendation 3"}},{"n":18,"q":"A member receives referral fees for recommending third-party services to clients. Before entering into an agreement with a new client, which of the following must the member disclose to the new client?","o":{"A":"Flat fees only","B":"In kind benefits only","C":"Both flat fees and in kind benefits"}},{"n":19,"q":"For a retail client's account to be included in a GIPS-compliant firm’s composite, it will most likely be in a composite:","o":{"A":"restricted to retail accounts.","B":"composed of discretionary accounts.","C":"with both fee-paying and non-fee-paying accounts."}},{"n":20,"q":"Feng Liu, CFA, is an investment manager. Liu organizes nonviolent demonstrations on weekends to fight climate change. After repeated demonstrations, Liu is arrested and convicted for obstructing public transit which is considered an act of civil disobedience in her country. Has Liu violated the Standards?","o":{"A":"No","B":"Yes, Liu has violated the Standard relating to loyalty","C":"Yes, Liu has violated the Standard relating to misconduct"}},{"n":21,"q":"Meghna Shah, CFA, manages a small-cap fund. Applying mosaic theory, Shah concludes that AK Tech (AKT) is overpriced and sells the fund's significant holding in AKT for a profit. Shah is aware that her transaction could impact AKT's price because the position is large enough to require disclosure to stock exchanges. A blog tracking stock exchange news reports Shah's transaction, which leads to 8% decline in AKT's price, causing losses to other investors. Has Shah violated the Standards?","o":{"A":"No","B":"Yes, the Standard relating to market manipulation","C":"Yes, the Standard relating to material nonpublic information"}},{"n":22,"q":"Frank Schneider, CFA, a securities analyst, applies for a new position. In his application, he makes two statements:\n§Statement 1    I passed all three CFA examinations in three consecutive attempts.\nBased on my success in the CFA Program, I have a superior ability to analyze stocks\n§Statement 2    compared to my peers.\nSchneider has most likely violated the Standards by making:","o":{"A":"Statement 1 only","B":"Statement 2 only","C":"Both Statement 1 and Statement 2"}},{"n":23,"q":"Sue Kim, CFA, a US citizen, works as an analyst for a subsidiary of a US investment firm on a small island that attracts offshore investment accounts. Local securities laws allow insider trading. While having dinner with the CEO of a local company, Kim learns that the firm is in negotiations to be acquired for a significant premium. Would Kim most likely comply with the CFA Institute Standards if she purchased the company’s shares for her client accounts?","o":{"A":"No","B":"Yes, because local laws allow insider trading","C":"Yes, if she receives permission from her firm's compliance department"}},{"n":24,"q":"A member works in a country where there is no regulation relating to investment performance standards. In the absence of any regulatory guidance, the member is required to communicate investment performance information to her clients in accordance with:","o":{"A":"the GIPS standards.","B":"the Code and Standards.","C":"stricter of the GIPS standards and the Code and Standards."}},{"n":25,"q":"According to the Standard relating to preservation of confidentiality, if local laws require investment personnel to maintain confidentiality, is a member permitted to share confidential client information?","o":{"A":"No","B":"Yes, if the information concerns activities of a former client","C":"Yes, if the information is provided in support of an investigation by the CFA Institute Professional Conduct Program into the member's conduct"}},{"n":26,"q":"Which of the following member actions most likely violates the Standard relating to fair dealing?","o":{"A":"Providing premium service levels to clients who pay higher fees","B":"Selectively offering different service levels to prospective clients","C":"Using different communication methods to recommend investments to clients"}},{"n":27,"q":"Sara Perkin, CFA, sends a stock recommendation in capsule form to clients and adds that additional information is available upon request. Perkin’s colleague, Tom Miller, CFA, uses a return forecasting model which has delivered positive results for his equity fund in each of the last seven years. Miller provides the model output in a marketing brochure and notes: \"The fund will continue to deliver a positive return next year.\" Has the Standard relating to communication with clients and prospective clients been violated?","o":{"A":"No","B":"Yes, by Miller","C":"Yes, by Perkin"}},{"n":28,"q":"An inventory system that reduces average inventory without affecting sales will most likely reduce the:","o":{"A":"quick ratio.","B":"inventory turnover.","C":"cash conversion cycle."}},{"n":29,"q":"With respect to fintech, which of the following statements is most accurate?","o":{"A":"Big Data solves the issue of selection bias.","B":"A neural network that learns a dataset too precisely may indicate overfitting.","C":"Machine learning algorithms require assumptions on the underlying probability distribution of the data."}},{"n":30,"q":"In calculating basic and diluted EPS, if the numerators are the same but the denominators are different, the company:","o":{"A":"split its stock during the year.","B":"had stock options outstanding at year end.","C":"had convertible debt outstanding at year end."}},{"n":31,"q":"Which of the following is most likely a feature of sole proprietorships?","o":{"A":"Existence of a legal identity","B":"Operational simplicity and flexibility","C":"Taxation of business profits as corporate income"}},{"n":32,"q":"A risky project has an initial cash outflow followed by cash inflows only. If the project's IRR is zero, the project's NPV is most likely:","o":{"A":"negative.","B":"zero.","C":"positive."}},{"n":33,"q":"Which of the following is a common pitfall in capital allocation analysis?","o":{"A":"Ignoring costs of internal financing","B":"Performing analysis in nominal terms","C":"Incorporating other companies' potential responses into the analysis"}},{"n":34,"q":"Which of the following best reflects good corporate governance?","o":{"A":"Dual-class share structure","B":"Established brand reputation","C":"Diversity, experience, and independence of directors"}},{"n":35,"q":"Which of the following disclosures about intangible assets is required under US GAAP?","o":{"A":"Why an asset is considered to have an indefinite life","B":"Where amortization is included on the income statement","C":"What the estimated amortization expense for the next five fiscal years will be"}},{"n":36,"q":"An analyst forecasts the following results for a company:\n§Net profit margin    18%\n§Depreciation    $6 million\n§Decrease in working capital    $1.5 million\n§Increase in fixed capital    $6 million\n§Market share    9%\nIf total industry sales are forecasted to be $3.3 billion and the company has no interest expense, the company's forecasted free cash flow to the firm is closest to:","o":{"A":"$43 million.","B":"$52 million.","C":"$55 million."}},{"n":37,"q":"Which of the following would best mitigate an analyst's confirmation bias when forecasting a firm's financial statements?","o":{"A":"Speaking with management of the firm","B":"Ignoring information about the firm's competitors","C":"Reading the research from analysts with a negative opinion of the firm"}},{"n":38,"q":"Because of a problem with the production process, a manufacturer produced a batch of defective finished goods with a total cost of $18,000. The sales value of this batch in its current condition is $6,000. With $3,000 of additional processing, however, the batch could be sold for $11,000. The value of the unsold inventory is closest to:","o":{"A":"$8,000.","B":"$9,000.","C":"$11,000."}},{"n":39,"q":"A common market has a higher degree of economic integration than a(n):","o":{"A":"customs union.","B":"monetary union.","C":"economic union."}},{"n":40,"q":"An analyst runs a simple linear regression using 35 months of data to assess a country's short-term interest rate as a function of its inflation rate, with the following results: Source Degrees of Freedom Sum of Squares Mean Square Regression 1 17.3009 17.3009 Error 33 20.2299 0.6130 Total 34 37.5308 --- The percentage of the variation in the short-term interest rate that is explained by the inflation rate is closest to:","o":{"A":"46%.","B":"54%.","C":"61%."}},{"n":41,"q":"An asset management firm generated the following annual returns in their US large-cap equity portfolio: Year Net Return (%) 2008 –34.8 2009 32.2 2010 11.1 2011 –1.4 The 2012 return needed to achieve a trailing five-year geometric mean annualized return of 5% when calculated at the end of 2012 is closest to:","o":{"A":"17.9%.","B":"27.6%.","C":"35.2%."}},{"n":42,"q":"A central bank most likely:","o":{"A":"will not lend money to banks facing shortages.","B":"is a monopoly supplier of a country's currency.","C":"does not manage a country's foreign currency reserves."}},{"n":43,"q":"A lessee entering into a long-term lease most likely:","o":{"A":"faces a higher risk of asset obsolescence compared to purchasing the asset with cash.","B":"reports a lower total asset turnover in the year of acquisition compared to purchasing the asset with cash.","C":"reports a greater investing cash outflow in the year of acquisition compared to purchasing the asset with cash."}},{"n":44,"q":"An analyst gathers the following information about a company:\n§ROE    6%\n§ROA    4%\n§Average total assets    €600,000\nBased only on this information, average total liabilities are:","o":{"A":"€200,000.","B":"€300,000.","C":"€400,000."}},{"n":45,"q":"In contrast to non-probability sampling, probability sampling:","o":{"A":"depends on factors other than probability considerations.","B":"has a high risk of generating a non-representative sample.","C":"gives every member of the population an equal chance of being selected."}},{"n":46,"q":"In which phase of the business cycle is actual output most likely below potential output?","o":{"A":"Recovery","B":"Slowdown","C":"Expansion"}},{"n":47,"q":"An analyst gathers the following information about a company that uses only common equity and debt in its capital structure:\n§Cost of debt, estimated by yield to maturity    5.1%\n§Cost of equity    9.8%\n§Percent of capital from debt    40.0%\nIf the company's marginal tax rate is 25%, the WACC is closest to:","o":{"A":"5.9%.","B":"7.4%.","C":"7.9%."}},{"n":48,"q":"The 'box' in a box and whisker plot represents the:","o":{"A":"interquartile range.","B":"range between the median and the arithmetic average.","C":"range between the highest and lowest values of the distribution."}},{"n":49,"q":"An analyst gathers the following information (in £ thousands) about equipment owned by a company:\n§Carrying amount prior to impairment    36\n§Fair value    34\n§Selling costs    4\nUndiscounted expected future cash flows 38\n§Discounted expected future cash flows    32\nThe equipment is considered impaired under:","o":{"A":"IFRS only.","B":"US GAAP only.","C":"both IFRS and US GAAP."}},{"n":50,"q":"The reversal of a prior fiscal year inventory write-down is:","o":{"A":"prohibited.","B":"recognized as a reduction in cost of sales.","C":"recognized as an increase in other operating income."}},{"n":51,"q":"The structural budget deficit is the deficit that exists if the economy:","o":{"A":"is below full potential output.","B":"is at full potential output.","C":"is above full potential output."}},{"n":52,"q":"Two populations are normally distributed with unknown variances that are assumed to be equal. If a large independent random sample is drawn from each population, the most appropriate test statistic for testing the difference between the population means is the:","o":{"A":"t-statistic.","B":"z-statistic.","C":"F-statistic."}},{"n":53,"q":"An analyst gathers the following information about a company's 3-year contract to produce computers:\n§Total sales price    €200,000\n§Estimated total costs    €100,000\n§Actual costs incurred in Year 1    €50,000\n§Total contracted number of computers to be produced    100 units\n§Total number of computers produced in Year 1    30 units\nThe output method provides an appropriate measure of progress towards completing the contract and performance obligations are satisfied over time. Assuming it is highly probable that revenue will not be subsequently reversed, revenue recognized in Year 1 is closest to:","o":{"A":"€60,000.","B":"€66,667.","C":"€100,000."}},{"n":54,"q":"An analyst gathers the following USD/GBP exchange rate information:\n§USD/GBP spot rate    1.11721\nUSD/GBP 1-year forward 1.11851rate\nUSD/GBP is the amount of USD per 1 GBP. The 1-year forward points are closest to:","o":{"A":"1.2.","B":"13.0.","C":"25.0."}},{"n":55,"q":"Which of the following statements about financial reporting is most accurate?","o":{"A":"Aggressive accounting choices in the current period may decrease the company’s future reported earnings","B":"High-quality financial reports contain information that is relevant, complete, conservative, and free from error","C":"Conservative accounting choices help a company with good performance issue higher quality financial reports"}},{"n":56,"q":"A mining company has received government approval for the development of a mining property and has also consulted with members of the local community near the development site throughout the project assessment process. The latter action is best described as an example of:","o":{"A":"regulatory compliance.","B":"stakeholder management.","C":"principal–agent conflict mitigation."}},{"n":57,"q":"Under US GAAP, material income items that are unusual and infrequent are shown as part of:","o":{"A":"continuing operations and presented separately.","B":"continuing operations and not presented separately.","C":"non-operating activities and not presented separately."}},{"n":58,"q":"A deferred tax liability could arise when:","o":{"A":"interest is received in advance but taxed on a cash basis.","B":"the carrying amount of an asset is higher than its tax base.","C":"taxable income is higher than accounting profit due to temporary differences."}},{"n":59,"q":"Using long-term debt or equity to finance working capital needs most likely:","o":{"A":"reduces the cost of financing working capital.","B":"provides the opportunity to borrow only as needed.","C":"reduces the need to access capital markets in times of stress."}},{"n":60,"q":"An analyst gathers the following information about a company:\n§Average variable cost per unit    $12.50\n§Selling price per unit    $37.50\n§Total fixed costs    $900,000\nThe minimum production level needed to continue operations over the long run is most likely:","o":{"A":"24,000 units.","B":"36,000 units.","C":"72,000 units."}},{"n":61,"q":"For an analyst estimating a company's target capital structure, which of the following methods is most appropriate?","o":{"A":"Apply the company’s current capital structure at book value weights","B":"Use the average capital structure of a diversified group of companies","C":"Infer the target capital structure by analyzing management statements on capital structure policy"}},{"n":62,"q":"Which of the following statements about kurtosis is most accurate?","o":{"A":"A fat-tailed distribution is referred to as platykurtic.","B":"All distributions with kurtosis above zero are fat-tailed.","C":"The calculation for kurtosis involves finding the average of deviations from the mean raised to the fourth power."}},{"n":63,"q":"An analyst gathers the following information about a company:\n§Year 2    Year 1\n§Revenue    €725,000 €720,000\n§EBIT    €93,500  €91,500\n§Net income    €57,500  €58,000\n§Weighted average common shares outstanding during the year    650,000  635,000\nWhich of the following increased from Year 1 to Year 2?","o":{"A":"Basic EPS","B":"EBIT margin","C":"Net profit margin"}},{"n":64,"q":"Monetary policy:","o":{"A":"aims to redistribute wealth within the economy.","B":"adjusts taxation rates to influence growth in the economy.","C":"aims to control the quantity of money and credit i
