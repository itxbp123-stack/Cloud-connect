n an economy."}},{"n":65,"q":"An analyst examines the following quarterly returns for a client's portfolio: Quarter Return (%) 1 8 2 3 3 –2 4 10 5 8 6 0 7 –3 8 12 If the target return is 5% per quarter, the target downside deviation is closest to:","o":{"A":"4.50%.","B":"11.92%.","C":"20.29%."}},{"n":66,"q":"An increase in a central bank's policy rate most likely leads to:","o":{"A":"decreasing real domestic demand and increasing net external demand.","B":"increasing real domestic demand and decreasing net external demand.","C":"decreasing real domestic demand and decreasing net external demand."}},{"n":67,"q":"If an auditor is experiencing some scope limitation, but can still issue an opinion, the auditor most likely issues a(n):","o":{"A":"adverse opinion.","B":"qualified opinion.","C":"disclaimer of opinion."}},{"n":68,"q":"An account has a stated annual interest rate of 3.6% with monthly compounding. The number of years it will take for an initial investment in the account to double is closest to:","o":{"A":"19.3.","B":"19.6.","C":"20.0."}},{"n":69,"q":"Whenever Variable X increases by four units, Variable Y increases by one unit. The correlation between X and Y is:","o":{"A":"0.25.","B":"0.75.","C":"1.00."}},{"n":70,"q":"The F-statistic for the test of fit of a simple linear regression is given by the:","o":{"A":"mean square regression divided by the mean square error.","B":"mean square regression divided by the sum of squares total.","C":"sum of squares regression divided by the sum of squares total."}},{"n":71,"q":"An analyst gathers the following information (in € thousands) about a company:\n§Year 2    Year 1\n§Revenue    2,400    2,000\n§Cost of sales    1,800    1,400\n§Ending accounts receivable    240    160\nThe number of days of sales outstanding for Year 2, based on a 365-day year, is closest to:","o":{"A":"30 days.","B":"33 days.","C":"41 days."}},{"n":72,"q":"With respect to national security, a country focusing on domestic economic factors most likely focuses on:","o":{"A":"growing national wealth.","B":"standardization of industries.","C":"securing essential resources through trade."}},{"n":73,"q":"Nationalization of industries is an example of which type of geopolitical tool?","o":{"A":"Financial","B":"Economic","C":"National security"}},{"n":74,"q":"With respect to the statement of cash flows under the indirect method, which of the following will increase net cash provided by operating activities compared to net income? An increase in:","o":{"A":"inventory.","B":"accounts payable.","C":"accounts receivable."}},{"n":75,"q":"A company's ability to support debt most likely improves with a(n):","o":{"A":"increase in liquidity.","B":"increase in leverage ratio.","C":"decrease in interest coverage."}},{"n":76,"q":"According to Modigliani-Miller propositions, if a profitable company uses more debt in the presence of taxes, firm value will:","o":{"A":"decrease.","B":"remain the same.","C":"increase."}},{"n":77,"q":"Capital restrictions most likely:","o":{"A":"allow capital to earn the highest return.","B":"help a country exercise control over its external balance.","C":"lead to a higher rate of growth than would otherwise occur."}},{"n":78,"q":"A test of independence is based on the data in a contingency table with 5 rows and 4 columns. Using a nonparametric test statistic that is chi-square distributed, the number of degrees of freedom is:","o":{"A":"7.","B":"12.","C":"20."}},{"n":79,"q":"The demand curve of a perfectly competitive firm is:","o":{"A":"vertical.","B":"horizontal.","C":"downward sloping."}},{"n":80,"q":"All else being equal, in periods of decreasing prices and constant inventory quantities, the FIFO inventory valuation method results in a higher:","o":{"A":"current ratio than LIFO.","B":"gross profit margin than LIFO.","C":"total asset turnover than LIFO."}},{"n":81,"q":"The Herfindahl–Hirschman index (HHI) is more responsive than the concentration ratio to:","o":{"A":"the elasticity of demand.","B":"potential entrants to the market.","C":"mergers among the existing companies in the market."}},{"n":82,"q":"A company uses both debt and equity financing as part of its capital structure. If the government reduces the corporate tax rate, the company's WACC will:","o":{"A":"decrease.","B":"remain the same.","C":"increase."}},{"n":83,"q":"Selling a product at a discount in order to build scale best describes:","o":{"A":"bundling.","B":"tiered pricing.","C":"penetration pricing."}},{"n":84,"q":"An investor plans to purchase an annuity for $1,500,000 in exactly 20 years to fund his retirement. The investor wants to save for that purchase by making 20 annual deposits into an account, starting today. If the account earns 4% per year, the annual deposit required to meet the investor's retirement goal is closest to:","o":{"A":"$48,435.","B":"$50,373.","C":"$52,388."}},{"n":85,"q":"The liquidity premium is 2% and the real risk-free interest rate is 4%. According to economic theory, the rate that only reflects the time preferences of individuals for current versus future real consumption is:","o":{"A":"2%.","B":"4%.","C":"6%."}},{"n":86,"q":"To increase liquidity, a central bank most likely implements an interest rate policy that is:","o":{"A":"contractionary.","B":"neutral.","C":"expansionary."}},{"n":87,"q":"A company reporting under US GAAP has production facilities with a net book value of $28.4 million. Recently, several competitors have entered its market, and the company now estimates that its production facilities will be able to generate cash flows of only $3 million per year for the next seven years. The firm has a cost of capital of 10%. Based on these recent events related to its production facilities, the company’s financial statements will most likely report a:","o":{"A":"$13.8 million reduction in operating cash flows.","B":"$13.8 million impairment loss on the income statement.","C":"$7.4 million reduction in the balance sheet carrying amount."}},{"n":88,"q":"An analyst gathers the following information (in € millions) about three companies operating in the same industry:\nCompany 1 Company 2 Company 3\n§PP&E    100    150    120\n§Total liabilities and shareholders'    600    1,000    800\nequity\n§Total shareholders' equity    200    500    200\nApplying vertical common-size balance sheet analysis, which company has the highest PP&E?","o":{"A":"Company 1","B":"Company 2","C":"Company 3"}},{"n":89,"q":"A potential benefit of effective corporate governance is:","o":{"A":"an increase in creditors' required return.","B":"the ability to mitigate the various risks underlying conflict of interest and agency problems.","C":"the opportunity for managers to manage the company with a lower risk profile relative to shareholders' risk tolerance."}},{"n":90,"q":"With respect to the cash flow statement, under US GAAP, interest paid is reported as a(n):","o":{"A":"investing activity.","B":"financing activity.","C":"operating activity."}}],"ME5-2":[{"n":1,"q":"Two years ago, a homeowner took out a $1 million home mortgage from a bank. The current principal on the loan is $750,000, and the homeowner has defaulted on the loan. Following foreclosure proceedings, the bank sells the property for $600,000 and is only entitled to use these funds to satisfy the loan obligation. The homeowner most likely had a:","o":{"A":"bullet loan.","B":"recourse loan.","C":"non-recourse loan."}},{"n":2,"q":"Valuing private equity investments using estimated prices rather than market prices most likely causes an:","o":{"A":"overestimation of both return volatility and the correlation of returns with traditional asset classes.","B":"underestimation of both return volatility and the correlation of returns with traditional asset classes.","C":"underestimation of return volatility and overestimation of the correlation of returns with traditional asset classes."}},{"n":3,"q":"A greenfield infrastructure investment is best described as an asset that has:","o":{"A":"yet to be constructed.","B":"already been constructed.","C":"reached the end of its useful life."}},{"n":4,"q":"Which of the following statements is most accurate? US commercial paper typically:","o":{"A":"requires the issuer to pledge collateral.","B":"requires the issuer to have a backup line of credit.","C":"has a maturity ranging from a few days up to two years."}},{"n":5,"q":"A limit order is an example of a(n):","o":{"A":"validity instruction.","B":"clearing instruction.","C":"execution instruction."}},{"n":6,"q":"Direct ownership of commercial real estate most likely:","o":{"A":"provides greater liquidity than a real estate investment trust.","B":"requires a lower initial investment than a real estate investment trust.","C":"offers greater investor control over underlying properties than a real estate investment trust."}},{"n":7,"q":"A net investment hedge occurs when a derivative is used to:","o":{"A":"offset the fluctuation in the fair value of an asset or liability.","B":"absorb the variable cash flow of a floating rate asset or liability.","C":"offset the exchange rate risk of the equity of a foreign operation."}},{"n":8,"q":"Consider bonds that have the same yield-to-maturity and maturity. The bond with the greatest reinvestment risk is most likely the one selling at:","o":{"A":"a discount.","B":"par.","C":"a premium."}},{"n":9,"q":"Which of the following is most likely considered an investor constraint in an investment policy statement?","o":{"A":"Time horizon","B":"Risk tolerance","C":"Return requirement"}},{"n":10,"q":"A positive duration gap indicates that a bond investor is currently:","o":{"A":"at risk of lower interest rates.","B":"at risk of higher interest rates.","C":"hedged against interest rate risk."}},{"n":11,"q":"Both equity and fixed-income indexes can be categorized according to the:","o":{"A":"currency of payments.","B":"issuer's economic sector.","C":"degree of inflation protection."}},{"n":12,"q":"Real estate is best classified as a:","o":{"A":"commodity.","B":"physical asset.","C":"financial asset."}},{"n":13,"q":"An analyst gathers the following information to evaluate the effect of dividends and leverage on future growth:\n§Scenario 1    Scenario 2\n§Dividend payout ratio    60%    40%\n§Financial leverage    3.0    2.5\nIf return on assets is the same for each scenario, the sustainable growth rate is:","o":{"A":"higher under Scenario 1.","B":"higher under Scenario 2.","C":"the same under both Scenario 1 and Scenario 2."}},{"n":14,"q":"An analyst gathers the following data (in INR millions) for a company located in India:\n§Market value of debt    10.0\n§Market value of preferred stock    5.0\n§Cash and short-term investments    4.5\n§Earnings before interest, taxes, depreciation, and amortization (EBITDA)    15.0\nAssuming an enterprise value multiple of 3.2, the company’s market capitalization (in INR millions) is closest to:","o":{"A":"28.5.","B":"33.0.","C":"37.5."}},{"n":15,"q":"Financial forecasting using historical base rates and convergence is best suited for companies that are:","o":{"A":"in highly cyclical industries.","B":"in well-established industries.","C":"industry leaders by a wide margin."}},{"n":16,"q":"A bond has a modified duration of 7.5 years and an annual convexity of 280. If yields decrease by 60 basis points, the percentage price change is closest to:","o":{"A":"4.00%.","B":"5.00%.","C":"5.51%."}},{"n":17,"q":"An analyst observes the fee structure and performance of a hedge fund with $100 million assets under management at the beginning of the year: Annual management fee  2%\n§Incentive fee    20%\n§Hard hurdle rate    3%\nThe annual management fee is based on the year-end valuation, and the incentive fee is calculated net of the management fee. If the fund return before fees is 10% at year end, the total annual fee earned by the fund manager is closest to:","o":{"A":"$3.2 million.","B":"$3.6 million.","C":"$3.8 million."}},{"n":18,"q":"Which of the following measures is least appropriate for evaluating the risk of a currency option?","o":{"A":"Beta","B":"Vega","C":"Delta"}},{"n":19,"q":"Compared to a European waterfall, an American waterfall is:","o":{"A":"less advantageous to the general partner.","B":"equally advantageous to the general partner.","C":"more advantageous to the general partner."}},{"n":20,"q":"For a given equity index, the long-term total return of the index is most likely greater than the price return:","o":{"A":"for any series of price returns.","B":"only when the price returns are less than zero.","C":"only when the price returns are equal to or greater than zero."}},{"n":21,"q":"With respect to a client's IPS, which of the following measures is most likely used when stating a relative risk objective?","o":{"A":"Value at risk","B":"Tracking risk","C":"Standard deviation of returns"}},{"n":22,"q":"Hedge funds are most likely characterized by:","o":{"A":"significant investment restrictions.","B":"a high correlation of returns with investment-grade bonds.","C":"performance relative to a traditional portfolio that may be hard to gauge."}},{"n":23,"q":"Insurance on a portfolio of risky assets is most likely:","o":{"A":"negatively correlated with the portfolio's assets.","B":"uncorrelated with the portfolio's assets.","C":"positively correlated with the portfolio's assets."}},{"n":24,"q":"When forming asset classes for a strategic asset allocation, the defined asset classes should:","o":{"A":"approximate the relevant investable universe.","B":"have high pairwise correlations between them.","C":"contain negatively correlated assets within each asset class."}},{"n":25,"q":"An analyst gathers the following information about a company's common stock:\n§Dividend per share – Year 1    $2.00\n§Dividend per share – Year 2    $2.10\nAnnual dividend per share – Year 3 and beyond  $2.21 If the required rate of return is 10%, the intrinsic value per share is closest to:","o":{"A":"$21.82.","B":"$22.10.","C":"$27.31."}}, "the same.","C":"longer."}},{"n":34,"q":"Management fees for private equity funds are most likely based on:","o":{"A":"invested capital.","B":"committed capital","C":"assets under management."}},{"n":35,"q":"A portfolio manager analyzes a market and discovers that it is not possible to achieve consistent and superior risk-adjusted returns, net of all expenses. This market is most likely characterized by:","o":{"A":"persistent anomalies.","B":"informational efficiency.","C":"restrictions on short selling."}},{"n":36,"q":"Which of the following statements about the use of derivative instruments is most accurate?","o":{"A":"Small exposures to an underlying can be created with a large cash outlay","B":"Financial market exposure associated with commercial transactions can be offset by issuers","C":"Higher transaction costs are typically incurred compared to underlying spot market transactions"}},{"n":37,"q":"Which of the following cognitive errors is best classified as a belief perseverance bias?","o":{"A":"Availability bias","B":"Confirmation bias","C":"Mental accounting bias"}},{"n":38,"q":"The redemption value of a US Treasury Inflation-Protected Securities (TIPS) issue at maturity is most likely:","o":{"A":"equal to the initial par value.","B":"the greater of the inflation-adjusted principal or initial par value.","C":"above or below the initial par value depending on actual inflation during the term."}},{"n":39,"q":"Tactical asset allocation is best described as adding value by:","o":{"A":"subdividing portfolio risk over the sources of investment return.","B":"deliberately deviating from policy exposures to systematic risk factors.","C":"combining long-term capital market expectations with investor objectives and constraints."}},{"n":40,"q":"In a one-period binomial model, the risk-neutral probabilities of upward and downward price movements of an underlying asset are determined by:","o":{"A":"the risk-free rate.","B":"investors’ risk aversion.","C":"the probabilities of the underlying price moving up and down."}},{"n":41,"q":"An investor buys a call for $24.70 that has a strike price of $650. If the value at expiration for this call is $47.60, the price of the underlying at expiration is closest to:","o":{"A":"$602.40.","B":"$672.90.","C":"$697.60."}},{"n":42,"q":"An annual-pay bond with a £1,000 face value has a coupon rate of 4% and matures in three years. If the yield to maturity is 3%, the current value of the bond is closest to:","o":{"A":"£972.","B":"£1,028.","C":"£1,142."}},{"n":43,"q":"With respect to the absolute priority of claims in bankruptcy, which of the following most likely has the highest seniority ranking?","o":{"A":"Third lien debt","B":"Subordinated debt","C":"Senior unsecured debt"}},{"n":44,"q":"Compared with its market-value-weighted counterpart, a fundamental-weighted index is least likely to have a:","o":{"A":"value tilt.","B":"contrarian effect.","C":"momentum effect."}},{"n":45,"q":"In contrast to risk tolerance, risk budgeting focuses more on:","o":{"A":"how risk is taken.","B":"the appetite for risk.","C":"what is and is not acceptable risk."}},{"n":46,"q":"Which of the following statements is most accurate? Cryptocurrencies:","o":{"A":"exhibit low volatility.","B":"have no limits on the total amount of currency that may be issued.","C":"allow transactions between parties without the need for an intermediary."}},{"n":47,"q":"The duration statistic that best measures the interest rate risk of a bond that does not have a well-defined internal rate of return is:","o":{"A":"effective duration.","B":"modified duration.","C":"Macaulay duration."}},{"n":48,"q":"An analyst gathers the following information about three well-diversified equity portfolios:\n§Portfolio    Mean return    Beta\n§1    9.2%    1.2\n§2    12.4%    1.4\n§3    15.0%    2.3\nGiven a risk-free rate of 1.8%, the portfolio with the highest Treynor ratio is:","o":{"A":"Portfolio 1.","B":"Portfolio 2.","C":"Portfolio 3."}},{"n":49,"q":"The modified duration of an option-free corporate bond best estimates the percentage price change due to changes in the:","o":{"A":"horizon yield.","B":"yield-to-maturity.","C":"benchmark yield curve."}},{"n":50,"q":"An analyst gathers the following information about a portfolio:\n§Portfolio Weight    Standard Deviation\n§Asset 1    25%    12%\n§Asset 2    75%    16%\nIf the correlation coefficient between the two assets is 0.75, the standard deviation of the portfolio is closest to:","o":{"A":"12.37%.","B":"14.39%.","C":"15.00%."}},{"n":51,"q":"Two investors have utility functions that differ only with regard to the coefficient of risk aversion. Relative to the investor with a higher coefficient of risk aversion, the optimal portfolio for the investor with a lower coefficient of risk aversion will most likely have:","o":{"A":"a lower level of risk and return.","B":"the same level of risk and return.","C":"a higher level of risk and return."}},{"n":52,"q":"Which of the following involves a private equity firm introducing leverage to its portfolio company and paying itself a dividend out of the new capital structure?","o":{"A":"Venture debt","B":"Recapitalization","C":"Mezzanine loans"}},{"n":53,"q":"A European call option has an exercise price of $80 and an option premium of $12. The price of the underlying is $75. The intrinsic value of the option is:","o":{"A":"$0.","B":"$5.","C":"$7."}},{"n":54,"q":"Which of the following most likely provides the greatest redemption flexibility?","o":{"A":"Hedge funds","B":"Private equity funds","C":"Funds of hedge funds"}},{"n":55,"q":"An equity portfolio manager is evaluating her sector allocation strategy for the upcoming year. She expects the global economy to experience a slowdown period for the next two years. Furthermore, she believes that companies will be facing diminishing growth rates with respect to revenues and profits. On the basis of these beliefs, the portfolio manager will most likely overweight:","o":{"A":"autos.","B":"materials.","C":"consumer staples."}},{"n":56,"q":"A company's depository receipts most likely trade:","o":{"A":"like ordinary shares on the investors' local exchanges.","B":"in the local currency on the company's local exchange.","C":"in the company's currency on investors' local exchanges."}},{"n":57,"q":"An investor opens a margin account with an initial deposit of $5,000. He then purchases 300 shares of a stock at $30 per share using margin. The account requires a maintenance margin of 30%. Ignoring commissions and interest, the price below which the investor will first receive a margin call is closest to:","o":{"A":"$19.05.","B":"$23.08.","C":"$23.81."}},{"n":58,"q":"What is the most likely reason why arbitrage will not completely eliminate all pricing discrepancies for derivatives?","o":{"A":"Transaction costs","B":"Inaccurate forecasts","C":"Differences in risk aversion"}},{"n":59,"q":"Key rate duration measures the sensitivity of a bond's price to a change in:","o":{"A":"its yield to maturity.","B":"its yield to first call.","C":"the shape of the benchmark yield curve."}},{"n":60,"q":"The sum of the coupon payments over a year divided by the flat price of a bond is best defined as:","o":{"A":"true yield.","B":"simple yield.","C":"current yield."}},{"n":61,"q":"An analyst is concerned that a bond might be downgraded one category by Standard & Poor's and become non-investment grade. The current rating of this bond is most likely:","o":{"A":"A–.","B":"BB–.","C":"BBB–."}},{"n":62,"q":"A company that is required to raise equity capital to continue to operate as a going concern is most likely doing so to:","o":{"A":"purchase long-lived assets.","B":"fund capital expansion projects.","C":"improve capital adequacy ratios."}},{"n":63,"q":"An investor purchased shares on margin at €50 per share using a leverage ratio of 2.0. If the shares are sold for €70 per share, the return on the investor's equity investment is:","o":{"A":"40%.","B":"80%.","C":"180%."}},{"n" ements best describes changes in the value of a long forward position during its life?","o":{"A":"As interest rates go down, the value of the position goes up","B":"As the time to maturity goes down, the value of the position goes up","C":"As the price of the underlying goes up, the value of the position goes up"}},{"n":78,"q":"A reason for a company's management to repurchase its shares is to signal a belief that the company's shares are:","o":{"A":"undervalued.","B":"fairly valued.","C":"overvalued."}},{"n":79,"q":"An analyst gathers the following estimates about a company: Earnings retention rate  40%\n§Growth rate    3%\nIf the justified forward P/E is 10 based on the Gordon growth model, the required rate of return is:","o":{"A":"6%.","B":"7%.","C":"9%."}},{"n":80,"q":"Which of the following is most likely considered an affirmative covenant?","o":{"A":"A minimum interest coverage ratio","B":"A limit on the level of share buybacks","C":"What the issuer will do with the proceeds of a bond issue"}},{"n":81,"q":"The actions of non-hedging investors impact:","o":{"A":"commodity supply only.","B":"commodity demand only.","C":"both commodity supply and commodity demand."}},{"n":82,"q":"Accounting standards and reporting requirements that produce meaningful and timely financial disclosures are most critical for achieving which of the following efficiencies associated with a well-functioning financial system?","o":{"A":"Allocational","B":"Informational","C":"Operational"}},{"n":83,"q":"At initiation, the price of a forward contract is most likely:","o":{"A":"less than the value of the forward contract.","B":"equal to the value of the forward contract.","C":"greater than the value of the forward contract."}},{"n":84,"q":"An asset-backed securitization with a waterfall structure is most likely structured with which type of credit enhancement?","o":{"A":"Subordination","B":"Time tranching","C":"Special-purpose entity (SPE)"}},{"n":85,"q":"Failed market regulation most likely results in decreased:","o":{"A":"fraud.","B":"economic efficiency.","C":"costs for investor participation."}},{"n":86,"q":"Under which of the following alternative investment methods can an investor invest indirectly in alternative assets?","o":{"A":"Co-investing only","B":"Fund investing only","C":"Both co-investing and fund investing"}},{"n":87,"q":"Information for Stock A and the market appear in the following table:\n§Standard deviation of Stock A's return    40%\n§Standard deviation of the market's return    20%\n§Correlation of Stock A with the market    85%\nThe beta of Stock A is closest to:","o":{"A":"0.43.","B":"1.70.","C":"2.35."}},{"n":88,"q":"Which of the following is most likely a cross-sectional anomaly in financial markets?","o":{"A":"Value effect","B":"Overreaction effect","C":"Closed-end fund discount"}},{"n":89,"q":"Compared to investing in a single security, the portfolio approach can improve investors' risk–return trade-off by offering:","o":{"A":"lower expected return with the same overall volatility of returns.","B":"the same expected return with lower overall volatility of returns.","C":"higher overall volatility of returns for a given level of expected return."}},{"n":90,"q":"In a rising interest rate environment, the effective duration of a putable bond relative to an otherwise identical non-putable bond, will most likely be:","o":{"A":"lower.","B":"the same.","C":"higher."}}]}</script>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const TP = JSON.parse(document.getElementById('topics').textContent);
const TN = {ETH:'윤리',QM:'계량',ECO:'경제',FSA:'재무제표',CI:'기업이슈',EQ:'주식',FI:'채권',DER:'파생',ALT:'대체투자',PM:'포트폴리오',X:'미분류'};
const EXAMS = [['ME3-1','모의고사 3회 1부'],['ME3-2','모의고사 3회 2부'],['ME4-1','모의고사 4회 1부'],['ME4-2','모의고사 4회 2부'],['ME5-1','모의고사 5회 1부'],['ME5-2','모의고사 5회 2부']];
const LIMIT = 135*60;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hasKey = id => D[id].some(q => q.a);
const topic = (id, n) => TP[id + '#' + n] || 'X';
function load(k, d){ try { const v = localStorage.getItem('cfa:' + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem('cfa:' + k, JSON.stringify(v)); } catch(e){} }

function rich(t){
  const out = []; let tb = null;
  for (const l of String(t).split('\n')){
    if (l.startsWith('§')){ (tb = tb || []).push(l.slice(1).split(/ {4,}/)); continue; }
    if (tb){ out.push('<table>' + tb.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</table>'); tb = null; }
    out.push('<p>' + esc(l) + '</p>');
  }
  if (tb) out.push('<table>' + tb.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</table>');
  return out.join('');
}
function fmt(s){ s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h + ':' : '') + String(m).padStart(h?2:1,'0') + ':' + String(x).padStart(2,'0'); }

let S = null, timerH = null;  // current session state

function home(){
  stopTimer(); S = null;
  const rows = EXAMS.map(([id, name]) => {
    const cur = load('cur:' + id, null), hist = load('hist:' + id, []);
    const key = hasKey(id);
    let meta = D[id].length + '문제 · 135분' + (key ? '' : ' · 정답표 없음');
    if (hist.length){ const h = hist[hist.length-1]; meta += ' · 최근 ' + (key ? h.score + '/' + h.total + ' (' + Math.round(h.score/h.total*100) + '%)' : '제출함') + ' ' + h.date; }
    const btns = cur
      ? `<button class="btn pri" onclick="resume('${id}')">이어 풀기 (${Object.keys(cur.ans).length}/${D[id].length})</button><button class="btn" onclick="discard('${id}')">처음부터</button>`
      : `<button class="btn pri" onclick="start('${id}','exam')">실전 모드</button><button class="btn" onclick="start('${id}','practice')">연습 모드</button>`;
    const last = hist.length ? `<button class="btn" onclick="showResult('${id}',${hist.length-1})">지난 결과</button>` : '';
    return `<div class="card"><div class="ex-title">${name}</div><div class="ex-meta">${meta}</div><div class="ex-btns">${btns}${last}</div></div>`;
  }).join('');
  $('#app').innerHTML = `<div class="wrap"><h1>CFA Level I 모의고사</h1>
  <div class="sub">실전 모드: 135분 타이머, 제출 후 채점·해설 / 연습 모드: 한 문제씩 바로 정답·해설</div>${rows}
  <div class="note">기록은 이 기기 브라우저에만 저장됨. 5회는 정답표가 없어 답만 기록됨(결과 화면에서 복사해 Claude에 보내면 채점).</div></div>`;
  scrollTo(0,0);
}
function discard(id){ if (confirm('진행 중인 기록을 지우고 처음부터 시작할까요?')){ save('cur:' + id, null); try{localStorage.removeItem('cfa:cur:' + id);}catch(e){} home(); } }
function start(id, mode, only){
  S = {id, mode, ans:{}, flag:{}, used:0, i:0, only: only || null};
  persist(); render();
}
function resume(id){ S = load('cur:' + id, null); if (!S) return home(); render(); }
function persist(){ if (S) save('cur:' + S.id, S); }
function qs(){ const all = D[S.id]; return S.only ? all.filter(q => S.only.includes(q.n)) : all; }

function startTimer(){
  stopTimer(); let t0 = Date.now();
  timerH = setInterval(() => {
    const now = Date.now(); if (document.hidden){ t0 = now; return; }
    S.used += (now - t0)/1000; t0 = now; paintTimer();
    if (Math.floor(S.used) % 5 === 0) persist();
    if (S.mode === 'exam' && S.used >= LIMIT){ stopTimer(); alert('시간 종료. 자동 제출합니다.'); submit(true); }
  }, 1000);
}
function stopTimer(){ if (timerH) clearInterval(timerH); timerH = null; }
function paintTimer(){
  const el = $('#tm'); if (!el) return;
  const left = LIMIT * (qs().length / D[S.id].length) - S.used;
  el.textContent = S.mode === 'exam' ? fmt(left) : fmt(S.used);
  el.classList.toggle('low', S.mode === 'exam' && left < 600);
}

function render(){
  const list = qs(), q = list[S.i], id = S.id, key = hasKey(id);
  const chosen = S.ans[q.n], reveal = S.mode === 'practice' && chosen && key;
  const opts = ['A','B','C'].map(k => {
    let c = 'opt';
    if (reveal){ if (k === q.a) c += ' ok'; else if (k === chosen) c += ' bad'; }
    else if (k === chosen) c += ' sel';
    let fb = '';
    if (reveal && q.f && q.f[k]) fb = `<div class="fb ${k===q.a?'ok':''}"><div class="h">${k===q.a?'정답 해설':k+' 오답 이유'}</div>${rich(q.f[k])}</div>`;
    return `<button class="${c}" onclick="pick('${k}')"><span class="k">${k}</span><span>${esc(q.o[k] || '')}</span></button>${fb}`;
  }).join('');
  const res = reveal ? `<div class="card" style="padding:10px 14px"><b class="${chosen===q.a?'ok-t':'bad-t'}">${chosen===q.a?'정답':'오답 · 정답 '+q.a}</b> <span class="tag">${TN[topic(id,q.n)]}</span></div>` : '';
  const answered = list.filter(x => S.ans[x.n]).length;
  $('#app').innerHTML = `<div class="bar"><div class="in">
    <button class="btn sm" onclick="leave()">나가기</button>
    <span class="qno">${S.i+1}<span class="note"> / ${list.length}</span></span>
    <span class="sp"></span><span class="timer" id="tm"></span>
    <button class="btn sm flagbtn ${S.flag[q.n]?'on':''}" onclick="toggleFlag()">표시</button>
    <button class="btn sm" onclick="openGrid()">목록 ${answered}</button>
  </div></div>
  <div class="wrap">${res}<div class="card"><div class="note" style="margin-bottom:6px">Q${q.n}${S.mode==='practice'&&!reveal?'':''}</div><div class="stem">${rich(q.q)}</div></div>${opts}</div>
  <div class="nav"><div class="in">
    <button class="btn" onclick="go(-1)" ${S.i===0?'disabled':''}>이전</button>
    ${S.i === list.length-1 ? `<button class="btn pri" onclick="submit()">제출</button>` : `<button class="btn pri" onclick="go(1)">다음</button>`}
  </div></div>`;
  paintTimer(); if (!timerH) startTimer(); scrollTo(0,0);
}
function pick(k){
  const q = qs()[S.i];
  if (S.mode === 'practice' && S.ans[q.n] && hasKey(S.id)) return;
  S.ans[q.n] = k; persist(); const y = scrollY; render(); scrollTo(0, S.mode === 'practice' ? y : 0);
}
function toggleFlag(){ const q = qs()[S.i]; S.flag[q.n] = !S.flag[q.n]; if (!S.flag[q.n]) delete S.flag[q.n]; persist(); const y = scrollY; render(); scrollTo(0,y); }
function go(d){ S.i = Math.min(qs().length-1, Math.max(0, S.i + d)); persist(); render(); }
function leave(){ persist(); home(); }
function openGrid(){
  const list = qs(), key = hasKey(S.id);
  const cells = list.map((q, i) => {
    let c = 'cell'; const a = S.ans[q.n];
    if (a){ c += (S.mode==='practice' && key) ? (a===q.a?' ok':' bad') : ' ans'; }
    if (S.flag[q.n]) c += ' fl'; if (i === S.i) c += ' cur';
    return `<button class="${c}" onclick="jump(${i})">${q.n}</button>`;
  }).join('');
  const un = list.length - list.filter(q => S.ans[q.n]).length;
  const d = document.createElement('div'); d.className = 'sheet'; d.id = 'sh';
  d.onclick = e => { if (e.target === d) d.remove(); };
  d.innerHTML = `<div class="pane"><div class="in"><div class="row" style="margin-bottom:10px"><b>문제 목록</b><span class="sp"></span><span class="note">안 푼 문제 ${un} · 주황 점 = 표시</span></div><div class="grid">${cells}</div>
  <div class="row" style="margin-top:14px"><button class="btn" style="flex:1" onclick="$('#sh').remove()">닫기</button><button class="btn pri" style="flex:1" onclick="submit()">제출</button></div></div></div>`;
  document.body.appendChild(d);
}
function jump(i){ $('#sh') && $('#sh').remove(); S.i = i; persist(); render(); }

function submit(force){
  const list = qs(), un = list.filter(q => !S.ans[q.n]).length;
  if (!force && !confirm(un ? `안 푼 문제 ${un}개가 있습니다. 제출할까요?` : '제출할까요?')) return;
  stopTimer(); $('#sh') && $('#sh').remove();
  const key = hasKey(S.id);
  const score = key ? list.filter(q => S.ans[q.n] === q.a).length : 0;
  const d = new Date();
  const rec = {date: (d.getMonth()+1) + '/' + d.getDate(), mode: S.mode, used: Math.round(S.used), score, total: list.length, ans: S.ans, flag: S.flag, only: S.only};
  const hist = load('hist:' + S.id, []); hist.push(rec); save('hist:' + S.id, hist);
  try { localStorage.removeItem('cfa:cur:' + S.id); } catch(e){}
  const id = S.id; S = null; showResult(id, hist.length - 1);
}

let R = null;
function showResult(id, hi, filter){
  stopTimer();
  const hist = load('hist:' + id, []), h = hist[hi]; if (!h) return home();
  R = {id, hi, filter: filter || 'all'};
  const key = hasKey(id), all = D[id], list = h.only ? all.filter(q => h.only.includes(q.n)) : all;
  const name = EXAMS.find(e => e[0] === id)[1];
  let top = '';
  if (key){
    const by = {};
    list.forEach(q => { const t = topic(id, q.n); by[t] = by[t] || {n:0, ok:0}; by[t].n++; if (h.ans[q.n] === q.a) by[t].ok++; });
    const order = Object.keys(TN).filter(t => by[t]);
    const trs = order.map(t => { const p = Math.round(by[t].ok/by[t].n*100); return `<tr><td>${TN[t]}</td><td>${by[t].ok}/${by[t].n}</td><td class="${p>=70?'ok-t':p<50?'bad-t':''}">${p}%</td></tr>`; }).join('');
    const pct = Math.round(h.score/h.total*100);
    top = `<div class="card"><div class="row"><div><div class="big">${h.score}<span class="note" style="font-size:16px"> / ${h.total}</span></div><div class="note">정답률 ${pct}% · 소요 ${fmt(h.used)} · ${h.mode==='exam'?'실전':'연습'} · ${h.date}</div></div></div>
    <div class="note" style="margin-top:6px">합격선은 공개되지 않음. 모의고사 기준 70% 이상을 목표로 잡는 것이 일반적.</div></div>
    <div class="card"><table class="t"><tr><th>과목</th><th>정답</th><th>정답률</th></tr>${trs}</table><div class="note" style="margin-top:6px">과목은 문제 내용을 보고 자동 분류함.</div></div>`;
  } else {
    const str = list.map(q => q.n + (h.ans[q.n] || '-')).join(' ');
    top = `<div class="card"><b>정답표 없음</b><div class="note" style="margin:4px 0 8px">아래 답안을 복사해서 Claude에게 보내면 채점·해설함.</div><textarea rows="5" readonly onclick="this.select()">${name} 답안: ${str}</textarea><button class="btn sm" style="margin-top:6px" onclick="copyAns()">복사</button></div>`;
  }
  const wrong = list.filter(q => key && h.ans[q.n] !== q.a).map(q => q.n);
  const fl = list.filter(q => h.flag && h.flag[q.n]).map(q => q.n);
  const shown = list.filter(q => R.filter === 'all' || (R.filter === 'wrong' && wrong.includes(q.n)) || (R.filter === 'flag' && fl.includes(q.n)));
  const cells = shown.map(q => { const a = h.ans[q.n]; let c = 'cell'; if (key) c += a === q.a ? ' ok' : ' bad'; else if (a) c += ' ans'; if (h.flag && h.flag[q.n]) c += ' fl'; return `<button class="${c}" onclick="review(${q.n})">${q.n}</button>`; }).join('');
  const retry = key && wrong.length ? `<button class="btn" onclick="retryWrong()">틀린 ${wrong.length}문제 다시 풀기</button>` : '';
  $('#app').innerHTML = `<div class="wrap"><div class="row" style="margin:6px 0 10px"><button class="btn sm" onclick="home()">처음으로</button><span class="sp"></span><b>${name}</b></div>${top}
  <div class="card"><div class="seg" style="margin-bottom:10px">
    <button class="${R.filter==='all'?'on':''}" onclick="showResult('${id}',${hi},'all')">전체</button>
    ${key?`<button class="${R.filter==='wrong'?'on':''}" onclick="showResult('${id}',${hi},'wrong')">틀린 것 ${wrong.length}</button>`:''}
    <button class="${R.filter==='flag'?'on':''}" onclick="showResult('${id}',${hi},'flag')">표시 ${fl.length}</button></div>
    <div class="grid">${cells || '<span class="note">해당 문제 없음</span>'}</div>
    <div class="note" style="margin-top:8px">번호를 누르면 문제·내 답·선지별 해설이 열림.</div></div>
  <div class="ex-btns">${retry}</div></div>`;
  scrollTo(0,0);
}
function copyAns(){ const t = document.querySelector('textarea'); t.select(); try { navigator.clipboard.writeText(t.value).then(() => alert('복사됨'), () => document.execCommand('copy')); } catch(e){ document.execCommand('copy'); } }
function retryWrong(){
  const h = load('hist:' + R.id, [])[R.hi], all = D[R.id];
  const list = h.only ? all.filter(q => h.only.includes(q.n)) : all;
  start(R.id, 'practice', list.filter(q => h.ans[q.n] !== q.a).map(q => q.n));
}
function review(n){
  const h = load('hist:' + R.id, [])[R.hi], q = D[R.id].find(x => x.n === n), key = hasKey(R.id), my = h.ans[n];
  const opts = ['A','B','C'].map(k => {
    let c = 'opt'; if (key){ if (k === q.a) c += ' ok'; else if (k === my) c += ' bad'; } else if (k === my) c += ' sel';
    const tag = (k === my ? ' <span class="tag">내 답</span>' : '') + (key && k === q.a ? ' <span class="tag">정답</span>' : '');
    const fb = q.f && q.f[k] ? `<div class="fb ${k===q.a?'ok':''}"><div class="h">${k===q.a?'정답 해설':k+' 오답 이유'}</div>${rich(q.f[k])}</div>` : '';
    return `<div class="${c}" style="cursor:default"><span class="k">${k}</span><span>${esc(q.o[k]||'')}${tag}</span></div>${fb}`;
  }).join('');
  const all = D[R.id], list = h.only ? all.filter(x => h.only.includes(x.n)) : all, idx = list.findIndex(x => x.n === n);
  const res = key ? `<b class="${my===q.a?'ok-t':'bad-t'}">${my===q.a?'정답':my?'오답':'안 풂'}</b> · 정답 ${q.a}` : `내 답 ${my || '-'}`;
  $('#app').innerHTML = `<div class="bar"><div class="in"><button class="btn sm" onclick="showResult('${R.id}',${R.hi},'${R.filter}')">결과로</button><span class="qno">Q${n}</span><span class="tag">${TN[topic(R.id,n)]}</span><span class="sp"></span>${res}</div></div>
  <div class="wrap"><div class="card"><div class="stem">${rich(q.q)}</div></div>${opts}</div>
  <div class="nav"><div class="in"><button class="btn" ${idx<=0?'disabled':''} onclick="review(${idx>0?list[idx-1].n:n})">이전</button><button class="btn" ${idx>=list.length-1?'disabled':''} onclick="review(${idx<list.length-1?list[idx+1].n:n})">다음</button></div></div>`;
  scrollTo(0,0);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
home();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
