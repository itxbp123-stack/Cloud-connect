},{"n":65,"q":"The bootstrap resampling method:","o":{"A":"guarantees that all items will appear in the resamples.","B":"relies on an analytical formula to estimate the distribution of the estimators.","C":"mimics the random sampling process by treating the randomly drawn sample as if it were the population."},"f":{"A":"Incorrect because in bootstrap, we repeatedly draw samples from the original sample, and each resample is of the same size as the original sample. Note that although some items may appear several times in the resamples, other items may not appear at all. Thus, bootstrap does not guarantee that all items will appear in the resamples.","B":"Incorrect because compared with conventional statistical methods, bootstrap does not rely on an analytical formula to estimate the distribution of the estimators.","C":"Correct because the bootstrap mimics the (simple random sampling) process by treating the randomly drawn sample as if it were the population."},"a":"C"},{"n":66,"q":"Assume the percentage increases in each of the following listed items: Percentage Increase\n§Real domestic exchange rate (USD/EUR)    5\n§Eurozone price level    2\n§US price level    1.5\nThe predicted change in the nominal US spot exchange rate is closest to:","o":{"A":"–0.5%.","B":"4.5%.","C":"5.5%."},"f":{"A":"Incorrect because the change in the real exchange rate is not included: [(1 + 1.5%)/(1 + 2%)] – 1 = –0.5%.","B":"Correct. Change in the nominal exchange rate:= (1+%ΔReal Exchange rate(USD/EUR)) × [(1+%ΔUS price level)/(1+%ΔEurozone price level)] – 1 = (1+5%) × [(1+1.5%)/(1+2%)] – 1= 4.5%","C":"Incorrect because the change in the price levels are inverted: (1 + 5%) × [(1 + 2%)/(1 + 1.5%)] – 1 = 5.5%."},"a":"B"},{"n":67,"q":"A company is prohibited from reversing the impairment loss on a long-lived asset classified as:","o":{"A":"held for use under IFRS.","B":"held for use under US GAAP.","C":"held for sale under US GAAP."},"f":{"A":"Incorrect because IFRS permit impairment losses to be reversed if the recoverable amount of an asset increases regardless of whether the asset is classified as held for use or held for sale. Note that IFRS permits the reversal of impairment losses only.","B":"Correct because under US GAAP, once an impairment loss has been recognized for assets held for use, it cannot be reversed. In other words, once the value of an asset held for use has been decreased by an impairment charge, it cannot be increased.","C":"Incorrect because under US GAAP, the accounting for reversals of impairments depends on whether the asset is classified as held for use or held for sale. For assets held for sale, if the fair value increases after an impairment loss, the loss can be reversed."},"a":"B"},{"n":68,"q":"Unaudited financial statements are most likely presented in a(n):","o":{"A":"annual report.","B":"quarterly report.","C":"proxy statement."},"f":{"A":"Incorrect because the Auditor's Report is generally provided to shareholders at least annually.","B":"Correct because interim reports are also provided by the company either semiannually or quarterly, depending on the applicable regulatory requirements. Interim reports generally present the four basic financial statements and condensed notes but are not audited.","C":"Incorrect because the Auditor's Report is generally provided to shareholders at least annually. In addition, companies also provide information on management and director compensation, company stock performance, and any potential conflicts of interest that may exist between management, the board, and shareholders. This information may appear in the company's annual report or other publicly available documents. Public companies often provide this information in proxy statements, which are statements distributed to shareholders about matters that are to be put to a vote at the company's annual (or special) meeting of shareholders. Accordingly, the proxy statement provides other information and generally does not provide unaudited (or audited) financial statements."},"a":"B"},{"n":69,"q":"From the perspective of a corporate issuer, which of the following is a benefit of issuing debt rather than equity as a source of capital? Debt is most likely:","o":{"A":"cheaper.","B":"less risky.","C":"more permanent."},"f":{"A":"Correct because debt represents a cheaper financing source for companies and a lower risk for investors. Because the returns to lenders are capped and because the cost of debt is lower than the cost of equity, corporations with predictable cash flows may prefer to borrow money rather than sell an ownership stake to raise the capital they need to finance their investments. This is because issuing more equity dilutes upside return for existing equity owners given that residual value must be shared across more owners.","B":"Incorrect because from the issuer’s perspective, bonds are riskier than stocks for the same reason bonds are safer than stocks for investors. Bonds increase risk to the corporation by increasing leverage. If the company is struggling and cannot meet its promised obligations to bondholders, bondholders have the legal standing to force certain actions upon the corporation, such as bankruptcy and liquidation.","C":"Incorrect because equity holders represent a more permanent source of capital and have voting rights to elect the board of directors, which oversees the management of the company. Debt has a stated, finite term with generally no voting rights, while equity has no finite term and includes voting rights."},"a":"A"},{"n":70,"q":"Compared with its net income, a mature company’s operating cash flow is most likely:","o":{"A":"lower.","B":"the same.","C":"higher."},"f":{"A":"Incorrect. For a mature company, net income includes non-cash expenses (depreciation and amortization), so it is expected and desirable for operating cash flow exceeds net income. If operating cash flows were lower than net income, this would be an indication of poor earnings quality.","B":"Incorrect. For a mature company, net income includes non-cash expenses (depreciation and amortization), so it is expected and desirable for operating cash flow to exceed net income, not for them to be equal.","C":"Correct. For a mature company, because net income includes non-cash expenses (depreciation and amortization), operating cash flow typically exceeds net income."},"a":"C"},{"n":71,"q":"In hypothesis testing, which of the following is stated in terms of population parameters?","o":{"A":"The null hypothesis only","B":"The alternative hypothesis only","C":"Both the null hypothesis and the alternative hypothesis"},"f":{"A":"Incorrect because the null and alternative hypotheses are stated in terms of population parameters, and we use sample statistics to test these hypotheses.","B":"Incorrect because the null and alternative hypotheses are stated in terms of population parameters, and we use sample statistics to test these hypotheses.","C":"Correct because the null and alternative hypotheses are stated in terms of population parameters, and we use sample statistics to test these hypotheses."},"a":"C"},{"n":72,"q":"An analyst gathers the following information (in £ millions) from a company's year-end balance sheet: Year 2 Year 1\n§Accounts receivable    65    55\n§Inventory    120    140\n§PP&E    1,400  1,400\n§Accumulated depreciation    120    80\n§Accounts payable    25    40\nDuring Year 2, net income was £860 million. There were no acquisitions or sales of property, plant, and equipment and no write-downs. Cash flow from operating activities (in £ millions) for Year 2 is:","o":{"A":"855.","B":"895.","C":"925."},"f":{"A":"Incorrect because the decrease in inventory is incorrectly subtracted rather than added: 860 + 40 – 10 – 20 – 15 = 855. This is also equal to the amount which ignores the depreciation expense: 860 –10 + 20 – 15 = 855.","B":"Correct because using the indirect method, operating cash flow is calculated as net income + depreciation expense – increase in current operating asset accounts (accounts receivable) + decrease in current operating asset account (inventory) – decrease in current operating liability accounts (accounts payable) = 860 + 40 – 10 + 20 – 15 = 895.","C":"Incorrect because the decrease in accounts payable is incorrectly added rather than subtracted: 860 + 40 – 10 + 20 + 15 = 925."},"a":"B"},{"n":73,"q":"Costs incurred during the development phase that are related to internally generated, identifiable intangible assets:","o":{"A":"must be expensed.","B":"must be capitalized.","C":"can be capitalized if certain criteria are met."},"f":{"A":"Incorrect because costs incurred in the development stage can be capitalized as intangible assets if certain criteria are met, including technological feasibility, the ability to use or sell the resulting asset, and the ability to complete the project.","B":"Incorrect because costs incurred in the development stage can be capitalized as intangible assets if certain criteria are met, including technological feasibility, the ability to use or sell the resulting asset, and the ability to complete the project.","C":"Correct because costs incurred in the development stage can be capitalized as intangible assets if certain criteria are met, including technological feasibility, the ability to use or sell the resulting asset, and the ability to complete the project."},"a":"C"},{"n":74,"q":"An analyst runs a simple linear regression using 35 months of data to assess a country's short-term interest rate as a function of its inflation rate, with the following results:\n§Source    Degrees of Freedom  Sums of Squares  Mean Square\n§Regression    1    17.3009    17.3009\n§Error    33    20.2299    0.6130\n§Total    34    37.5308\nThe value of the standard error of the estimate is closest to:","o":{"A":"0.68.","B":"0.78.","C":"1.05."},"f":{"A":"Incorrect because it incorrectly considers the standard error of the estimate as the square root of the coefficient of determination, which is calculated as the sum of square regression/sum of squares total: = 17.3009/37.5308 = 0.461. Then 0.4610.5 = 0.6789 ≈ 0.68.","B":"Correct because the standard error of the estimate in a linear regression is the square root of the mean square error, thus 0.61300.5 = 0.7829 ≈ 0.78.","C":"Incorrect because it is the sample standard deviation of the dependent variable, computed as the square root of the total variation of the dependent variable divided by the number of observations minus one: (37.5308/34)0.5 = 1.0506 ≈ 1.05."},"a":"B"},{"n":75,"q":"If the cost of capital exceeds the return on invested capital, shareholder value will:","o":{"A":"decrease.","B":"remain the same.","C":"increase."},"f":{"A":"Correct because if the ROIC measure is higher than the COC, the company is generating a higher return for investors compared with the required return, thereby increasing the firm’s value for shareholders. The inverse is true if the COC is higher than the ROIC.","B":"Incorrect because if the ROIC measure is higher than the COC, the company is generating a higher return for investors compared with the required return, thereby increasing the firm’s value for shareholders. The inverse is true if the COC is higher than the ROIC.","C":"Incorrect because if the ROIC measure is higher than the COC, the company is generating a higher return for investors compared with the required return, thereby increasing the firm’s value for shareholders. The inverse is true if the COC is higher than the ROIC."},"a":"A"},{"n":76,"q":"An analyst gathers the following information (in € thousands) about an electronics manufacturing company: Year 2  Year 1\n§Cost of sales    1000    800\n§Cost of ending inventory    150    120\n§Net realizable value of inventory    125    160\nChanges to the allowance for inventory obsolescence have already been reflected in cost of sales. The days of inventory on hand (based on average inventory and 365-day year) for Year 2 is closest to:","o":{"A":"45.","B":"49.","C":"52."},"f":{"A":"Correct because IFRS state that inventories shall be measured (and carried on the balance sheet) at the lower of cost and net realizable value; Inventory turnover ratio = Cost of sales ÷ Average inventory and Days of inventory on hand = Number of days in period / Inventory turnover ratio. Accordingly, Inventory turnover ratio = 1,000 / [(125 + 120) / 2] ≈ 8.163; and Days of inventory on hand = Number of days in period / Inventory turnover ratio = 365 / 8.163 = 44.7 ≈ 45.","B":"Incorrect because inventories in both years were measured at cost instead of the lower of cost and net realizable value. Hence, Inventory turnover ratio = 1,000 / [(150 + 120) / 2] = 1,000 / 135 ≈ 7.407; and Days of inventory on hand = 365 / 7.407 = 49.3 ≈ 49.","C":"Incorrect because inventories in both years were measured at net realizable value instead of the lower of cost and net realizable value. Hence, Inventory turnover ratio = 1,000 / [(125 + 160) / 2] = 1,000 / 142.5 ≈ 7.018; and Days of inventory on hand = 365 / 7.018 = 52.0 ≈ 52."},"a":"A"},{"n":77,"q":"The effectiveness of infrastructure spending as a near-term fiscal stimulant would be least constrained by the:","o":{"A":"action lag.","B":"impact lag.","C":"recognition lag."},"f":{"A":"Incorrect because the action lag refers to the length of time required to actually implement a policy action once it has been decided on. In the case of infrastructure spending, it may take several months of planning before the project is put into action, thereby constraining its near-term stimulative effect.","B":"Incorrect because the impact lag refers to the length of time required for a policy action to become evident in the economy. When spending on an infrastructure project begins, there will be a delay in judging its effects and making any related adjustments to more effectively stimulate the economy due to the impact lag.","C":"Correct because recognition lag refers to the time required before policymakers realize that a policy action is required because data appear with a considerable lag and are subject to substantial revision. A policy action to spend on infrastructure would occur at the conclusion of this lag and, as a result, the recognition lag is not a constraint on any specific type of policy action."},"a":"C"},{"n":78,"q":"An analyst gathers the following information (in € millions) about a company's land reported under the revaluation model:\n§Original cost    12\nFair market value at initial revaluation 17 on 31 December Year 1 Fair market value at second revaluation 12 on 31 December Year 2 As a result of the second revaluation, the company recognizes in Year 2:","o":{"A":"a €5 million loss on the income statement.","B":"a €5 million loss in other comprehensive income.","C":"neither a loss on the income statement nor a loss in other comprehensive income."},"f":{"A":"Incorrect because it assumes that the second revaluation impacts the income statement rather than the revaluation surplus account. If a revaluation initially increases the carrying amount of the asset class, the increase in the carrying amount of the asset class bypasses the income statement and goes directly to equity under the heading of revaluation surplus. Any subsequent decrease in the asset's value first decreases the revaluation surplus and then goes to income.","B":"Correct because if a revaluation initially increases the carrying amount of the asset class, the increase in the carrying amount of the asset class bypasses the income statement and goes directly to equity under the heading of revaluation surplus. Any subsequent decrease in the asset's value first decreases the revaluation surplus and then goes to income. Under IFRS, other comprehensive income includes certain changes in the value of long-lived assets that are measured using the revaluation model rather than the cost model. After initial revaluation, the revaluation surplus is thus 17 – 12 = 5. The second revaluation decreases the revaluation surplus by 5.","C":"Incorrect because it compares the result of the second revaluation to the initial cost, thus resulting in neither a loss on the income statements nor a decrease in the revaluation surplus account. If a revaluation initially increases the carrying amount of the asset class, the increase in the carrying amount of the asset class bypasses the income statement and goes directly to equity under the heading of revaluation surplus. Any subsequent decrease in the asset's value first decreases the revaluation surplus and then goes to income."},"a":"B"},{"n":79,"q":"The goal of ordinary least squares regression is to minimize the sum of the squared deviations between the observations of the dependent variable and the corresponding:","o":{"A":"estimated values of the dependent variable.","B":"observed values of the independent variable.","C":"values of the true underlying dependent variable."},"f":{"A":"Correct because the goal is to fit a line to the observations on Y and X to minimize the squared deviations from the line; this is the least squares criterion—hence, the name least squares regression. Because of its common use, linear regression is often referred to as ordinary least squares (OLS) regression. That is, we estimate the regression line as the line that best fits the observations. In simple linear regression, the estimated intercept, b0, and slope, b1, are such that the sum of the squared vertical distances from the observations to the fitted line is minimized. The focus is on the sum of the squared differences between the observations on Yi and the corresponding estimated value of the dependent variable.","B":"Incorrect because in simple linear regression, the estimated intercept, b0, and slope, b1, are such that the sum of the squared vertical distances from the observations to the fitted line is minimized. The focus is on the sum of the squared differences between the observations on Yi (dependent variable) and the corresponding estimated value of the dependent value.","C":"Incorrect because in simple linear regression, the estimated intercept, b0, and slope, b1, are such that the sum of the squared vertical distances from the observations to the fitted line is minimized. The focus is on the sum of the squared differences between the observations on Yi (dependent variable) and the corresponding estimated value of the dependent value. Further, the residual for the ith observation, ei, is how much the observed value of Yi differs from the Yi estimated value using the regression line. Note the subtle difference between the error term and the residual: The error term refers to the true underlying population relationship, whereas the residual refers to the fitted linear relation based on the sample. Fitting the line requires minimizing the sum of the squared residuals."},"a":"A"},{"n":80,"q":"Which of the following is most likely a motivation for leasing long term rather than purchasing a high-value asset?","o":{"A":"Reduced exposure to obsolescence risk","B":"Not having to recognize an asset on the balance sheet","C":"Not having to recognize a liability on the balance sheet"},"f":{"A":"Correct because there are several advantages to leasing an asset compared with purchasing it. Convenience and lower risks associated with asset ownership, such as obsolescence.","B":"Incorrect because under IFRS, there is a single accounting model for both finance and operating leases for lessees. At lease inception, the lessee records a lease payable liability and a “right-of-use” (ROU) asset on its balance sheet, both equal to the present value of future lease payments.","C":"Incorrect because under IFRS, there is a single accounting model for both finance and operating leases for lessees. At lease inception, the lessee records a lease payable liability and a “right-of-use” (ROU) asset on its balance sheet, both equal to the present value of future lease payments."},"a":"A"},{"n":81,"q":"The most appropriate statement about financial ratio analysis is that it has limited use as an analytical tool for:","o":{"A":"evaluating management.","B":"comparing companies that use different accounting methods.","C":"providing insights into microeconomic relationships within a company that help analysts project earnings."},"f":{"A":"Incorrect. Financial ratios are useful for evaluating management.","B":"Correct. Financial ratio analysis is limited by the use of alternative accounting methods. Accounting methods play an important role in the interpretation of financial ratios. The lack of consistency across companies makes comparability difficult to analyze and limits the usefulness of ratio analysis.","C":"Incorrect. Financial ratios provide insights into microeconomic relationships within a company that help analysts project earnings and free cash flow."},"a":"B"},{"n":82,"q":"Which of the following could result in a permanent difference between accounting profit and taxable income?","o":{"A":"Used tax credits","B":"A tax loss carryforward","C":"Difference between carrying amount and tax base of assets because of different depreciation methods"},"f":{"A":"Correct because permanent differences are differences between tax and financial reporting of revenue (expenses) that will not be reversed at some future date. Because they will not be reversed at a future date, these differences do not give rise to deferred tax. These items typically include: (1) income or expense items not allowed by tax legislation, and (2) tax credits for some expenditures that directly reduce taxes. Because no deferred tax item is created for permanent differences, all permanent differences result in a difference between the company’s effective tax rate and statutory tax rate.","B":"Incorrect because a tax loss carryforward may be used to reduce future taxable income. It is the result of temporary differences. Differences between the tax base and the carrying amount also result in differences between accounting profit and taxable income. These differences can carry through to future periods. For example, a tax loss carry forward occurs when a company experiences a loss in the current period that may be used to reduce future taxable income. The company’s tax expense on its income statement must not only reflect the taxes payable based on taxable income, but also the effect of these differences.","C":"Incorrect because this difference results in a temporary difference. Temporary differences arise from a difference between the tax base and the carrying amount of assets and liabilities."},"a":"A"},{"n":83,"q":"An analyst gathers the following financial market information: EUR/USD spot exchange rate  0.9876\n§180-day USD risk-free rate    1.00%\n§180-day EUR risk-free rate    1.20%\nEUR/USD is the amount of EUR per 1 USD.\nThe 180-day EUR/USD forward exchange rate is closest to:","o":{"A":"0.98662.","B":"0.98858.","C":"0.98956."},"f":{"A":"Incorrect because forward rate is calculated as: F EUR/USD = S EUR/USD × (1+ i USD) / (1+i EUR) = 0.9876 (1 + 0.01 × 180/360) / (1 + 0.012 × 180/360) = 0.9876 × (1 + 0.005) / (1 + 0.006) = 0.98662.","B":"Correct because another way of looking at this is, given the spot exchange rate and the domestic and foreign risk- free interest rates, the forward rate is whatever value completes this equation and eliminates any arbitrage opportunity. Thus F EUR/USD = S EUR/USD × (1+i EUR) / (1+ i USD) = 0.9876 × (1 + 0.012 × 180/360) / (1 + 0.01 × 180/360) = 0.9876 × (1 + 0.006) / (1 + 0.005) = 0.99352 / 1.005 = 0.98858.","C":"Incorrect because 180-day time frame was not taken into account. FEUR/USD = SEUR/USD × (1+i EUR) / (1+ i USD) = 0.9876 × (1 + 0.012) / (1 + 0.01) = 0.99352 / 1.01 =0.98956."},"a":"B"},{"n":84,"q":"The static trade-off theory of capital structure most likely considers:","o":{"A":"agency costs of equity.","B":"information asymmetry.","C":"the tax shield provided by debt."},"f":{"A":"Incorrect because agency costs of equity are not considered by the static trade-off theory of capital structure, but are considered in the agency theory, which predicts that a reduction in net agency costs of equity results from an increase in the use of debt versus equity.","B":"Incorrect because information asymmetry is not considered by the static trade-off theory of capital structure, but is considered by the pecking order theory. The pecking order theory, developed by Myers and Majluf (1984), suggests that managers choose methods of financing according to a hierarchy that gives first preference to methods with the least potential information content (internally generated funds) and lowest preference to the form with the greatest potential information content (public equity offerings).","C":"Correct because the static trade-off theory of capital structure considers only the tax shield provided by debt and the costs of financial distress. The static trade-off theory of capital structure results in an optimal capital structure that is somewhere less than 100% debt."},"a":"C"},{"n":85,"q":"Which of the following can be calculated based on information from the balance sheet only?","o":{"A":"Quick ratio","B":"Debt coverage","C":"Receivables turnover ratio"},"f":{"A":"Correct because quick ratio = (cash + short-term marketable investments + receivables) / current liabilities. All of this information is available from the balance sheet.","B":"Incorrect because the debt coverage ratio is CFO / total debt. CFO is not available from just the balance sheet as it is derived from both the income statement and the balance sheet. The preparation of the cash flow statement uses data from both the income statement and the comparative balance sheets.","C":"Incorrect because receivables turnover = revenue / average receivables. Accounts receivable is available from the balance sheet, but revenue is only available from the income statement."},"a":"A"},{"n":86,"q":"An investor is considering three investments: • Investment 1 makes 20 annual payments of $50,000, starting one year from today. • Investment 2 makes 25 annual payments of $45,000, starting today. • Investment 3 makes annual payments of $40,000 indefinitely, starting one year from today. If the investor's discount rate is 10% per year, which investment has the highest present value?","o":{"A":"Investment 1","B":"Investment 2","C":"Investment 3"},"f":{"A":"Incorrect because Investment 2 has the highest present value. Investment 1 is an ordinary annuity with a present value calculated as PV = A[(1 – 1/(1 + r)N)/r], where A is the annual payment, N is the number of payments, and r is the discount rate. Therefore, PV = $50,000 × [(1 – 1/(1.1)20)/0.1] = $425,678. Calculator solution (END mode): I/Y = 10%; PMT = 50,000; N = 20; solve for PV = 425,678. A candidate could choose this if Investment 2 is mistaken for an ordinary annuity such that PV of Investment 2 = 408,467. Calculator solution (END mode): I/Y = 10%; PMT = 45,000; N = 25; solve for PV = 408,467.","B":"Correct because Investment 2 has the highest present value. Investment 2 is an annuity due with a present value calculated as PV = A[(1 – 1/(1 + r)N)/r] × (1 + r), where A is the annual payment, N is the number of payments, and r is the discount rate. Therefore, PV = $45,000 × [(1 – 1/(1.1)25)/0.1] × (1.1) = $449,313. Calculator solution (BGN mode): I/Y = 10%; PMT = 45,000; N = 25; solve for PV = 449,313.","C":"Incorrect because Investment 2 has the highest present value. Investment 3 is a perpetuity with a present value calculated as PV = A/r, where A is the annual payment and r is the discount rate. Therefore, PV = $40,000/0.1 = $400,000."},"a":"B"},{"n":87,"q":"Which of the following most likely has the greatest access to capital?","o":{"A":"Corporation","B":"Limited partnership","C":"General partnership"},"f":{"A":"Correct because corporations have unbounded access to capital.","B":"Incorrect because limited partnerships have limited access to capital due to the limited number of partners allowed in the organization. Capital and expertise are typically limited to what the partners can contribute, and limited partners usually grant managerial responsibilities to the GP, which entails risk. Partnership agreements are customized and often limit the transferability of ownership interest or expansion beyond a small group of partners.","C":"Incorrect because general partnerships have limited access to capital due to the limited number of partners allowed in the organization. As with a sole proprietorship, potential for growth is limited by the partners’ ability to source financing and expertise and their collective risk tolerance because the partners are still personally liable for business losses and debt."},"a":"A"},{"n":88,"q":"An analyst gathers the following information about a company's capital sources:\n§Target weight of debt    25%\n§Target weight of equity    75%\n§Before-tax marginal cost of debt    4%\n§Marginal cost of equity    12%\nIf the marginal tax rate is 20% and interest expense is tax deductible, the company's WACC is:","o":{"A":"9.80%.","B":"10.00%.","C":"10.25%."},"f":{"A":"Correct because taking the sources of capital to be common stock, preferred stock, and debt and allowing for the fact that in some jurisdictions, interest expense may be tax deductible, the expression for WACC is:WACC = wdrd(1 – t) + wprp + were,where wd = the target proportion of debt in the capital structure when the company raises new funds; rd = the before-tax marginal cost of debt; t = the company’s marginal tax rate; wp = the target proportion of preferred stock in the capital structure when the company raises new funds [which is equal to 0 in our case]; rp = the marginal cost of preferred stock; we = the target proportion of common stock in the capital structure when the company raises new funds; re = the marginal cost of common stock.Thus, WACC = 0.25 × 4% × (1 – 20%) + 0.75 × 12% = 9.80%.","B":"Incorrect because it ignores that interest expense is tax deductible and calculates the WACC as wdrd + were = 0.25 × 4% + 0.75 × 12% = 10.00%.","C":"Incorrect because, instead of multiplying, it divides the cost of debt by (1 – t), thus calculating the WACC as wdrd/(1 – t) + were = 0.25 × 4%/(1 – 20%) + 0.75 × 12% = 10.25%."},"a":"A"},{"n":89,"q":"An analyst gathers the following probability distribution of a company's earnings:\n§Probability    Earnings ($ millions)\n§0.25    100\n§0.70    300\n§0.05    600\nThe standard deviation of the company's earnings is closest to:","o":{"A":"$115 million.","B":"$134 million.","C":"$375 million."},"f":{"A":"Correct because the expected value is calculated as E(X) = P(X1)X1 + P(X2)X2 + … + P(Xn)Xn = 0.25×100 + 0.70×300 + 0.05×600 = 25 + 210 + 30 = 265 and the variance is calculated as σ2(X) = E{[X − E(X)]2 } = 0.25×(100 – 265)2 + 0.70×(300 – 265)2 + 0.05×(600 – 265)2 = 6,806.25 + 857.50 + 5,611.25 = 13,275 and the standard deviation is the positive square root of variance, i.e. 13,2751/2 ≈ $115.22 ≈ $115 million.","B":"Incorrect because the candidate incorrectly calculates the expected value as the unweighted mean, i.e. E(X) ≠ (100 + 300 + 600)/3 ≈ 333.33. Then the variance is calculated as σ2(X) = E{[X − E(X)]2 } = 0.25×(100 – 333.33)2 + 0.70×(300 – 333.33)2 + 0.05×(600 – 333.33)2 ≈ 13,610.72 + 777.62 + 3,555.64 = 17,943.98 and the standard deviation is the positive square root of variance, i.e. 17,943.981/2 ≈ $133.96 ≈ $134 million.","C":"Incorrect because the candidate omits the probabilities in the calculation of variance. The candidate calculates the expected value correctly as E(X) = P(X1)X1 + P(X2)X2 + … + P(Xn)Xn = 0.25×100 + 0.70×300 + 0.05×600 = 25 + 210 + 30 = 265. The candidate then incorrectly calculates the variance as σ2(X) = E{[X − E(X)]2 } ≠ (100 – 265)2 + (300 – 265)2 + (600 – 265)2 = 27,225 + 1,225 + 112,225 = 140,675 and the standard deviation is the positive square root of variance, i.e. 140,6751/2 ≈ $375.07 ≈ $375 million."},"a":"A"},{"n":90,"q":"An investor purchases a security for ¥500,000. If the value of the security declines by 10% over the first 3-month period and then increases by 9% over the next 3-month period, the holding period return over the 6-month period is closest to:","o":{"A":"−1.9%.","B":"−1.0%.","C":"−0.5%."},"f":{"A":"Correct because, first, calculate the future value at the end of six months; FV3 = PV(1 + g) = ¥500,000(1 - 0.10) = ¥450,000. FV6 = FV3(1 + g) = ¥450,000(1 + 0.09) = ¥490,500. Second, calculate the holding period return over the six-month period as HPR = , (P1 - P0)/P0 where P0 is the initial investment and P1 is the price at the end of the holding period; (¥490,500 - ¥500,000)/¥500,000 = -0.019, or −1.9%. Alternatively, the first three-month HPR is −0.10 and the second three-month HPR = .09. The six-month HPR can then be calculated by geometrically linking the two three-month HPRs; (1 − 0.10)(1 + 0.09) − 1 = −0.019, or −1.9%.","B":"Incorrect because it is the sum of the two three-month HPRs; −10% + 9% = −1%.","C":"Incorrect because it is the arithmetic (or simple) mean of the two three-month HPRs: (-10% + 9%)/2 = -0.5%\nRetake Review\n§72%    65    1:29    2:14:20\n§Out of 90 points    Avg Time Per Question    Time for this Attempt\nYour Answers:"},"a":"A"}],"ME4-2":[{"n":1,"q":"The price of a European call option is:","o":{"A":"directly related to the price of the underlying and inversely related to volatility of the underlying.","B":"directly related to volatility of the underlying and inversely related to the dividend yield of the underlying.","C":"directly related to the dividend yield of the underlying and inversely related to the price of the underlying."},"f":{"A":"Incorrect because the value of a European call option is directly related to the value of the underlying, but a European call is directly related to the volatility of the underlying. The first relation is correct but the second relation is incorrect.","B":"Correct because the value of a European call is directly related to the volatility of the underlying, and a European call option is worth less the more benefits that are paid by the underlying and worth more the more costs that are incurred in holding the underlying. Both relations are correct.","C":"Incorrect because the value of a European call option is directly related to the value of the underlying, and a European call option is worth less the more benefits that are paid by the underlying and worth more the more costs that are incurred in holding the underlying. Therefore, both relations are incorrect."},"a":"B"},{"n":2,"q":"An analyst observes the following annual spot rates: 1 year  1.0% 2 years  1.1% 3 years  1.3%\nBased only on this information, the arbitrage-free price of a 3% annual-pay bond with a three-year maturity is closest to:","o":{"A":"104.99.","B":"105.48.","C":"107.62."},"f":{"A":"Correct because the general formula for calculating a bond price given the sequence of spot rates is: PV = PMT / (1 + Z1)1 + PMT / (1 + Z2)2 + … + (PMT + FV) / (1 + ZN)N. wherePV = present value, or price of the bond;PMT = coupon payment per period; Zt = Spot rate, or zero coupon yield, or zero rate at time t;FV = future value paid at maturity, or the par value of the bond;N = number of evenly spaced periods to maturityUsing this formula the bond price is calculated as 3 / (1.01) + 3 / (1.011)2 + 103 / (1.013)3 = 104.99059, rounded to 104.99.","B":"Incorrect because the bond price is calculated as one would if given forward rates, not spot rates: Bond price ≠ 3 / (1.01) + 3 / (1.01 × 1.011) + 103 / (1.01 × 1.011 × 1.013) = 105.48441, rounded to 105.48.","C":"Incorrect because the exponents are omitted when calculating the price of the bond: Bond price ≠ 3 / (1.01) + 3 / (1.011) + 103 / (1.013) = 107.61584, rounded to 107.62."},"a":"A"},{"n":3,"q":"With respect to an IPS, which of the following best describes an absolute risk objective for a client's portfolio?","o":{"A":"An annual tracking risk of less than 2 percent","B":"A twelve-month 95% value at risk of less than €1,000,000","C":"Maintaining at least €10,000 in cash for planned monthly withdrawals"},"f":{"A":"Incorrect because for risk relative to a benchmark, the measure could be tracking risk, or tracking error. Further, an expected tracking risk of 2% would imply a return within 4% of the index return approximately 95% of the time. Remember that tracking risk is stated as a one standard deviation measure.","B":"Correct because measures of absolute risk include the variance or standard deviation of returns and value at risk. For example, the 12-month 95% value at risk of the portfolio must be no more than ¥1 billion.","C":"Incorrect because maintaining cash is an IPS constraint, not a risk objective. Liquidity Requirements The IPS should state what the likely requirements are to withdraw funds from the portfolio. Examples for an individual investor would be outlays for covering healthcare payments or tuition fees. When the client does have such a requirement, the manager should allocate part of the portfolio to cover the liability. This part of the portfolio will be invested in assets that are liquid—that is, easily converted to cash—and have low risk when the liquidity need is actually present."},"a":"B"},{"n":4,"q":"The average life of a mortgage pass-through security is two years. Six months ago, its average life was five years. Over the last six months, investors in the security have most likely experienced:","o":{"A":"balloon risk.","B":"extension risk.","C":"contraction risk."},"f":{"A":"Incorrect because many commercial loans backing CMBS are balloon loans that require a substantial principal repayment at maturity of the loan. The risk that a borrower will not be able to make the balloon payment is called balloon risk. Balloon risk is not relevant to mortgage pass-through securities and in any case, balloon risk is a type of extension risk not contraction risk.","B":"Incorrect because the average life extends when the prepayment rate goes down. In this case six months have passed but rather than increasing or staying the same, the average life of the security has decreased and decreased by more than the six month passage of time. Extension risk is the risk that when interest rates rise, prepayments will be lower than forecasted. As a result, a security backed by mortgages will typically have a longer maturity than was anticipated at the time of purchase not shorter.","C":"Correct because the average life indicates to investors how long they can expect to hold the MBS before it is paid off assuming interest rates stay at current levels and, thus, expected prepayments are realized. The average life contracts rapidly as the prepayment rate goes up. While six months have passed, the average life of the security has decreased by three years. The relevant risk here is therefore contractions risk which is the risk that when interest rates decline, actual prepayments will be higher than forecasted. Thus, a security backed by mortgages will have a shorter maturity than was anticipated at the time of purchase."},"a":"C"},{"n":5,"q":"All else being equal, which of the following would lower a company's sustainable growth rate? A(n):","o":{"A":"increased retention rate","B":"decreased return on total assets","C":"increased financial leverage ratio"},"f":{"A":"Incorrect because the sustainable growth rate is the product of ROE times the retention rate, therefore an increase in the retention rate would increase the sustainable growth rate.","B":"Correct because the sustainable growth rate is the product of ROE times the retention rate, where ROE = ROA × financial leverage. A decreased ROA would lower ROE and therefore lower the sustainable growth rate.","C":"Incorrect because the sustainable growth rate is the product of ROE times the retention rate, where ROE = ROA × financial leverage. An increased financial leverage ratio would increase ROE and therefore increase the sustainable growth rate."},"a":"B"},{"n":6,"q":"Which of the following statements about real estate investments is most accurate?","o":{"A":"Investors in real estate limited partnerships are exposed to unlimited liability","B":"Free and clear ownership means that the property is unencumbered by a mortgage","C":"REITs are required to retain most of their taxable income for future capital expenditures"},"f":{"A":"Incorrect because alternative investment vehicles often take the form of partnerships in order to maximize flexibility in the investment structure to allocate business risk and return and to distribute special responsibilities between investors and managers as required. Limited partnerships involve at least one general partner (GP) with theoretically unlimited liability who is responsible for managing the fund. Limited partners (LPs) are outside investors who own a fractional interest in the partnership based on the amount of their initial investment and the terms set out in the partnership documentation.","B":"Correct because direct private investing involves purchasing a property and originating debt for one’s own account. Ownership can be free and clear, whereby the property title is transferred to the owner(s) unencumbered by any financing liens, such as from outstanding mortgages.","C":"Incorrect because the main appeal of the REIT structure is the elimination of double corporate taxation. Corporations pay taxes on their income, from which they make dividend distribution to their owners from after-tax earnings. The shareholders, in turn, are taxed at their personal tax rate. REITs can avoid corporate income taxation by distributing dividends equal to 90%–100% of taxable net rental income."},"a":"B"},{"n":7,"q":"In the binomial model, if the probability of a downward movement in an underlying increases, the value of a call option:","o":{"A":"decreases.","B":"remains unchanged.","C":"increases."},"f":{"A":"Incorrect because, according to the binomial model, the value of call option is c0 = (πc1 u + (1 – π)c1 d)/(1 + r), where π = (1 + r – d)/(u – d). Notably, the probabilities of the up and down moves, q and 1 – q, do not appear in the formula. Therefore, the value of a call option is independent of the probability of a downward movement in an underlying.","B":"Correct because, according to the binomial model, the value of call option, c0, is computed as the expected value of the option at expiration, c1 u and c1 d, discounted at the risk free rate. This can be expressed as, c0 = (πc1 u + (1 – π)c1 d)/(1 + r), where π = (1 + r – d)/(u – d). Notably, the probabilities of the up and down moves, q and 1 – q, do not appear in the formula. Therefore, the value of a call option is independent of the probability of a downward movement in an underlying.","C":"Incorrect because, according to the binomial model, the value of call option is c0 = (πc1 u + (1 – π)c1 d)/(1 + r), where π = (1 + r – d)/(u – d). Notably, the probabilities of the up and down moves, q and 1 – q, do not appear in the formula. Therefore, the value of a call option is independent of the probability of a downward movement in an underlying."},"a":"B"},{"n":8,"q":"Which of the following is best classified as financial risk?","o":{"A":"Market risk","B":"Longevity risk","C":"Accounting risk"},"f":{"A":"Correct because the three primary types of financial risks are market risk, credit risk, and liquidity risk. Market risk is the risk that arises from movements in interest rates, stock prices, exchange rates, and commodity prices.","B":"Incorrect because closely related to health risk, and thus non-financial risk is mortality risk—the risk of dying relatively young—and longevity risk—the risk of outliving one’s financial resources.","C":"Incorrect because accounting risk is classified as non-financial risk. The following three non-financial risks are related: regulatory risk, accounting risk, and tax risk. They could even be collectively referred to as compliance risk because they all deal with the matter of conforming to policies, laws, rules, and regulations as set forth by governments and authoritative bodies, such as accounting governing boards."},"a":"A"},{"n":9,"q":"For portfolio managers of active funds, market indexes are least useful as:","o":{"A":"benchmarks.","B":"model portfolios.","C":"proxies to measure risk-adjusted performance."},"f":{"A":"Incorrect because market indexes are used as benchmarks to evaluate the relative performance of active funds.","B":"Correct because market indexes are used as model portfolios for index funds and exchange-traded funds, but they are not useful as model portfolios for active funds.","C":"Incorrect because market indexes are used as proxies to measure risk-adjusted performance of active funds."},"a":"B"},{"n":10,"q":"Which of the following is most likely an element of industry and competitive analysis?","o":{"A":"Analyzing market share trends","B":"Determining forecast objects and approaches","C":"Analyzing uses of capital and sources of financing"},"f":{"A":"Correct because industry and competitive analysis includes analyzing size, growth and character, profitability, and market share trends. It also includes analysis of industry structure and external influences, as well as evaluation of a company's competitive strategy and positioning.","B":"Incorrect because determining forecast objects and approaches is an element of forecasting in company analysis. The components of forecasting in company analysis include determining forecast objects and approaches.","C":"Incorrect because analyzing uses of capital and sources of financing is company specific. Past and present company analysis includes analyzing capital investments and capital structure (uses of capital and sources of financing)."},"a":"A"},{"n":11,"q":"Duration is most accurate as a measure of interest rate risk for a bond portfolio when the slope of the yield curve:","o":{"A":"decreases.","B":"stays the same.","C":"increases."},"f":{"A":"Incorrect because portfolio duration assumes the slope stays the same.","B":"Correct because duration and convexity for a portfolio are calculated as the weighted average of the statistics for the individual bonds. These measures of portfolio duration and convexity implicitly assume that yields of all maturities change by the same amount in the same direction, a parallel shift in the yield curve (i.e. the slope of the yield curve stays the same).","C":"Incorrect because portfolio duration assumes the slope stays the same."},"a":"B"},{"n":12,"q":"Which of the following most likely exhibits negative convexity?","o":{"A":"A callable bond","B":"A putable bond","C":"An option-free bond"},"f":{"A":"Correct because a callable bond exhibits negative convexity at low yield levels and positive convexity at high yield levels.","B":"Incorrect because a putable bond always exhibits positive convexity, higher than an option-free bond.","C":"Incorrect because an option-free bond always exhibits positive convexity."},"a":"A"},{"n":13,"q":"If a security’s return is plotted to the right of the market portfolio on the security market line, the security has a:","o":{"A":"lower expected return and lower systematic risk than the market portfolio.","B":"higher expected return and higher systematic risk than the market portfolio.","C":"higher expected return and higher unsystematic risk than the market portfolio."},"f":{"A":"Incorrect because a security with a lower expected return and lower systematic risk would be plotted below and to the left of the market portfolio.","B":"Correct because the security market line (SML) is a graphical representation of the capital asset pricing model with beta, reflecting systematic risk, on the x-axis and expected return on the y-axis. The linear relationship between expected return and beta (systematic risk) is upward sloping. Therefore, a security that is plotted higher and to the right of the market portfolio exhibits higher expected return due to its exposure to higher systematic risk.","C":"Incorrect because the SML demonstrates the relationship between a security’s return and systematic risk, not unsystematic risk."},"a":"B"},{"n":14,"q":"Emotional biases:","o":{"A":"stem from impulses and intuition.","B":"result in the same decision as assumed by traditional finance theory.","C":"are more easily corrected through better information than cognitive biases."},"f":{"A":"Correct because emotional biases stem from impulses and intuitions.","B":"Incorrect because both forms of bias (cognitive and emotional) regardless of their source, may cause decisions to deviate from what is assumed by traditional finance theory.","C":"Incorrect because cognitive errors (not emotional biases) can often be corrected or eliminated through better information, education, and advice. Emotional biases, on the other hand, are harder to correct because they stem from impulses and intuitions."},"a":"A"},{"n":15,"q":"Which of the following is most advantageous to the general partner of a private equity fund assuming no clawback provision?","o":{"A":"American waterfall","B":"European waterfall","C":"Whole-of-fund waterfall"},"f":{"A":"Correct because there are two types of waterfalls: deal-by-deal (or American) waterfalls and whole-of-fund (or European) waterfalls. Deal-by-deal waterfalls are more advantageous to the GP because performance fees are collected on a per-deal basis, allowing the GP to get paid before LPs receive both their initial investment and their preferred rate of return (i.e., the hurdle rate) on the entire fund.","B":"Incorrect because there are two types of waterfalls: deal-by-deal (or American) waterfalls and whole-of-fund (or European) waterfalls. In contrast to deal-by-deal waterfalls, whole-of-fund waterfalls occur at the aggregate fund level (i.e., after all investments have been exited) and are more advantageous to the LPs.","C":"Incorrect because whole-of-fund waterfalls -- which are another name for European waterfalls -- occur at the aggregate fund level and are more advantageous to the LPs."},"a":"A"},{"n":16,"q":"An investor buys a stock for $108 on margin by posting 40% of the initial stock price as equity. If the maintenance margin requirement for the position is 20%, a margin call first occurs when the price falls below:","o":{"A":"$64.80.","B":"$81.00.","C":"$86.40."},"f":{"A":"Incorrect because this is the stock price minus the initial margin requirement; $108 – ($108 × 40%) = $64.80.","B":"Correct because the price below which a margin call will take place is calculated with the following equation: (Equity/share) / (Price/share) = ($43.20 + P – $108)/P = 20%, which can be solved for P = $81.00.","C":"Incorrect because this is the price 20% below the initial stock price ($108 × (1 – 20%) = $86.40) and not the level that triggers the margin call."},"a":"B"},{"n":17,"q":"Which of the following derivative contracts most likely requires an upfront payment by the buyer at contract initiation?","o":{"A":"Options only","B":"Forwards only","C":"Both options and forwards"},"f":{"A":"Correct because this right to exercise in the future has a value that is paid upfront to the option seller in the form of an option premium.","B":"Incorrect because for forwards, at time t = 0, the counterparties do not exchange a payment upfront but, rather, agree on delivery of the underlying at time T for a forward price of F0(T).","C":"Incorrect because for a forward contract, at time t = 0, the counterparties do not exchange a payment upfront but, rather, agree on delivery of the underlying at time T for a forward price of F0(T)."},"a":"A"},{"n":18,"q":"Making a minority equity investment in a mature company that plans to expand operations best describes:","o":{"A":"growth capital investing.","B":"leveraged buyout investing.","C":"development capital investing."},"f":{"A":"Correct because growth capital generally refers to minority equity investments, whereby the firm takes a less-than-controlling interest in more mature companies looking for capital to expand or restructure operations, enter new markets, or finance major acquisitions.","B":"Incorrect because venture capital (VC) entails investing in or providing financing to private companies with high growth potential. Typically these are start-ups or young companies, but venture capital can be injected at various stages, ranging from concept creation for a company to the point of a company’s IPO (initial public offering) launch or its acquisition by another company. Venture capital generally targets start-up or young private companies with high growth potential, not more mature companies.","C":"Incorrect because leveraged buyouts (LBOs), or highly leveraged transactions, arise when private equity firms establish buyout funds (or LBO funds) to acquire public companies or established private companies, with a significant percentage of the purchase price financed through debt. In an LBO, the entire company is acquired, not a minority interest."},"a":"A"},{"n":19,"q":"Arbitrage is best described as an opportunity to earn:","o":{"A":"risk-free returns with no investment capital.","B":"risk-free returns with large amounts of investment capital.","C":"abnormal returns applying an absolute valuation methodology."},"f":{"A":"Correct because arbitrage is risk free and requires no capital because selling the overpriced asset produces the funds to buy the underpriced asset.","B":"Incorrect because an opportunity to profit at no risk could merely describe the purchase of a risk-free asset. Arbitrage is risk free and requires no capital because selling the overpriced asset produces the funds to buy the underpriced asset. Therefore, it is incorrect to state that arbitrage describes an opportunity to earn risk-free returns with large amounts of investment capital.","C":"Incorrect because an opportunity to earn a return in excess of the return appropriate for the risk assumed is a concept studied in portfolio management and is often referred to as an abnormal return. It is certainly desirable but is hardly an arbitrage because it requires the assumption of risk and the investment of capital. Also, arbitrage does not tell us the true fundamental value. It is not an absolute valuation methodology, such as the discounted cash flow equity valuation model. It is a relative valuation methodology. Therefore, it is incorrect to state that arbitrage describes an opportunity to earn abnormal returns applying absolute valuation methodology."},"a":"A"},{"n":20,"q":"Which of the following transactions is most likely to affect a company’s financial leverage ratio?","o":{"A":"Payment of a 9% stock dividend","B":"An increase in cash dividends paid","C":"Completion of a previously announced 1-for-20 reverse stock split"},"f":{"A":"Incorrect because neither stock splits nor stock dividends affect a firm’s financial leverage ratio.","B":"Correct because cash dividends affect a company’s capital structure and financial leverage ratios by reducing assets and shareholders’ equity.","C":"Incorrect because neither stock splits nor stock dividends affect a firm’s financial leverage ratio."},"a":"B"},{"n":21,"q":"All else being equal, non-cumulative preference shares most likely:","o":{"A":"offer dividends that are less than common shares.","B":"have a claim on net assets upon liquidation of the company.","C":"receive any past unpaid dividends prior to dividends being paid to common shareholders."},"f":{"A":"Incorrect because the dividends on preference shares are generally higher than the dividends on common shares.","B":"Correct because preference shares rank above common shares with respect to the distribution of the company's net assets upon liquidation.","C":"Incorrect because the requirement to pay past unpaid dividends applies specifically to cumulative preference shares, not preference shares in general."},"a":"B"},{"n":22,"q":"As one moves to the right along an investor’s efficient frontier, a set increase in risk is most likely to lead to:","o":{"A":"sequentially smaller increases in expected return.","B":"consistent increases in expected return.","C":"sequentially larger increases in expected return."},"f":{"A":"Correct because the increase in return with every unit increase in risk keeps decreasing as one moves from left to right because the slope of the efficient frontier continues to decrease. Thus, investors obtain decreasing increases in returns as they assume more risk.","B":"Incorrect because the slope of the efficient frontier continues to decrease, leading to smaller incremental returns, not consistent.","C":"Incorrect because the slope of the efficient frontier continues to decrease, leading to smaller incremental returns, not larger."},"a":"A"},{"n":23,"q":"Risk-averse investors make investment decisions that maximize:","o":{"A":"both return and risk.","B":"return irrespective of risk.","C":"return for the same amount of risk."},"f":{"A":"Incorrect because a risk-seeking investor would maximize both risk and return.","B":"Incorrect because a risk-neutral investor would maximize return irrespective of risk.","C":"Correct because risk-averse investors make investment decisions based on the risk–return trade-off, maximizing return for the same risk, and minimizing risk for the same return."},"a":"C"},{"n":24,"q":"Which of the following is most likely a factor that results in different credit ratings for debt issued by a subsidiary and debt issued by its parent company?","o":{"A":"Differences in duration","B":"Structural subordination","C":"Cross-default provisions"},"f":{"A":"Incorrect because for the rating agencies, likelihood of default— default risk—is the primary factor in assigning their ratings. However, there are secondary factors as well. These factors include the priority of payment in the event of a default (e.g., secured versus senior unsecured versus subordinated) as well as potential loss severity in the event of default. Another factor considered by rating agencies is structural subordination. Recognizing these different payment priorities, and thus the potential for higher (or lower) loss severity in the event of default, the rating agencies have adopted a notching process whereby their credit ratings on issues can be moved up or down from the issuer rating, which is usually the rating applied to its senior unsecured debt. Therefore, differences between the issues' durations are most likely not a determining factor in the notching process followed by rating agencies.","B":"Correct because structural subordination can arise when a corporation with a holding company structure has debt at both its parent holding company and operating subsidiaries. Debt at the operating subsidiaries will get serviced by the cash flow and assets of the subsidiaries before funds can be passed ('upstreamed') to the holding company to service debt at that level. Recognizing these different payment priorities, and thus the potential for higher (or lower) loss severity in the event of default, the rating agencies have adopted a notching process whereby their credit ratings on issues can be moved up or down from the issuer rating, which is usually the rating applied to its senior unsecured debt. Therefore, if the company's subsidiary is the operational entity that produces the cash flow and holds the assets within the holding company structure, the parent (holding) company itself will be structurally subordinated and will most likely have a lower credit rating than the subsidiary.","C":"Incorrect because cross-default provisions establish that events of default (such as non-payment of interest) on one bond trigger default on all outstanding debt, and imply the same default probability for all issues. For the rating agencies, likelihood of default—default risk—is the primary factor in assigning their ratings. However, there are secondary factors as well. These factors include the priority of payment in the event of a default (e.g., secured versus senior unsecured versus subordinated) as well as potential loss severity in the event of default."},"a":"B"},{"n":25,"q":"An analyst gathers the following information about an index with a starting value of 1,000:\n§Year    Price Return    Dividend Return\n§1    4%    2%\n§2    6%    3%\nOn a total return basis, the value of the index at the end of Year 2 is closest to:","o":{"A":"1,102.","B":"1,150.","C":"1,155."},"f":{"A":"Incorrect because the calculation of the total return omits the dividend returns over the two years. VTRIT = VTRI0 × (1 + PRI 1) × (1 + PRI 2) = 1,000 × (1 + 4%) × (1 + 6%) ≈ 1,102.","B":"Incorrect because the calculation adds all non\n§compounded returns.    VTRIT = 1,000 × (1 + 4% + 2% + 6% + 3%) = 1,150.","C":"Correct because the value of the total return index at the end of Year 2 is calculated using the following formula: VTRIT = VTRI0 × (1 + TRI 1) × (1 + TRI 2) = 1,000 × (1 + 4% + 2%) × (1 + 6% + 3%) ≈ 1,155."},"a":"C"},{"n":26,"q":"An analyst gathers the following information about three bonds: Bond Payment Frequency  Principal Amortization\n§1    Monthly    Yes\n§2    Quarterly    Yes\n§3    Monthly    No\nAll else being equal, the bond with the greatest reinvestment risk is most likely:","o":{"A":"Bond 1.","B":"Bond 2.","C":"Bond 3."},"f":{"A":"Correct because the most common bond cash flow structure is that of a standard fixed-coupon bond, often referred to as a bullet bond. The bond issuer receives the principal at settlement, makes periodic, fixed coupon payments, and repays the principal at maturity. Reinvestment risk and price risk are types of interest rate risk and have an inverse relationship. Reinvestment risk is the risk of decreasing reinvestment returns on cash flows, which occurs when interest rates fall. Bond 1 amortizes principal on a monthly basis, which increases the reinvestment risk relative to Bond 2 (which pays less frequently) or Bond 3 (which does not amortize at all).","B":"Incorrect because Bond 2 has less reinvestment risk than Bond 1 because Bond 2 pays principal quarterly, rather than monthly.","C":"Incorrect because Bond 3 has less reinvestment risk than Bond 1 or Bond 2 since Bond 3 does not amortize principal."},"a":"A"},{"n":27,"q":"In an equally weighted portfolio of many assets, an increase in the correlation between the assets' returns most likely decreases the portfolio's:","o":{"A":"overall risk.","B":"expected return.","C":"diversification benefit."},"f":{"A":"Incorrect because a portfolio offers a lower standard deviation of return than the average of its individual components due to the correlations or interactions between the individual securities. As correlation (covariance) increases, the variance of the portfolio (total risk) increases.","B":"Incorrect because the correlation between the returns of the assets in the portfolio does not affect the portfolio's expected return. Portfolio return = ∑wi × Ri, where wi are the weights of the assets in the portfolio and Ri are the returns of the assets in the portfolio. A change in the correlation of the assets' returns does not affect the portfolio return.","C":"Correct because sometimes a subset of assets will go up in value at the same time that another will go down in value. The fact that these may offset each other creates the potential diversification benefit we attribute to portfolios. However, an important issue is that the co-movement or correlation pattern of the securities' returns in the portfolio can change in a manner unfavorable to the investor. An increase in the correlation or co-movement of securities' returns adversely affects investors and reduces the diversification benefit."},"a":"C"},{"n":28,"q":"Which of the following best describes an advantage of the EV/EBITDA multiple for valuing equity? An advantage is that:","o":{"A":"the multiple must be positive.","B":"EBITDA is a proxy for operating cash flow.","C":"it does not require the market value of debt."},"f":{"A":"Incorrect because the multiple can be negative if EBITDA is negative.","B":"Correct because an advantage of EBITDA is that it is a proxy for operating cashflow because it excludes depreciation and amortization.","C":"Incorrect because the market value of debt is needed in valuing the equity since it should be deducted from the enterprise value and may be difficult to obtain."},"a":"B"},{"n":29,"q":"The value of a swap contract at initiation is most likely equal to:","o":{"A":"zero.","B":"the price of the swap.","C":"the present value of the fixed payments on the swap."},"f":{"A":"Correct because the value (not the price) of the swap is typically zero at initiation and the fixed swap price is typically determined such that the value of the swap will be zero at initiation.","B":"Incorrect because the value (not the price) of the swap is typically zero at initiation and the fixed swap price is typically determined such that the value of the swap will be zero at initiation. Therefore, the price of the swap should be set at a level so that the value of a swap is zero instead of equal to the value of the swap at initiation.","C":"Incorrect because the principal of replication articulates that the valuation of a swap is the present value of all the net cash flow payments from the swap, not simply the present value of the fixed payments of the swap or the present value of the underlying at the end of the contract."},"a":"A"},{"n":30,"q":"All else being equal, a cash dividend most likely has the same effect on shareholders' wealth as a:","o":{"A":"stock split.","B":"stock dividend.","C":"share repurchase."},"f":{"A":"Incorrect because stock splits and reverse stock splits are similar to stock (not cash) dividends in that they have no economic effect on the company or shareholders. A stock split involves an increase in the number of shares outstanding with a consequent decrease in share price.","B":"Incorrect because stock splits and reverse stock splits are similar to stock (not cash) dividends in that they have no economic effect on the company or shareholders. A stock dividend involves an increase in the number of shares outstanding with a consequent decrease in share price.","C":"Correct because a share repurchase is viewed as equivalent to the payment of cash dividends of equal value in terms of the effect on shareholders' wealth, all other things being equal."},"a":"C"},{"n":31,"q":"An arbitrage opportunity most likely exists if the price of a put option is less than the combined cost of:","o":{"A":"buying the underlying asset, buying the call, and buying a risk-free bond at the present value of the exercise price.","B":"shorting the underlying asset, buying the call, and buying a risk-free bond at the present value of the exercise price.","C":"shorting the underlying asset, buying the call, and shorting a risk-free bond at the present value of the exercise price."},"f":{"A":"Incorrect because the combination of buying the underlying asset, buying the call and buying a risk-free bond at the present value of the exercise price does not equal a long put. Therefore, arbitrage opportunity does not exist even if the total cost of the above combination is different from the price of a put option.","B":"Correct because according to put–call parity, a long put is equal to a combination of buying the call, shorting the underlying asset and buying a risk-free bond at the present value of the exercise price. Therefore, arbitrage opportunity exists if the price of the put option is less than the combined cost of shorting the underlying asset, buying the call and buying a risk-free bond at the present value of the exercise price.","C":"Incorrect because the combination of shorting the underlying asset, buying the call, and shorting a risk-free bond at the present value of the exercise price does not equal a long put. Therefore, arbitrage opportunity does not exist even if the total cost of the above combination is different from the price of a put option."},"a":"B"},{"n":32,"q":"An analysis of the competitive positioning such as Porter's five forces is typically included in:","o":{"A":"an initial company research report only.","B":"a subsequent company research report only.","C":"both initial and subsequent company research reports."},"f":{"A":"Correct because it is only part of the company research report element \"Industry Overview & Competitive Positioning\" which is not listed amongst the five elements for the subsequent company research report: 1.) Front Matter, 2.) Recommendation, 3.) Analysis of New Information, 4.) Valuation and 5.) Risks.","B":"Incorrect because it is typically only included in the initial company research report.","C":"Incorrect because it is typically only included in the initial company research report."},"a":"A"},{"n":33,"q":"With respect to private equity funds, quartile rankings:","o":{"A":"are rarely used for performance evaluation.","B":"include comparisons of different investment strategies.","C":"are based on funds launched in the same vintage year."},"f":{"A":"Incorrect because quartile rankings are commonly used in private equity and real estate. Along this imperfect path and in an effort to benchmark how longer-term investments may be faring, private equity and real estate managers are generally judged by where they fall in terms of a quartile ranking, which depicts their performance against a cohort of peer investment vehicles constructed with similar investment attributes and funded around the same time, or what is often referred to as the same vintage year.","B":"Incorrect because quartile rankings are calculated for peer comparison with like, not different, investment strategies. Along this imperfect path and in an effort to benchmark how longer-term investments may be faring, private equity and real estate managers are generally judged by where they fall in terms of a quartile ranking, which depicts their performance against a cohort of peer investment vehicles constructed with similar investment attributes and funded around the same time, or what is often referred to as the same vintage year.","C":"Correct because along this imperfect path and in an effort to benchmark how longer-term investments may be faring, private equity and real estate managers are generally judged by where they fall in terms of a quartile ranking, which depicts their performance against a cohort of peer investment vehicles constructed with similar investment attributes and funded around the same time, or what is often referred to as the same vintage year."},"a":"C"},{"n":34,"q":"In a semi-strong-form efficient market, which of the following is reflected in prices?","o":{"A":"Past market data only","B":"Private information only","C":"Both past market data and private information"},"f":{"A":"Correct because in a semi-strong-form efficient market, prices reflect all publicly known and available information. Publicly available information includes financial statement data (such as earnings, dividends, corporate investments, changes in management, etc.) and financial market data (such as closing prices, shares traded, etc.). Therefore, the semi-strong form of market efficiency encompasses the weak form. In the weak-form efficient market hypothesis, security prices fully reflect all past market data.","B":"Incorrect because if markets are semi-strong efficient, no single investor has access to information that is not already available to other market participants, therefore private information is not reflected in market prices in a semi-strong-form market.","C":"Incorrect because if markets are semi-strong efficient, no single investor has access to information that is not already available to other market participants, therefore private information is not reflected in market prices in a semi-strong-form market."},"a":"A"},{"n":35,"q":"If a quarterly pay bond has an effective annual rate of 10%, the semiannual bond equivalent yield for this bond is closest to:","o":{"A":"9.76%.","B":"10.13%.","C":"10.25%."},"f":{"A":"Correct because the following formula converts an annual yield\n§from one periodicity to another:    . Here:\n,\nrounded to 9.76%.","B":"Incorrect because it presumes 10% as an annual rate with a\n§periodicity of four:    , rounded to\n10.13%.","C":"Incorrect because it reverses the calculation as\n, and APR2 = 0.1025 = 10.25%."},"a":"A"},{"n":36,"q":"Which of the following positions requires the investor to satisfy an obligation upon option exercise?","o":{"A":"Short put position","B":"Long put position","C":"Long call position"},"f":{"A":"Correct because the long side of an option contract is the side that holds the right to exercise the option. The short side is the side that must satisfy the obligation.","B":"Incorrect because since the position is long, the investor has the right to exercise the option upon which the short side would be liable for delivery or, in other words, the short side would be required to satisfy the obligation.","C":"Incorrect because since the position is long, the investor has the right to exercise the option upon which the short side would be liable for delivery or, in other words, the short side would be required to satisfy the obligation."},"a":"A"},{"n":37,"q":"Which of the following statements concerning a security market index is most accurate?","o":{"A":"Estimated market prices of constituent securities are not used to calculate the index value","B":"The divisor will be adjusted to prevent changes not related to prices of constituent securities","C":"At inception, the total return version of an index will be greater than the price version of an index"},"f":{"A":"Incorrect because the value of an index is calculated using either the actual or estimated market prices of the individual securities.","B":"Correct because an index provider will adjust the value of the divisor as necessary to avoid changes in the index value that are unrelated to changes in the prices of constituent securities.","C":"Incorrect because at inception, the value of a total return index will be equal to the price index."},"a":"B"},{"n":38,"q":"Which of the following best characterizes an interest rate swap?","o":{"A":"A contingent claim derivative using Libor rates as reference rates","B":"A contingent claim derivative used to convert interest rate exposure from fixed-rate to floating-rate","C":"A firm commitment derivative used by investment managers to change portfolio duration without trading bonds"},"f":{"A":"Incorrect because it characterizes an interest rate swap as a contingent claim rather than a firm commitment. Interest rate swaps are a type of firm commitment frequently used by market participants to convert from fixed to floating interest rate exposure over a certain period. And, specifically on the distinction between firm commitment and contingent claim: Firm commitments include forward contracts, futures contracts, and swaps involving a periodic exchange of cash flows. Another type of derivative is a contingent claim, in which one of the counterparties determines whether and when the trade will settle. An option is the primary contingent claim. Additionally, the second part of the answer is incorrect because survey-based Libor rates used as reference rates in the past have been replaced by rates based on a daily average of observed market transaction rates.","B":"Incorrect because it characterizes an interest rate swap as a contingent claim rather than a firm commitment. Interest rate swaps are a type of firm commitment frequently used by market participants to convert from fixed to floating interest rate exposure over a certain period. And, specifically on the distinction between firm commitment and contingent claim: Firm commitments include forward contracts, futures contracts, and swaps involving a periodic exchange of cash flows. Another type of derivative is a contingent claim, in which one of the counterparties determines whether and when the trade will settle. An option is the primary contingent claim.","C":"Correct because interest rate swaps are a type of firm commitment frequently used by market participants to convert from fixed to floating interest rate exposure over a certain period. For example, an investment manager can use interest rate swaps to increase or reduce portfolio duration without trading bonds."},"a":"C"},{"n":39,"q":"Which of the following is best classified as a nonsystematic risk?","o":{"A":"Political uncertainty","B":"Widespread natural disasters","C":"Bankruptcy of a major automobile producer"},"f":{"A":"Incorrect because systematic risk is risk that cannot be avoided and is inherent in the overall market. It is non-diversifiable because it includes risk factors that are innate within the market and affect the market as a whole. Examples of factors that constitute systematic risk include interest rates, inflation, economic cycles, political uncertainty, and widespread natural disasters.","B":"Incorrect because systematic risk is risk that cannot be avoided and is inherent in the overall market. It is non-diversifiable because it includes risk factors that are innate within the market and affect the market as a whole. Examples of factors that constitute systematic risk include interest rates, inflation, economic cycles, political uncertainty, and widespread natural disasters.","C":"Correct because nonsystematic risk is risk that is local or limited to a particular asset or industry that need not affect assets outside of that asset class. Examples of nonsystematic risk could include the failure of a drug trial, major oil discoveries, or an airliner crash. All these events will directly affect their respective companies and possibly industries, but have no effect on assets that are far removed from these industries. Investors are capable of avoiding nonsystematic risk through diversification by forming a portfolio of assets that are not highly correlated with one another. A major auto producer failure will impact the auto industry but the impact can be mitigated through portfolio diversification."},"a":"C"},{"n":40,"q":"An analyst gathers the following information about a company's preferred shares:\n§Par value    $100.00\n§Annual dividend per share    $6.00\n§Current market price    $85.71\n§Maturity    10 years\nIf the required rate of return is 7% and the company's marginal tax rate is 30%, the preferred shares are most likely:","o":{"A":"undervalued.","B":"fairly valued.","C":"overvalued."},"f":{"A":"§Correct because V0 =    D = $6F = $100n =\n10r = 7%V0 = $92.98Given the market price of the preferred shares is $85.71 and the intrinsic value is $92.98, the preferred shares are undervalued.","B":"Incorrect because the formula for perpetual preferred shares is used instead:V0 =  D0 = $6r = 7%V0 = $85.71 which equals the current market price and implies the preferred shares are fairly valued.","C":"Incorrect because the tax rate of 30% has been wrongly taken\n§into account in the formula:V0 =    D = $6 × (1 – 30%) = $4.2F = $100n =\n10r = 7%V0 = $80.33Given the market price of the preferred shares is $85.71 and the intrinsic value is $80.33, the preferred shares are overvalued."},"a":"A"},{"n":41,"q":"Which of the following transactions poses the risk of losing the greatest dollar amount?","o":{"A":"Selling a put with a strike price of $15 for $0.90","B":"Buying a call with a strike price of $15 for $11.25","C":"Buying a put with a strike price of $37.50 for $12.75"},"f":{"A":"Correct because the largest dollar amount loss out of the three answer options occurs for the case of selling a put with a strike price of $15 for $0.90: The profit to the put seller is Π = –Max(0,X – ST) + p0, where X is the exercise price, ST is the price of the underlying at expiration, and p0 is the put price or premium. The put seller, like the insurer, has a limited gain and a loss that is larger the lower the value of the under
