ce of the bond to the present value of the coupon payments and par value. This answer reverses the purchase price and the par value: 8/(1+r) + 8/(1+r)2 + 8/(1+r)3 + 8/(1+r)4 + (108.42+8)/(1+r)5 = 100, r ≈ 9.40%. N=5, PV= –100, PMT=8, FV=108.42, I/Y ≈ 9.40%."},"a":"A"},{"n":26,"q":"For an option-free bond, effective duration:","o":{"A":"will be equal to modified duration if the yield curve is absolutely flat.","B":"measures interest rate risk for both parallel and non-parallel benchmark yield curve shifts.","C":"is an estimate of the percentage change in bond price given a change in the bond’s yield to maturity."},"f":{"A":"Correct because the effective duration and modified duration of an option-free bond are identical only in the rare circumstance of an absolutely flat yield curve. Typically, the two duration measures will differ, but the difference narrows when the yield curve is flatter, the bond’s time to maturity is shorter, and the bond is priced closer to its par value.","B":"Incorrect because effective duration is a curve duration statistic that measures interest rate risk in terms of a parallel shift in the benchmark yield curve, assuming all yields change by the same amount. Interest rate sensitivity associated with non-parallel yield curve shifts is measured by key rate duration rather than effective duration.","C":"Incorrect because effective duration is a curve duration statistic that measures interest rate risk in terms of a parallel shift in the benchmark yield curve (not a change in the bond’s own yield to maturity). Yield duration statistics, such as Macaulay duration and modified duration, measure interest rate risk in terms of a change in the bond’s own yield to maturity."},"a":"A"},{"n":27,"q":"Bonds issued in which of the following markets most likely have fewer reporting, regulatory, and tax constraints?","o":{"A":"Eurobond markets","B":"Foreign bond markets","C":"Domestic bond markets"},"f":{"A":"Correct because domestic and foreign bonds are subject to the legal, regulatory, and tax requirements that apply in that particular country. In contrast, a Eurobond is issued internationally, outside the jurisdiction of the country in whose currency the bond is denominated. The Eurobond market has traditionally been characterized by fewer reporting, regulatory, and tax constraints than domestic and foreign bond markets.","B":"Incorrect because the Eurobond market has traditionally been characterized by fewer reporting, regulatory, and tax constraints than domestic and foreign bond markets.","C":"Incorrect because the Eurobond market has traditionally been characterized by fewer reporting, regulatory, and tax constraints than domestic and foreign bond markets."},"a":"A"},{"n":28,"q":"The correlation between the returns of a risk-free asset and a portfolio of risky assets is:","o":{"A":"negative.","B":"zero.","C":"positive."},"f":{"A":"Incorrect because a combination of the risk-free asset and a risky asset can result in a better risk–return trade-off than an investment in only one type of asset because the risk-free asset has zero correlation with the risky asset.","B":"Correct because a combination of the risk-free asset and a risky asset can result in a better risk–return trade-off than an investment in only one type of asset because the risk-free asset has zero correlation with the risky asset.","C":"Incorrect because a combination of the risk-free asset and a risky asset can result in a better risk–return trade-off than an investment in only one type of asset because the risk-free asset has zero correlation with the risky asset."},"a":"B"},{"n":29,"q":"A 6% 25-year bond with semiannual payments has a market price of $850.00. The yield to maturity of this bond is closest to:","o":{"A":"5.72%.","B":"7.32%.","C":"7.91%."},"f":{"A":"Incorrect because this is the YTM found when reversing the price and face value.","B":"Correct. The yield to maturity is the discount rate that equates the price of the bond ($850.00) with its cash flows (49 semiannual cash flows of $30 and a\n§50th cash flow of $1,030), or    $850 = $30/(1+YTM/2)1 +\n$30/(1+YTM/2)2 +...+ $1030/(1+YTM/2)50 Using a financial calculator to find the yield to maturity gives 7.32%.","C":"Incorrect because this is the YTM found when setting a calculator for 2 payments per year but inputting only 25 payments, rather than 50."},"a":"B"},{"n":30,"q":"The motivation for investing in the mezzanine tranche of a collateralized debt obligation (CDO) is most likely to:","o":{"A":"benefit from the credit protection provided by the senior tranche.","B":"earn a higher yield than that on a comparably rated corporate bond.","C":"﻿receive a return in excess of what is paid out to all other bond classes."},"f":{"A":"Incorrect because it is the senior bond tranche that benefits from credit protection from the mezzanine bond tranche as in any waterfall structure. The subordinated bond classes are sometimes called 'non-senior bond classes' or 'junior bond classes.' They function as credit protection for the more senior bond classes; that is, losses are realized by the subordinated bond classes before any losses are realized by the senior bond classes. Also, the CDO is constructed so as to impose restrictions on the CDO manager via various tests and limits that must be satisfied for the CDO to meet investors’ varying risk appetites while still providing adequate protection for the senior bond class. If the CDO manager fails pre-specified tests, a provision is triggered that requires the payoff of the principal to the senior bond class until the tests are satisfied.","B":"Correct because the motivation for investors to invest in senior or mezzanine bond classes is to earn a potentially higher yield than that on a comparably rated corporate bond by gaining exposure to debt products that they may not otherwise be able to purchase.","C":"Incorrect because this reflects the motivation to invest in the equity tranche, not in the mezzanine tranche. The funds to purchase the collateral assets for a CDO are obtained from the issuance of debt obligations. These debt obligations are bond classes or tranches and include senior bond classes, mezzanine bond classes (that is, bond classes with credit ratings between senior and subordinated bond classes), and subordinated bond classes, often referred to as the residual or equity tranches. The CDO manager seeks to earn a rate of return higher than the aggregate cost of the bond classes (senior bond and mezzanine bond classes). The return in excess of what is paid out to the bond classes accrues to the holders of the equity tranche and to the CDO manager."},"a":"B"},{"n":31,"q":"An investor holds a bond with the following characteristics: Yield to maturity  10% Modified duration  5.7 If the duration gap is zero, the investment horizon is closest to:","o":{"A":"5.2 years.","B":"5.7 years.","C":"6.3 years."},"f":{"A":"Incorrect because the candidate calculates the Macaulay duration incorrectly: MacDur ≠ 5.7 / (1 + 10%) = 5.18, or 5.2. Because the duration gap is equal to the bond's Macaulay duration minus the investment horizon the investment horizon is incorrectly stated as 5.2 years.","B":"Incorrect because the candidate confuses the Macaulay duration with the modified duration, thus incorrectly determining the investment horizon as 5.7 years.","C":"Correct because we use the fact that ModDur = MacDur / (1 + r) to calculate the Macaulay duration of the bond: MacDur = 5.7 × (1 + 10%) = 6.27, or 6.3. Because the duration gap is equal to the bond's Macaulay duration minus the investment horizon the investment horizon is closest to 6.3 years."},"a":"C"},{"n":32,"q":"The CAPM states that two assets with the same expected return will have the same:","o":{"A":"standard deviation.","B":"correlation of returns with the market.","C":"covariance of returns with the market."},"f":{"A":"Incorrect because the CAPM asserts that the expected returns of assets vary only by their systematic risk as measured by beta. However, as beta captures an asset's systematic risk and ignores nonsystematic risk, the assets' total risk (measured by their standard deviations) may differ even though their betas are equal.","B":"Incorrect because βi = ρi,mσi / σm. As beta captures an asset's systematic risk and ignores nonsystematic risk, the assets' total risk (measured by their standard deviations) may differ even though their betas and expected returns are equal. When σi is different for each asset, ρi,m will have to be different for each asset if the betas are equal.","C":"Correct because the CAPM asserts that the expected returns of assets vary only by their systematic risk as measured by beta. Two assets with the same beta will have the same expected return irrespective of the nature of those assets. The covariance of an asset with the market is defined as βiσm2. Therefore, assets with the same expected return and thus the same beta will have the same covariance of returns with the market."},"a":"C"},{"n":33,"q":"The sensitivity of a 30-year fixed-rate bond to a 50 basis points increase in the benchmark rate at the 25-30 years maturity segment is best measured by:","o":{"A":"key rate duration.","B":"effective duration.","C":"modified duration."},"f":{"A":"Correct because key rate duration provides further insight into a bond’s sensitivity to changes in the benchmark yield curve. A key rate duration (or partial duration) is a measure of a bond’s sensitivity to a change in the benchmark yield curve at a specific maturity segment.","B":"Incorrect because effective duration is a curve duration statistic in that it measures interest rate risk in terms of a parallel shift in the benchmark yield curve (ΔCurve).","C":"Incorrect because modified duration provides an estimate of the percentage price change for a bond given a change in its yield-to-maturity."},"a":"A"},{"n":34,"q":"A put option trades for $1.00 with an exercise price of $40.00. If the price of the underlying at expiration is $35.00, the profit for a put seller is:","o":{"A":"–$5.00.","B":"–$4.00.","C":"$4.00."},"f":{"A":"Incorrect because the put seller’s payoff (not profit) is calculated as: –Max(0, X – ST) = –Max(0, $40.00 – $35.00) = –$5.00.","B":"Correct because the put seller’s profit is: Π = –Max(0, X – ST) + p0 , whereX = exercise priceST = strike pricep0 = price of put option Plugging in the values:Π = –Max(0, $40.00 – $35.00) + $1.00 = –$4.00.","C":"Incorrect because the put buyer’s (not seller’s) profit is calculated as: Max(0, X – ST) – p0 = Max(0, $40.00 – $35.00) – $1.00 = $4.00."},"a":"B"},{"n":35,"q":"Investing in private debt most likely is:","o":{"A":"less risky than investing in traditional bonds.","B":"equally risky to investing in traditional bonds.","C":"more risky than investing in traditional bonds."},"f":{"A":"Incorrect because investing in private debt is riskier than investing in traditional bonds. Investors should be aware of these risks, including illiquidity and heightened default risk when loans are extended to riskier entities or borrowers in riskier situations.","B":"Incorrect because investing in private debt is riskier than investing in traditional bonds. Investors should be aware of these risks, including illiquidity and heightened default risk when loans are extended to riskier entities or borrowers in riskier situations.","C":"Correct because investing in private debt is riskier than investing in traditional bonds. Investors should be aware of these risks, including illiquidity and heightened default risk when loans are extended to riskier entities or borrowers in riskier situations."},"a":"C"},{"n":36,"q":"An investor purchases a 5% coupon bond maturing in 15 years for par value. Immediately after purchase, the yield required by the market increases. The investor would then most likely have to sell the bond at:","o":{"A":"par.","B":"a discount.","C":"a premium."},"f":{"A":"Incorrect because the yield is now greater than the coupon.","B":"Correct because the bond would sell below par or at a discount if the yield required by the market rises above the coupon rate. Because the bond initially was purchased at par, the coupon rate equals the yield required by the market. Subsequently, if yields rise above the coupon, the bond’s market price would fall below par.","C":"Incorrect because the yield is now greater than the coupon."},"a":"B"},{"n":37,"q":"If a semiannual pay bond has a yield-to-maturity of 4.3% quoted on a semiannual bond basis, the yield-to-maturity based on quarterly compounding is closest to:","o":{"A":"4.23%.","B":"4.28%.","C":"4.32%."},"f":{"A":"Incorrect because the formula converts from annual to quarterly compounding:(1 + (APR/1))1 = (1 + (APR/4))4 (1 + (0.43)) = (1 + (APR/4))4APR ≠ 0.042324 ≈ 4.23%.","B":"Correct because the formula to convert from semi-annual to quarterly compounding is:(1 + (APR/2))2 = (1 + (APR/4))4 (1 + (0.043/2))2 = (1 + (APR/4))4APR = 0.042771 ≈ 4.28%.","C":"Incorrect because the formula converts from quarterly to semi-annual compounding:(1 + (APR/2))2 = (1 + (APR/4))4 (1 + (APR/2))2 = (1 + (0.043/4))4APR ≠ 0.043231 ≈ 4.32%."},"a":"B"},{"n":38,"q":"The value of a European put is:","o":{"A":"inversely related to the exercise price.","B":"inversely related to the risk-free interest rate.","C":"directly related to the value of the underlying."},"f":{"A":"Incorrect because the value of a European put option is directly related to the exercise price.","B":"Correct because the value of a European put is inversely related to the risk-free interest rate.","C":"Incorrect because the value of a European put option is inversely related to the value of the underlying."},"a":"B"},{"n":39,"q":"An asset-based valuation model would be most applicable:","o":{"A":"for valuing a small and privately held firm.","B":"when the economic environment is hyperinflationary.","C":"for valuing a firm that has significant property, plant, and equipment."},"f":{"A":"Correct because owners of small, privately held businesses are familiar with valuations arrived at by valuing the assets of the company and then subtracting any relevant liabilities.","B":"Incorrect because asset values may be more difficult to estimate in a hyperinflationary environment.","C":"Incorrect because companies with assets that do not have easily determinable market (fair) values—such as those with significant property, plant, and equipment—are very difficult to analyze using asset-based valuation methods."},"a":"A"},{"n":40,"q":"A disadvantage of a fund of hedge funds as compared to a large multi-strategy fund is:","o":{"A":"due diligence expertise.","B":"higher management fees.","C":"diversified exposure to various hedge fund strategies."},"f":{"A":"Incorrect because due diligence expertise is one of the advantages that funds of hedge funds may offer but multi-strategy funds do not. Fund-of-hedge-fund managers must have expertise in conducting hedge fund due diligence, must monitor both absolute and relative performance, and are often able to negotiate better redemption or fee terms than individual investors can.","B":"Correct because funds of hedge funds will add an extra layer of fees. For the investor, all this comes with a higher fee structure—often an additional 1%— because the manager of the fund of funds adds its own fees on top of the hedge fund management fees. Fund-of-funds investors often face a 10% incentive fee in addition to those fees charged by underlying hedge funds.","C":"Incorrect because a large multi-strategy fund can also provide a diversification over various hedge fund strategies. Multi-strategy funds trade relative value within and across asset classes or instruments. Rather than focusing on one type of trade (e.g., convertible arbitrage), a single basis for a trade (e.g., merger arbitrage), or a particular asset class (e.g., fixed income), this strategy instead looks for any available investment opportunities, often with different pods of managers executing unique market approaches."},"a":"B"},{"n":41,"q":"For a put option, if the price of the underlying is greater than the exercise price, the put option is:","o":{"A":"in the money.","B":"at the money.","C":"out of the money."},"f":{"A":"Incorrect because when the underlying is below the put exercise price, the option is said to be in the money.","B":"Incorrect because when the underlying is precisely at the exercise price, the option is said to be at the money.","C":"Correct because when the underlying is higher than the exercise price of the put option, the option is said to be out of the money."},"a":"C"},{"n":42,"q":"As compared to exchange-traded derivative markets, over-the-counter derivative markets are typically more:","o":{"A":"liquid.","B":"flexible.","C":"transparent."},"f":{"A":"Incorrect because OTC instruments have less transparency, usually involve more counterparty risk, and may be less liquid. Moreover, when compared to OTC derivative markets, ETD contracts are more formal and standardized, which facilitates a more liquid and transparent market. Hence, OTC derivative markets are typically less, not more, liquid than ETD markets.","B":"Correct because OTC (over-the-counter) and ETD (exchange-traded derivative) markets differ in several ways. OTC derivatives offer greater flexibility and customization than ETD. Specifically, the terms of OTC contracts can be customized to match a desired risk exposure profile. This flexibility is important to end users seeking to hedge a specific existing or anticipated underlying exposure based upon non-standard terms.","C":"Incorrect because ETD markets have transparency, which means that full information on all transactions is disclosed to exchanges and national regulators. Moreover, when compared to OTC derivative markets, ETD contracts are more formal and standardized, which facilitates a more liquid and transparent market. Hence, OTC derivative markets are typically less, not more, transparent than ETD markets."},"a":"B"},{"n":43,"q":"With regard to commodities, it is most likely true that:","o":{"A":"exposure is most commonly achieved via commodity derivatives.","B":"their returns are based on an income stream such as interest or dividends.","C":"they are physical products so most investors prefer to trade the actual commodity."},"f":{"A":"Correct because the majority of commodity investing is implemented through derivatives.","B":"Incorrect because commodities themselves do not generate cash flows but usually incur costs (cost of carry).","C":"Correct because the majority of commodity investing is implemented through derivatives (not physical commodities)."},"a":"A"},{"n":44,"q":"An analyst forecasts different outcomes for a company next year:\n§Bear Case    Base Case    Bull Case\n§Sales (In € millions)    280    350    400\n§EBITDA margin (%)    10    18    25\n§Debt to capital (%)    75    60    55\nThis forecast table is best described as a:","o":{"A":"scenario analysis.","B":"sensitivity analysis.","C":"point estimate forecast."},"f":{"A":"Correct because scenario analysis involves incorporating the possibility of different outcomes based on key risk factors as well as judging their likelihood of occurrence. Generic risk factors that affect all companies—but to varying degrees include changes in the business cycle, competition, inflation and deflation, and technological developments. Rather than develop single point estimate forecasts, analysts make several forecast scenarios that vary based on different outcomes with respect to key risk factors.","B":"Incorrect because this is a scenario analysis, not sensitivity analysis.","C":"Incorrect because this is a scenario analysis, not a point estimate forecast."},"a":"A"},{"n":45,"q":"During its life, the value of a forward contract is most likely equal to the price of the underlying minus the price of the:","o":{"A":"forward.","B":"forward, discounted over the original term of the contract.","C":"forward, discounted over the remaining term of the contract."},"f":{"A":"Incorrect. This is only true at expiration.","B":"Incorrect. This is only true at initiation.","C":"Correct. The value of a forward contract is the spot price of the underlying minus the present value of the forward contract. Calculating the present value requires adjusting the time period to account for the remaining term of the contract."},"a":"C"},{"n":46,"q":"According to the capital asset pricing model (CAPM), the difference in the expected returns for two securities is determined by the securities':","o":{"A":"total risk.","B":"systematic risk only.","C":"nonsystematic risk only."},"f":{"A":"Incorrect because the standard deviation is a measure of total risk or volatility of a security itself based on historical returns. A security's standard deviation, correlation, and the standard deviation of the market must be taken into account in the calculation for beta, a measure of systematic risk. According to the CAPM, it is beta (systematic risk) that is then used to calculate expected return, because the nonsystematic risk included in the total risk (standard deviation) can be diversified away. Thus, while standard deviation is used to determine beta, the CAPM asserts that the expected returns of assets vary only by their systematic risk as measured by beta. Two assets with the same beta will have the same expected return irrespective of the nature of those assets.","B":"Correct because the CAPM asserts that the expected returns of assets vary only by their systematic risk as measured by beta. Two assets with the same beta will have the same expected return irrespective of the nature of those assets.","C":"Incorrect because the CAPM asserts that the expected returns of assets vary only by their systematic risk as measured by beta. Two assets with the same beta will have the same expected return irrespective of the nature of those assets. Nonsystematic risk is not part of the expected return of a security."},"a":"B"},{"n":47,"q":"Which of the following performance measures is most appropriate for an investor who holds a well-diversified portfolio?","o":{"A":"M2","B":"Sharpe ratio","C":"Jensen's alpha"},"f":{"A":"Incorrect because M2 utilizes total risk rather than systematic risk. Total risk is relevant for an investor when he or she holds a portfolio that is not fully diversified, which is not a desirable portfolio. In such cases, the Sharpe ratio and M2 are appropriate performance measures.","B":"Incorrect because a well-diversified investor is only exposed to systematic risk, as measured by beta. The Sharpe ratio uses the total risk of the portfolio, not its systematic risk. Total risk is relevant for an investor when he or she holds a portfolio that is not fully diversified.","C":"Correct because Jensen's alpha is based on systematic risk. Performance measures relative to beta risk—Treynor ratio and Jensen’s alpha—are relevant when the investor holds a well-diversified portfolio with negligible diversifiable risk."},"a":"C"},{"n":48,"q":"A function of the financial system is to:","o":{"A":"prevent traders from speculating on information.","B":"equate aggregate savings with aggregate borrowings.","C":"restrict companies from spending money they do not have."},"f":{"A":"Incorrect because a main function of the financial system is to facilitate the achievement of the purposes for which people use the financial system. People use the financial system for six main purposes, one of which is to trade on information. Information-motivated traders trade to profit from information that they believe allows them to predict future prices.","B":"Correct because the main functions of the financial system are to facilitate, which includes the discovery of the rates of return that equate aggregate savings with aggregate borrowings. Economists call this rate the equilibrium interest rate. It is the price for moving money through time. Determining this rate is one of the most important functions of the financial system.","C":"Incorrect because the main functions of the financial system are to facilitate which includes the achievement of the purposes for which people use the financial system. People use the financial system for six main purposes, one of which is to borrow money for current use. People, companies, and governments often want to spend money now that they do not have. They can obtain money to fund projects that they wish to undertake now by borrowing it."},"a":"B"},{"n":49,"q":"A protective put strategy consists of a:","o":{"A":"long put option on an asset and a long position in a risk-free bond.","B":"long position in an underlying asset and a long put option on the asset.","C":"long call option on an asset and a short position in the underlying asset."},"f":{"A":"Incorrect because the strategy of holding the asset and a put is called a protective put. A protective put does not consist of a long put option on an asset and a long position in a risk-free bond.","B":"Correct because the strategy of holding the asset and a put is called a protective put.","C":"Incorrect because the strategy of holding the asset and a put is called a protective put. A protective put does not consist of a long call option on an asset and a short position in the underlying asset."},"a":"B"},{"n":50,"q":"A stock dividend:","o":{"A":"is relevant for valuation of a company.","B":"involves an increase in the number of shares outstanding.","C":"alters the shareholders' proportional ownership in the company."},"f":{"A":"Incorrect because stock dividends are not relevant for valuation.","B":"Correct because a stock dividend is a type of dividend in which a company distributes additional shares of its common stock (typically, 2%–10% of the shares then outstanding) to shareholders instead of cash. This results in an increase in the number of shares outstanding.","C":"Incorrect because a stock dividend divides the “pie” (the market value of shareholders’ equity) into smaller pieces without affecting the value of the pie or any shareholder’s proportional ownership in the company."},"a":"B"},{"n":51,"q":"Which of the following best describes a reason for having a written investment policy statement?","o":{"A":"To communicate a plan for achieving investment success","B":"To keep track of the performance of a client's investment portfolio","C":"To serve as a fact-finding process for determining a client's risk tolerance"},"f":{"A":"Correct because without a full understanding of the client's situation and requirements, it is unlikely that successful results will be achieved. 'Success' can be defined as a client achieving his or her important investment goals using means that he or she is comfortable with (in terms of risks taken and other concerns). The IPS essentially communicates a plan for achieving investment success.","B":"Incorrect because the IPS is prepared before a client's investment portfolio is constructed as part of portfolio planning. Portfolio planning can be defined as a program developed in advance of constructing a portfolio that is expected to define the client’s investment objectives. The written document governing this process is the IPS. Although Evaluation and Review is a component of the finished document, the reason for having a written IPS is to provide investment guidelines, not to track performance.","C":"Incorrect because a determination of the client's risk tolerance is done before writing the IPS. The IPS is typically developed following a fact-finding discussion with the client. This fact-finding discussion can include the use of a questionnaire designed to articulate the client's risk tolerance as well as specific circumstances."},"a":"A"},{"n":52,"q":"Which bond is most likely to exhibit a reduction in duration as time to maturity increases? A bond priced at:","o":{"A":"par.","B":"a discount.","C":"a premium."},"f":{"A":"Incorrect because for par and premium bonds, longer times to maturity always correspond to higher duration measures (interest rate risk).","B":"Correct because a longer time to maturity usually leads to higher duration. It always does so for a bond priced at a premium or par value. But if the bond is priced at a discount, a longer time to maturity might lead to a lower duration. The situation occurs only if the coupon rate is low (but not zero) relative to the yield and the time to maturity is long.","C":"Incorrect because for par and premium bonds, longer times to maturity always correspond to higher duration measures (interest rate risk)."},"a":"B"},{"n":53,"q":"In the investment policy statement of a pension fund, a countrywide limit on the proportion of high-risk assets that can be held in long-term pension portfolios is most likely a:","o":{"A":"liquidity constraint.","B":"time horizon constraint.","C":"legal and regulatory constraint."},"f":{"A":"Incorrect because the countrywide constraint for pension funds that limits the proportion of high-risk assets in the portfolio is a regulatory constraint. The fact that the constraint is formulated as a limit to invest in high-risk assets does not indicate it is a liquidity constraint. Liquidity constraints state what the likely requirements are to withdraw funds from the portfolio.","B":"Incorrect because the countrywide constraint for pension funds that limits the proportion of high-risk assets in the portfolio is a regulatory constraint. The constraint does not change the broad investment time horizon of the pension fund and is therefore not a time horizon constraint. Time horizon constraints state the time horizon over which the investor is investing.","C":"Correct because the IPS should state any legal and regulatory restrictions that constrain how the portfolio is invested. In some countries, such institutional investors as pension funds are subject to restrictions on the composition of the portfolio. For example, there may be a limit on the proportion of equities or other risky assets in the portfolio, or on the proportion of the portfolio that may be invested overseas."},"a":"C"},{"n":54,"q":"Relative to a non-recourse mortgage loan, in a recourse mortgage loan the:","o":{"A":"lender can change the interest rate charged.","B":"borrower does not have a strategic default option.","C":"borrower is not liable for any shortfall between the property sale proceeds and the loan amount."},"f":{"A":"Incorrect because recourse and non-recourse do not refer to any pricing terms.","B":"Correct because there are recourse and non-recourse mortgage loans. In a non-recourse loan, the lender does not have a claim against the borrower and thus can look only to the property to recover the outstanding mortgage balance. In a recourse loan, the lender can seek to recover any shortfall from the sale of the property to cover the mortgage loan. The borrower, therefore, has a strategic default option only in non-recourse loans; for example, if the mortgage is greater than the property value, he may select to default without further personal obligation.","C":"Incorrect because in a recourse loan, the borrower does not have an incentive to default on an underwater mortgage since the lender can seek to recover any shortfall beyond the sale of the property from the borrower."},"a":"B"},{"n":55,"q":"The multiple of invested capital (MOIC) measure takes into account:","o":{"A":"the realized value of an investment only.","B":"the residual asset value of an investment only.","C":"both the realized value of an investment and the residual asset value of an investment."},"f":{"A":"Incorrect because MOIC is calculated as follows: MOIC = (Realized value of investment + Unrealized (or residual) value of investment)/(Total amount of invested capital). With MOIC, one simply measures the total value of all realized investments and residual asset values (assets that may still be awaiting their ultimate sale) relative to an initial total investment.","B":"Incorrect because MOIC is calculated as follows: MOIC = (Realized value of investment + Unrealized (or residual) value of investment)/(Total amount of invested capital). With MOIC, one simply measures the total value of all realized investments and residual asset values (assets that may still be awaiting their ultimate sale) relative to an initial total investment.","C":"Correct because MOIC is calculated as follows: MOIC = (Realized value of investment + Unrealized (or residual) value of investment)/(Total amount of invested capital). With MOIC, one simply measures the total value of all realized investments and residual asset values (assets that may still be awaiting their ultimate sale) relative to an initial total investment."},"a":"C"},{"n":56,"q":"Investors in a closed-end mutual fund can liquidate their positions by selling the shares to:","o":{"A":"the fund itself only.","B":"other investors only.","C":"both the fund itself and other investors."},"f":{"A":"Incorrect because this describes an open-end fund, not a closed-end fund. The fund can be set up as an open-end fund or a closed-end fund. If it is an open-end fund, it will accept new investment money and issue additional shares at a value equal to the net asset value of the fund at the time of investment. Funds can also be withdrawn at the net asset value per share. Suppose (an investor) wishes to withdraw all her shares in the mutual fund. To accommodate this withdrawal, the fund will have to liquidate assets to retire (the position). An alternative to setting the fund up as an open-end fund would be to create a closed-end fund in which no new investment money is accepted into the fund. New investors invest by buying existing shares, and investors in the fund liquidate by selling their shares to other investors.","B":"Correct because an alternative to setting the fund up as an open-end fund would be to create a closed-end fund in which no new investment money is accepted into the fund. New investors invest by buying existing shares, and investors in the fund liquidate by selling their shares to other investors.","C":"Incorrect because a closed-end fund investment is liquidated by selling the position to other investors in the market. An alternative to setting the fund up as an open-end fund would be to create a closed-end fund in which no new investment money is accepted into the fund. New investors invest by buying existing shares, and investors in the fund liquidate by selling their shares to other investors."},"a":"B"},{"n":57,"q":"Effective duration measures a bond's sensitivity to a:","o":{"A":"flattening of the benchmark yield curve.","B":"steepening of the benchmark yield curve.","C":"parallel shift in the benchmark yield curve."},"f":{"A":"Incorrect because effective duration measure indicates the bond’s sensitivity to the benchmark yield curve if all yields change by the same amount.","B":"Incorrect because effective duration measure indicates the bond’s sensitivity to the benchmark yield curve if all yields change by the same amount.","C":"Correct because effective duration measure indicates the bond’s sensitivity to the benchmark yield curve if all yields change by the same amount."},"a":"C"},{"n":58,"q":"An example of nonsystematic risk is a(n):","o":{"A":"failure of a drug trial.","B":"increase in the overall rate of inflation.","C":"change in the central bank's interest rate policy."},"f":{"A":"Correct because nonsystematic risk is risk that is local or limited to a particular asset or industry that need not affect assets outside of that asset class. Examples of nonsystematic risk could include the failure of a drug trial, major oil discoveries, or an airliner crash. All these events will directly affect their respective companies and possibly industries, but have no effect on assets that are far removed from these industries. A change in the prescription drug approval process is an example of nonsystematic risk that is limited to the pharmaceutical industry.","B":"Incorrect because a change in the inflation rate is a systematic risk as it cannot be avoided. An increase in inflation will affect the market as a whole and not just a particular industry.","C":"Incorrect because a change in interest rates by the central bank is a systematic risk. Interest rate risk is non-diversifiable because it includes risk factors that are innate within the market and affect the market as a whole."},"a":"A"},{"n":59,"q":"Which of the following is best categorized as non-financial risk?","o":{"A":"Credit risk","B":"Market risk","C":"Accounting risk"},"f":{"A":"Incorrect because the three primary types of financial risks are market risk, credit risk, and liquidity risk.","B":"Incorrect because the three primary types of financial risks are market risk, credit risk, and liquidity risk.","C":"Correct because the following three non-financial risks are related: regulatory risk, accounting risk, and tax risk, i.e., accounting risk is a non-financial risk."},"a":"C"},{"n":60,"q":"An investor buys a stock on margin, posting 60% of the initial $63.00 per share price as equity. All else being equal, if the investor receives a margin call at $33.60 per share, the maintenance margin on this trade is:","o":{"A":"12.5%.","B":"25.0%.","C":"40.0%."},"f":{"A":"Incorrect because it calculates the margin requirement as the initial equity per share minus the margin call price divided by the margin call price: (0.6 × $63 – $33.60) / 33.60 = $37.80 – $33.60 / $33.60 = $4.20 / $33.60 = 0.125, which is closest to 12.5%.","B":"Correct because the maintenance margin = equity/share / price/share = (initial margin % × initial stock price + margin call price – initial price) / margin call price. In this case: (0.6 × $63 + $33.60 – $63) / $33.60 = ($37.8 + $33.60 – $63) / $33.60 = = $8.40 / $33.60 = 0.2500, which is closest to 25%.","C":"Incorrect because it calculates the margin requirement as 1 – initial equity = 1 – 0.6 = 0.4, which is 40%."},"a":"B"},{"n":61,"q":"Which version of the dividend discount model (DDM) would most likely be appropriate for valuing a fairly young, publicly traded company?","o":{"A":"A two-stage DDM","B":"A three-stage DDM","C":"The Gordon growth model"},"f":{"A":"Incorrect because a two-stage DDM would be appropriate to estimate the value of an older company that has already moved through its growth phase and is currently in the transition phase (a period with a growth rate higher than the sustainable growth rate) prior to moving to the maturity phase (the period with a lower, sustainable growth rate).","B":"Correct because for most publicly traded companies (that is, companies beyond the startup stage), practitioners assume that growth will ultimately fall into three stages: (1) growth, (2) transition, and (3) maturity. This assumption supports the use of a three-stage DDM.","C":"Incorrect because the Gordon growth model is a single-stage model that assumes that the dividend growth rate is perpetual and unchanging. This model is appropriate for a fully mature company with long-term sustainable prospects."},"a":"B"},{"n":62,"q":"An analyst gathers the following information about a company and its common stock: Current dividend per share (D0)  $2.00\n§Dividend payout ratio    55%\n§ROE    9%\nIf the required return is 8%, the intrinsic value per share using the Gordon growth model is closest to:","o":{"A":"$50.63.","B":"$52.68.","C":"$68.82."},"f":{"A":"Incorrect because if D0 is used instead of D1, then intrinsic value V0 = D0 / (r – g), where: g = ROE × earnings retention rate = 0.09 × (1 – 0.55) = 0.0405. Thus, V0 = $2.00 / (0.08 – 0.0405) = $2.00 / 0.0395 ≈ $50.6329 = $50.63.","B":"Correct because intrinsic value = V0 = D1 / (r – g), where: g = ROE × earnings retention rate = 0.09 × (1 – 0.55) = 0.0405, D1 = D0 × (1 + g) = $2.00 × 1.0405 = $2.0810. Thus, V0 = $2.0810 / (0.08 – 0.0405) = $2.0810 / 0.0395 ≈ $52.6835 = $52.68.","C":"Incorrect because if the payout ratio is used instead of the retention rate to calculate the growth rate; then g = ROE × payout rate = 0.09 × 0.55 = 0.0495, D1 = D0 × (1 + g) = $2.00 × 1.0495 = $2.0990. Thus, V0 = $2.0990 / (0.08 – 0.0495) = $2.0990 / 0.0305 ≈ $68.8197 = $68.82."},"a":"B"},{"n":63,"q":"An analyst gathers the following information (in £ millions) about a company's fiscal year:\n§Net income    1,500\n§Average total assets    11,500\n§Average shareholders' equity    7,500\nIf the dividend payout ratio is 45%, the sustainable growth rate is closest to:","o":{"A":"7%.","B":"9%.","C":"11%."},"f":{"A":"Incorrect because it assumed the sustainable growth rate = (1 – payout ratio) × ROA, where ROA = Net income / Average total assets = 1,500/11,500 = 0.1304. Thus the sustainable growth rate = (1 – 0.45) × 0.1304 = 0.55 × 0.1304 = 0.0717 ≈ 7%.","B":"Incorrect because it assumed the sustainable growth rate = Payout ratio × ROE, where ROE = Net income / Average shareholders' equity = 1,500 / 7,500 = 0.2.Thus sustainable growth rate is calculated as = 0.45 × 0.2 = 0.09 = 9%.","C":"Correct because the sustainable growth rate = Retention rate × ROE, where the retention rate = (1– payout ratio) and ROE = Net income / Average shareholders' equity.Thus sustainable growth rate = (1 – 0.45) × 1,500/7,500 = 0.55 × 0.2 = 0.11 = 11%."},"a":"C"},{"n":64,"q":"Which of the following most likely accounts for most of the long-term changes in a portfolio's value?","o":{"A":"Beta","B":"Alpha","C":"Security selection"},"f":{"A":"Correct because one principle is that a portfolio's systematic risk accounts for most of its change in value over the long term. Also, beta captures an asset's systematic risk, or the portion of an asset's risk that cannot be eliminated by diversification. Therefore, beta typically accounts for most of the changes in portfolio value.","B":"Incorrect because alpha indicates whether the portfolio has outperformed the market. If alpha is positive, then the portfolio has outperformed the market; if alpha is negative, the portfolio has underperformed the market. Outperformance does not account for most of the changes in a portfolio's value over the long term but measures its value relative to a market.","C":"Incorrect because security selection is an attempt to generate higher returns than the asset class benchmark by selecting securities with a higher expected return. In other words, security selection creates alpha. But it is beta, and not alpha that accounts for most of the changes in a portfolio's value over the long term."},"a":"A"},{"n":65,"q":"An analyst gathers the following information about a hedge fund:\n§Beginning-of-year assets under management (AUM)    $100 million\n§End-of-year AUM before fees    $120 million\n§Management fee, based on year-end AUM    2%\n§Incentive fee    20%\n§Hard hurdle rate    8%\nIf the incentive fee is calculated net of the management fee, the total fees earned by the fund manager are closest to:","o":{"A":"$4.3 million.","B":"$4.8 million.","C":"$5.9 million."},"f":{"A":"Correct because the partnership agreement usually specifies that the performance fee is earned only after the fund achieves a return known as a hurdle rate. The hurdle rate is a minimum rate of return, typically 8%, that the GP must exceed in order to earn the performance fee. GPs typically receive 20% of the total profit of the private equity fund net of any hard hurdle rate, in which case the GP earns fees on annual returns in excess of the hurdle rate, or net of the soft hurdle rate, in which case the fee is calculated on the entire annual gross return as long as the set hurdle is exceeded. Management fee = AUM end of year × 2% = $120,000,000 × 2% = $2,400,000; Hard hurdle rate = $100,000,000 × 8% = $8,000,000; Incentive fee = ($120,000,000 − $100,000,000 – $8,000,000 – $2,400,000) × 20% = $1,920,000; Total fees = $2,400,000 + $1,920,000 = $4,320,000 ≈ $4.3 million.","B":"Incorrect because the incentive fee is calculated on the gross return, not the net return. Management fee = AUM end of year × 2% = $120,000,000 × 2% = $2,400,000; Incentive fee ≠ ($120,000,000 − $100,000,000 – $8,000,000) × 20% = $2,400,000; Total fees ≠ $2,400,000 + $2,400,000 = $4,800,000 = $4.8 million.","C":"Incorrect because a soft hurdle rate is used, not a hard hurdle rate. Management fee = AUM end of year × 2% = $120,000,000 × 2% = $2,400,000; Incentive fee ≠ ($120,000,000 − $100,000,000 – $2,400,000) × 20% = $3,520,000; Total fees ≠ $2,400,000 + $3,520,000 = $5,920,000 ≈ $5.9 million."},"a":"A"},{"n":66,"q":"An analyst gathers the following information about a bond:\n§Annual modified duration    7.534\n§Flat price (per 100 of par value)    92.084\n§Accrued interest (per 100 of par value)    1.458\nThe bond's money duration per 100 of par value is closest to:","o":{"A":"683.","B":"694.","C":"705."},"f":{"A":"Incorrect because it subtracts accrued interest instead of adding it. MoneyDur = AnnModDur × (PVFlat + AI) ≠ AnnModDur × (PVFlat – AI) = 7.534 × (92.084 – 1.458) = 7.534 × 90.626 ≈ 682.7763 ≈ 683.","B":"Incorrect because it uses flat price instead of full price.MoneyDur = AnnModDur × (PVFlat + AI) ≠ AnnModDur × (PVFlat) = 7.534 × 92.084 ≈ 693.761 ≈ 694.","C":"Correct because money duration (MoneyDur) is calculated as the annual modified duration (AnnModDur) times the full price (PVFull) of the bond including accrued interest.MoneyDur = AnnModDur × PVFull. Using also the relation PVFull = PVFlat + AI, where PVFlat is the flat price and AI is the accrued interest, MoneyDur = AnnModDur × (PVFlat + AI) = 7.534 × (92.084 + 1.458) = 7.534 × 93.542 ≈ 704.745 ≈ 705."},"a":"C"},{"n":67,"q":"An analyst gathers the following information about forward rates:\n§Time Period    Forward Rate\n§0y1y    2.31%\n§1y1y    2.82%\n§2y1y    2.97%\nThe 2-year implied spot rate is closest to:","o":{"A":"2.56%.","B":"2.82%.","C":"2.89%."},"f":{"A":"Correct because the spot curve can be calculated as the geometric average of the forward rates. Here, the two-year implied spot rate is: (1.0231 × 1.0282) = (1 + z2)2, z2 = 0.0256 = 2.56%.","B":"Incorrect because this 2.82% is simply the one-year forward rate one year from now.","C":"Incorrect because the incorrect forward rates are used: (1.0282 × 1.0297) = (1 + z2)2, z2 = 0.0289 = 2.89%."},"a":"A"},{"n":68,"q":"A US Treasury security originally issued with five years to maturity is a Treasury:","o":{"A":"bill.","B":"note.","C":"bond."},"f":{"A":"Incorrect because a Treasury security issued with a maturity of one year or less is called a Treasury bill.","B":"Correct because a Treasury security issued with a maturity longer than one year and up to 10 years is called a Treasury note.","C":"Incorrect because a Treasury security issued with a maturity of greater than ten years is called a Treasury bond."},"a":"B"},{"n":69,"q":"In behavioral finance, which of the following statements best describes the bias of conservatism? Investors:","o":{"A":"assess new information and probabilities of outcomes based on similarity to the current state.","B":"focus on issues in isolation and respond to the issues based on how the issues are posed.","C":"tend to be slow to react to new information and continue to maintain their prior views or forecasts."},"f":{"A":"Incorrect because if investors assess new information and probabilities of outcomes based on similarity to the current state or to a familiar classification, then they show a behavioral bias called representativeness.","B":"Incorrect because if investors focus on issues in isolation and respond to the issues based on how the issues are posed, then they show a behavioral bias called narrow framing.","C":"Correct because conservatism is a behavioral bias in which investors tend to be slow to react to new information and continue to maintain their prior views or forecasts."},"a":"C"},{"n":70,"q":"An analyst gathers the following information about a bond:\n§Price    Yield-to-Maturity (%)\n§103.52    3.7\n§103.84    3.3\nIf the bond currently trades at a price of 103.67 with a yield-to-maturity of 3.5%, the approximate convexity is closest to:","o":{"A":"0.048.","B":"0.096.","C":"48.230."},"f":{"A":"Incorrect because approximate convexity is computed as: [(PV_) + (PV+) – (2 x PV0)]/[(ΔYield)2 x (PV0)]. This answer multiplies the change in yield in the denominator by 2 rather than squaring it: [103.52 + 103.84 – (2 x 103.67)]/[(2 x 0.002) x 103.67] = 0.0482 ≈ 0.048.","B":"Incorrect because approximate convexity is computed as: [(PV_) + (PV+) – (2 x PV0)]/[(ΔYield)2 x (PV0)]. This answer fails to square the change in yield in the denominator: [103.52 + 103.84 – (2 x 103.67)]/[0.002 x 103.67] = 0.09645 ≈ 0.096","C":"Correct because approximate convexity is computed as: [(PV_) + (PV+) – (2 x PV0)]/[(ΔYield)2 x (PV0)] = [103.52 + 103.84 – (2 x 103.67)]/[(0.002)2 x 103.67] = 48.22996 ≈ 48.230."},"a":"C"},{"n":71,"q":"Which of the following return measures is most appropriate when comparing the annual returns of an asset class over various long historical time periods?","o":{"A":"The arithmetic mean of real returns","B":"The geometric mean of real returns","C":"The arithmetic mean of nominal returns"},"f":{"A":"Incorrect because the geometric mean is a more accurate representation of returns for multiple holding periods over a long timespan than the arithmetic mean.","B":"Correct because the geometric mean is a more accurate representation of returns for multiple holding periods over a long timespan than the arithmetic mean.","C":"Incorrect because comparisons across various time periods are difficult and misleading using nominal returns. Therefore, it is more effective to rely on real returns than nominal returns when comparing the annual returns over long historical time periods."},"a":"B"},{"n":72,"q":"If the forward price of a stock is equal to the current spot price, the price of an at-the-money put option applying put–call parity will be:","o":{"A":"lower than the price of at-the-money call option.","B":"equal to the price of at-the-money call option.","C":"higher than the price of at-the-money call option."},"f":{"A":"Incorrect because according to put-call parity po – co = [X – Fo(T)]/(1+r)T If the forward price is equal to the spot price which is also the strike price as the options are at-the-money, the right hand side of the equation is zero and put price is equal to the call price and not lower than the call price.","B":"Correct because according to put-call parity po – co = [X – Fo(T)]/(1+r)T If the forward price is equal to the spot price which is also the strike price as the options are at-the-money, the right hand side of the equation is zero and put price is equal to the call price.","C":"Incorrect because according to put-call parity po – co = [X – Fo(T)]/(1+r)T If the forward price is equal to the spot price which is also the strike price as the options are at-the-money, the right hand side of the equation is zero and put price is equal to the call price and not higher than the call price."},"a":"B"},{"n":73,"q":"Regarding hedge fund fee calculations, a high-water mark:","o":{"A":"represents the return on gains that are not yet fully realized.","B":"protects the client from paying twice for the same performance.","C":"is the rate of return that the general partner must exceed in order to earn a performance fee."},"f":{"A":"Incorrect because this distractor pertains to the clawback provision, not high water mark. A clawback provision reflects the right of LPs to reclaim part of the GP’s performance fee. Along either waterfall path, if a GP ever accrues (or actually pays itself) an incentive fee on gains that are not yet fully realized and then subsequently gives back these gains, an investor is typically able to claw back prior incentive fee accruals and payments.","B":"Correct because in hedge funds, fee calculations also take into account a high-water mark, which reflects the highest value used to calculate an incentive fee. A high-water mark is the highest value of the fund investment ever achieved at a performance fee crystallization date, net of fees, by the individual LP. The use of high-water marks protects clients from paying twice for the same performance.","C":"Incorrect because the rate of the return that must be achieved before incentive fees are earned is the hurdle rate. The partnership agreement usually specifies that the performance fee is earned only after the fund achieves a return known as a hurdle rate. The hurdle rate is a minimum rate of return, typically 8%, that the GP must exceed in order to earn the performance fee."},"a":"B"},{"n":74,"q":"An analyst gathers the following information about three stocks that are the only constituents of an equal-weighted index:\n§Beginning of the Year    End of the Year\n§Price per    Shares    Shares\n§Stock    Price per Share\n§Share    Outstanding    Outstanding\n§1    €30    500    €36    500\n§2    €50    200    €45    200\n§3    €40    300    €50    300\nAt the beginning of the year, the index value was 100. If it is not rebalanced during the year, the index value at the end of the year is closest to:","o":{"A":"109.2.","B":"111.7.","C":"113.5."},"f":{"A":"Incorrect because 109.2 is the return for a price-weighted index. The sum of prices at the beginning of the period is (30 + 40 + 50) = 120. The sum of price at the end of the period is (36 + 45 + 50) = 131. Hence, the return is ((131/120) – 1) = 0.09166 ≈ 9.17%. Using this increase of 9.17%, the index value at year end is 100 × 1.0917 ≈ 109.2.","B":"Correct because to calculate the index value of an equal-weighted index, the return for each security is first calculated using the formula: (ending value / beginning value) – 1.Stock 1: ((36/30) –1) = 0.2 = 20%Stock 2: ((45/50) –1) = –0.1 = –10%Stock 3: ((50/40) –1) = 0.25 = 25%These returns are then averaged: ((20% – 10% + 25%)/3) ≈ 11.67%.The index value at year end is the beginning index value × average return = 100 × 1.1167 ≈ 111.7.","C":"Incorrect because 113.5 is the return for a value-weighted index. The market value at the beginning of the period is (30 × 500 + 50 × 200 + 40 × 300) = 37,000. The market value at the end of the period is (36 × 500 + 45 × 200 + 50 × 300) = 42,000. The return is ((42,000/37,000) –1) ≈ 0.1351 = 13.51%. Using this return, the index value at year end is 100 × 1.135 = 113.5."},"a":"B"},{"n":75,"q":"The price of a futures contract will be higher than the price of a forward contract when the correlation between futures prices and interest rates is:","o":{"A":"negative.","B":"zero.","C":"positive."},"f":{"A":"Incorrect because if futures prices are positively correlated with interest rates, futures contracts are more desirable to holders of long positions than are forwards. This condition makes futures more attractive than forwards, and therefore their prices will be higher than forward prices. So, the price of a futures contract will be higher than the price of a forward contract when futures prices have a positive (not negative) correlation with interest rates.","B":"Incorrect because if futures prices are positively correlated with interest rates, futures contracts are more desirable to holders of long positions than are forwards. This condition makes futures more attractive than forwards, and therefore their prices will be higher than forward prices. So, the price of a futures contract will be higher than the price of a forward contract when futures prices have a positive (not zero) correlation with interest rates.","C":"Correct because if futures prices are positively correlated with interest rates, futures contracts are more desirable to holders of long positions than are forwards. This condition makes futures more attractive than forwards, and therefore their prices will be higher than forward prices."},"a":"C"},{"n":76,"q":"In the priority of claims, the class of corporate debt that has the lowest priority of payments in the event of default is most likely:","o":{"A":"second lien debt.","B":"subordinated debt.","C":"junior subordinated debt."},"f":{"A":"Incorrect because within secured debt, there is first mortgage and first lien debt, which are the highest ranked debt in terms of priority of repayment there can also be second lien, or even third lien, secured debt, which as the name implies, has a secured interest in the pledged assets. As secured debt ranks higher than unsecured debt, second lien debt is not the lowest priority payment in the priority of claims.","B":"Incorrect because other lower-ranked debt includes subordinated debt and junior subordinated debt. Among the various creditor classes, these obligations have among the lowest priority of claims and frequently have little or no recovery in the event of default. Junior subordinated debt sits below subordinated debt in the priority of claims and thus subordinated debt is not the lowest priority payment in the event of default.","C":"Correct because other lower-ranked debt includes subordinated debt and junior subordinated debt. Among the various creditor classes, these obligations have among the lowest priority of claims and frequently have little or no recovery in the event of default. Junior subordinated debt sits below subordinated debt in the priority of claims."},"a":"C"},{"n":77,"q":"The returns of Asset 1 and Asset 2 are perfectly positively correlated. If the assets have the same standard deviation of returns, the covariance between the returns of the assets is equal to the:","o":{"A":"variance of Asset 1’s returns.","B":"standard deviation of Asset 1’s returns.","C":"variance of Asset 1’s returns times the variance of Asset 2’s returns."},"f":{"A":"Correct because covariance can be expanded as Cov(R1,R2) = ρ12σ1σ2 where ρ12 is the correlation between returns. As the returns of the assets are perfectly positively correlated, the correlation is 1, and the covariance between the returns of the assets is the product of the standard deviations; ρ12σ1σ2 = 1 × σ1 × σ2. Since the standard deviations are the same (σ1 = σ2), the covariance is 1 × σ1 × σ1, which is the variance of Asset 1.","B":"Incorrect because covariance can be expanded as Cov(R1,R2) = ρ12σ1σ2 where ρ12 is the correlation between returns. As the returns of the assets are perfectly positively correlated, the correlation is 1, and the covariance between the returns of the assets is the product of the standard deviations; ρ12σ1σ2 = 1 × σ1 × σ2. Since the standard deviations are the same (σ1 = σ2), the covariance is 1 × σ1 × σ1, which is the variance of Asset 1, rather than the standard deviation.","C":"Incorrect because covariance can be expanded as Cov(R1,R2) = ρ12σ1σ2 where ρ12 is the correlation between returns. As the returns of the assets are perfectly positively correlated, the correlation is 1, and the covariance between the returns of the assets is the product of the standard deviations; ρ12σ1σ2 = 1 × σ1 × σ2. Since the standard deviations are the same (σ1 = σ2), the covariance is 1 × σ1 × σ1, which is the variance of Asset 1, rather than the product of the assets’ variances."},"a":"A"},{"n":78,"q":"In contrast to life insurers, property and casualty insurers most likely:","o":{"A":"invest their general account assets in fixed-income securities.","B":"accept investments with lower returns in their general account.","C":"target a higher return in the surplus account than in the general account."},"f":{"A":"Incorrect because it is a similarity of both types of insurers, not a key difference. To pay claims to policyholders, regulatory guidelines maintain that an insurance company's general account is typically invested conservatively in a diverse allocation of fixed-income securities.","B":"Correct because a property and casualty insurer has a shorter time horizon and higher liquidity needs than a life insurer, and therefore invests in shorter-term securities. The unpredictable nature of property and casualty (P&C) claims forces P&C insurers to allocate a substantial proportion of their investments into liquid, short maturity assets. This need for liquidity also forces P&C companies to accept investments with relatively low expected returns. Liquidity is of less concern to life insurance companies given the greater predictability of life insurance payouts.","C":"Incorrect because it is a similarity of both types of insurers, not a key difference. In contrast to the general account, an insurer's surplus account is the difference between its assets and liabilities. An insurer’s surplus account typically targets a higher return than the general account and thus often invests in less-conservative asset classes, such as public and private equities, real estate, infrastructure, and hedge funds."},"a":"B"},{"n":79,"q":"If the expected forward rate curve shifts downward after the inception of a swap, the mark-to-market value of the swap for the fixed-rate payer will most likely:","o":{"A":"decrease.","B":"remain the same.","C":"increase."},"f":{"A":"Correct because a decline in expected forward rates immediately following trade inception will reduce the present value of floating payments, while the fixed swap rate will remain the same. Therefore, the value of the swap to the receiver of the floating payments (i.e., the fixed-rate payer) will decrease.","B":"Incorrect because a decline in expected forward rates immediately following trade inception will reduce the present value of floating payments, while the fixed swap rate will remain the same. The payments will remain the same but not the MTM value.","C":"Incorrect because the opposite is true: A decline in expected forward rates immediately following trade inception will reduce the present value of floating payments, while the fixed swap rate will remain the same."},"a":"A"},{"n":80,"q":"Short sellers most likely:","o":{"A":"pay a short rebate to security lenders.","B":"receive cash collateral from security lenders.","C":"make payments-in-lieu of dividends to security lenders."},"f":{"A":"Incorrect because security lenders will pay a short rebate rate to short sellers. Short sellers deposit collateral to security lenders, who invest the collateral in short-term securities, and rebate the interest to the short sellers at rates called short rebate rates.","B":"Incorrect because short seller will deposit cash collateral to security lenders. To secure the security loans, lenders require that the short seller leave the proceeds of the short sale on deposit with them as cash collateral for the stock loan.","C":"Correct because the short sellers will pay the long sellers [security lenders] all dividends or interest that they otherwise would have received had they not lent their securities. These payments are called payments-in-lieu of dividends (or of interest)."},"a":"C"},{"n":81,"q":"An analyst gathers the following information (in $ millions) about a hedge fund:\n§Initial investment cost    100\n§Profit, Year 1    25\n§Loss, Year 2    10\nIf the incentive fee is 20% and there is a clawback provision, the total incentive fee (in $ millions) for Years 1 and 2 is:","o":{"A":"0.","B":"3.","C":"5."},"f":{"A":"Incorrect because it calculated the GP's incentive fee based on the profit/loss in Year 2 only. Therefore Total incentive fee = MAX [$0, –$10 million × 20%] = MAX [$0, –$2 million] = $0.","B":"Correct because the GP would initially accrue a 20% of $25 million profit at the end of the first year, equal to $5 million. Typically, this amount would be held in escrow for the benefit of the GP but not actually paid. But then the GP loses $10 million of the initial $25 million gain, so the aggregate whole-of-fund gain at the end of the second year would be only $15 million; this amount times 20% would result in only an $3 million incentive fee. The general partner would then have to return $2 million of the previously accrued incentive fees to the capital accounts of LP investors because of the clawback provision.","C":"Incorrect because it calculated the GP's incentive fee based on the profit/loss in Year 1 only. Therefore Total incentive fee = $25 million × 20% = $5 million."},"a":"B"},{"n":82,"q":"Statutory voting means that shareholders:","o":{"A":"vote by proxy.","B":"have one vote per share.","C":"with a small number of shares are in a better position than in the case of cumulative voting."},"f":{"A":"Incorrect because regular shareholder voting, where each share represents one vote, is referred to as statutory voting. In contrast, the opportunity to vote by proxy allows a designated party—such as another shareholder, a shareholder representative, or management—to vote on the shareholders’ behalf.","B":"Correct because regular shareholder voting, where each share represents one vote, is referred to as statutory voting.","C":"Incorrect because the key benefit to cumulative voting is that it allows shareholders with a small number of shares to apply all of their votes to one candidate, thus providing the opportunity for a higher level of representation on the board than would be allowed under statutory voting."},"a":"B"},{"n":83,"q":"An investor purchases a European put option for $10 with a strike price of $95. If the price of the underlying at expiration is $80, the value of the option at expiration is equal to:","o":{"A":"$0.","B":"$5.","C":"$15."},"f":{"A":"Incorrect because the value of a European put at expiration is the exercise value, which is the greater of zero or the exercise price minus the value of the underlying or pT = Max(0,X – ST). Where pT = exercise value, X is the exercise price and ST is the spot price at expiration. The value of the put option at expiration is not equal to Max(0,ST – X) or Max(0,$80 – $95) = $0.","B":"Incorrect because the value of a European put at expiration is the exercise value, which is the greater of zero or the exercise price minus the value of the underlying or pT = Max(0,X – ST). Where pT = exercise value, X is the exercise price and ST is the spot price at expiration. The value of the put option at expiration is not equal to the exercise value less the price paid for the put option or Max(0,$95 – $80) – p0 or $15 – $10 = $5 which represents the profit not the value of the option to the investor.","C":"Correct because the value of a European put at expiration is the exercise value, which is the greater of zero or the exercise price minus the value of the underlying or pT = Max(0,X – ST). Where pT = exercise value, X is the exercise price and ST is the spot price at expiration. The value of the put option at expiration is = Max(0,$95 – $80) = $15."},"a":"C"},{"n":84,"q":"Which of the following statements about direct ownership of real estate is most accurate?","o":{"A":"Local real estate market expertise is important for success","B":"Investors have no control over the tenant selection process","C":"Investors cannot use non-cash property depreciation expenses to reduce taxable income"},"f":{"A":"Correct because investing directly in real estate entails the need for specialized knowledge. The owners need to understand both general and local market characteristics, which requires local market knowledge.","B":"Incorrect because control is a distinct advantage to owning real estate directly for property investors. Only the owner can decide when to buy or sell, when and how much to spend on capital projects, whom to select as tenants based on credit quality preference and tenant mix, and what types of lease terms to offer.","C":"Incorrect because real estate owners can reduce their taxable income using non-cash property depreciation expenses and tax-deductible interest expenses."},"a":"A"},{"n":85,"q":"For which of the following industries are economic influences most important?","o":{"A":"Utilities","B":"Transportation","C":"Pharmaceuticals"},"f":{"A":"Incorrect because economic influences are most important for cyclical sectors such as crude oil, natural gas, freight transportation, semiconductor, fintech, and digital advertising. Utilities is a defensive industry.","B":"Correct because economic influences are most important for cyclical sectors such as crude oil, natural gas, freight transportation, semiconductor, fintech, and digital advertising.","C":"Incorrect because economic influences are most important for cyclical sectors such as crude oil, natural gas, freight transportation, semiconductor, fintech, and digital advertising. Pharmaceuticals is a defensive industry."},"a":"B"},{"n":86,"q":"If an investor wants to protect a short position from adverse price movements while also providing the opportunity for gains in the future, the investor should most likely use a:","o":{"A":"stop order.","B":"limit order.","C":"market order."},"f":{"A":"Correct because a stop order is an order in which a trader has specified a stop price condition. The stop order may not be filled until the stop price condition has been satisfied. Traders use them with the hope of stopping losses on positions that they have established. In the case of a short position, the investor places a stop buy order to protect paper gains. In the case of a short position, when the price rises above the stop price, the order becomes executable.","B":"Incorrect because a limit buy order will be executed whenever the current market price is at or below the limit price specified. Therefore, it cannot protect a short position from adverse price movement. Rather, it specifies a profit target for the position.","C":"Incorrect because a market order will be executed immediately and does not allow the investor any possibility for further gains."},"a":"A"},{"n":87,"q":"When making investment decisions, which of the following best describes a way to correct a behavioral bias caused by a cognitive error?","o":{"A":"Obtain better investment information","B":"Rely on intuition when making investments","C":"Evaluate investments based on past gains and losses"},"f":{"A":"Correct because cognitive errors can often be corrected or eliminated through better information, education, and advice. Emotional biases, on the other hand, are harder to correct because they stem from impulses and intuitions.","B":"Incorrect because this is a description of emotional biases rather than a correction for a behavioral bias.","C":"Incorrect because this describes an emotional bias, loss aversion, rather than a correction for a behavioral bias."},"a":"A"},{"n":88,"q":"At maturity, the buyer of an over-the-counter (OTC) financial instrument faces the counterparty credit risk of the seller in:","o":{"A":"a profitable long forward position only.","B":"an in-the-money long call option position only.","C":"both a profitable long forward position and an in-the-money long call option position."},"f":{"A":"Incorrect because although at maturity the buyer of a profitable long position in a forward faces the counterparty credit risk of the seller, the buyer of an in-the-money call option also faces this counterparty credit risk.","B":"Incorrect because although at maturity the buyer of an in-the-money call option faces the counterparty credit risk of the seller, the buyer of a profitable long position in a forward also faces this counterparty credit risk.","C":"Correct because at maturity the buyer of an in-the-money call option faces the counterparty credit risk of the seller, as does the buyer of a profitable long forward position."},"a":"C"},{"n":89,"q":"The following is a trader’s order book for a stock:\n§Bid Volume    Limit Price (CHF)    Ask Volume\n§---    42.76    6,800\n§---    42.68    9,100\n§---    42.64    6,600\n§---    42.60    2,400\n§2,000    42.56    ---\n§4,000    42.52    ---\n§7,100    42.44    ---\n§5,000    42.42    ---\nShe receives an order to sell 9,000 shares with a limit price of CHF42.52. The average price (in CHF) at which the trades will be executed is closest to:","o":{"A":"42.50.","B":"42.52.","C":"42.53."},"f":{"A":"Incorrect. This is the average price that would be generated if the order was a market order: (2,000 shares * CHF42.56) + (4,000 shares * CHF42.52) + (3,000 shares*CHF42.44)/(2,000 + 4,000 + 3,000) = CHF42.50","B":"Incorrect. This is the limit price but is not the price at which the order is executed.","C":"Correct. Only 6,000 shares can be sold because the trader cannot execute below the $42.52 limit price. The average price is CHF42.53/share per the calculation below: (2,000 shares * CHF42.56) + (4,000 shares * CHF42.52)/(2,000 + 4,000) = CHF42.53"},"a":"C"},{"n":90,"q":"A US investor purchases an American depository receipt of a company based in Japan. If the total return of the company's stock in Japan is 3% and the Japanese yen appreciates by 3% against the US dollar, the investor's total return is closest to:","o":{"A":"0%.","B":"3%.","C":"6%."},"f":{"A":"Incorrect because the Japanese company returns 3% and the currency appreciates by 3% against the USD, so the total return is approximately 6%, not 0%.","B":"Incorrect because the Japanese company returns 3% and the currency appreciates by 3% against the USD, so the total return is approximately 6%, not 3%.","C":"Correct because for investors who purchase depository receipts, foreign exchange gains arise because of the change in the exchange rate between the investor’s currency and the currency that the foreign shares are denominated in. For example, US investors who purchase the ADRs of a Japanese company will earn an additional return if the yen appreciates relative to the US dollar. If the total return for a Japanese company was 10 percent in Japan and the yen depreciated by 10 percent against the US dollar, the total return of the ADR would be (approximately) 0 percent. If the yen had instead appreciated by 10 percent against the US dollar, the total return of the ADR would be (approximately) 20 percent. Because the Japanese company returns 3% and the currency appreciates by 3% against the USD, then the total return is approximately 6%.\nRetake"},"a":"C"}],"ME4-1":[{"n":1,"q":"Which of the following is a violation according to the Standard relating to preservation of confidentiality?","o":{"A":"Members share details relating to former clients with third party service providers","B":"Members convey to clients that not all firm-sponsored resources may be appropriate for communicating confidential information","C":"When allowed under the law, members share confidential client information to defend themselves in an investigation by the CFA Institute Professional Conduct Program"},"f":{"A":"Correct because Standard III(E), Preservation of Confidentiality, requires that members and candidates preserve the confidentiality of information communicated to them by their clients, prospective clients, and former clients. Details of former clients cannot be shared with third party service providers and this is a violation of the Standard.","B":"Incorrect because according to Standard III(E), Preservation of Confidentiality, it is important to convey to clients that not all firm-sponsored resources may be appropriate for communicating confidential information.","C":"Incorrect because according to Standard III(E), Preservation of Confidentiality, when permissible under applicable law, members and candidates shall consider the PCP an extension of themselves when requested to provide information about a client in support of a PCP investigation into their own conduct. This is not a violation of the Standards when permitted by law."},"a":"A"},{"n":2,"q":"Which of the following is most accurate according to the Standard relating to knowledge of the law? Members are required to:","o":{"A":"dissociate from client activities they believe are unethical.","B":"have detailed knowledge of all the laws that could potentially govern their activities.","C":"report potential violations of the Code and Standards committed by fellow members to the CFA Institute Professional Conduct Program."},"f":{"A":"Correct because according to Standard I (A), Knowledge of the Law, if a member or candidate has reasonable grounds to believe that imminent or ongoing client or employer activities are illegal or unethical, the member or candidate must dissociate, or separate, from the activity.","B":"Incorrect because according to Standard I (A), Knowledge of the Law, while members and candidates must understand the applicable laws and regulations of the countries and jurisdictions where they engage in professional activities they are not required to have detailed knowledge of or be experts on all the laws that could potentially govern their activities.","C":"Incorrect because even though Standard I (A), Knowledge of the Law, states that CFA Institute strongly encourages members and candidates to report potential violations of the Code and Standards committed by fellow members and candidates, the Standard does not make this a requirement."},"a":"A"},{"n":3,"q":"Robert Dowling, CFA, is part of a research team. Dowling's team has recommended a “buy” rating on a company, but Dowling does not agree with the recommendation. To comply with the Standard relating to diligence and reasonable basis, Dowling:","o":{"A":"must decline to be identified with the report.","B":"must ensure that the report reflects his opinion.","C":"may continue to be identified with the report as long as the recommendation has a reasonable basis."},"f":{"A":"Incorrect because according to Standard V (A), Diligence and Reasonable Basis, Dowling does not need to decline to be identified with the report, as long as he believes the research has a reasonable and adequate basis.","B":"Incorrect because according to Standard V (A), Diligence and Reasonable Basis, Dowling may accept the group decision as long as he believes the research is sound and there is no requirement that he make an effort to have the report reflect his opinion.","C":"Correct because according to Standard V (A), Diligence and Reasonable Basis, if a member believes that the consensus opinion has a reasonable and adequate basis and is independent and objective, the member or candidate need not decline to be identified with the report. If the member or candidate is confident in the process, the member or candidate does not need to dissociate from the report even if it does not reflect his or her opinion. Thus, Dowling may accept the group's decision and may be identified with the report as long as it has a reasonable basis."},"a":"C"},{"n":4,"q":"Daniel Morgan is a Level III candidate in the CFA Program. After taking the exam, Morgan signs into a CFA-candidate-only Internet forum and writes a post expressing the opinion that the CFA Program and examination policies are unfair. Has Morgan most likely violated the Standards?","o":{"A":"No.","B":"Yes, by providing confidential program information.","C":"Yes, by compromising the reputation of CFA Institute."},"f":{"A":"Correct because Standard VII (A), Conduct as Members and Candidates in the CFA Program does not cover expressing opinions regarding CFA Institute, the CFA Program, or other CFA Institute programs. Morgan has not violated the Standard by expressing his opinion in an Internet forum.","B":"Incorrect because according to Standard VII (A), candidates may express opinions, as described in the justification for the correct answer. Morgan has not provided any confidential program information in his post and is not in violation of this Standard.","C":"Incorrect because according to Standard VII (A), candidates may express opinions, as described in the justification for the correct answer."},"a":"A"},{"n":5,"q":"Which of the following is a recommended procedure for members to meet their obligations under the Standard relating to performance presentation?","o":{"A":"Members should use a single representative account for each investment mandate while presenting performance history","B":"Members should consider the knowledge and sophistication of the audience to whom the performance history is being presented","C":"Members should exclude terminated accounts while presenting
