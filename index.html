performance history with an indication of when the accounts were terminated"},"f":{"A":"Incorrect because members and candidates can also meet their obligations under Standard III(D), Performance Presentation, by presenting the performance of the weighted composite of similar portfolios rather than using a single representative account. A single representative account should not be used.","B":"Correct because members and candidates can also meet their obligations under Standard III(D), Performance Presentation, by considering the knowledge and sophistication of the audience to whom a performance presentation is addressed. This is a recommended procedure for members to meet their obligations.","C":"Incorrect because members and candidates can also meet their obligations under Standard III(D), Performance Presentation, by including terminated accounts as part of performance history with a clear indication of when the accounts were terminated."},"a":"B"},{"n":6,"q":"According to the Standard relating to loyalty, prudence, and care, members are most likely required to:","o":{"A":"vote all proxies on behalf of clients even if some proxies offer no direct client benefit.","B":"avoid the use of soft dollars unless the services purchased have corresponding benefit for the client.","C":"consider each investment based solely on its characteristics, independently of other portfolio assets."},"f":{"A":"Incorrect because according to Standard III (A), Loyalty, Prudence, and Care, A cost–benefit analysis may show that voting all proxies may not benefit the client, so voting proxies may not be necessary in all instances. Therefore, Standard III (A) does not require members to vote all proxies on behalf of clients even if some proxies offer no direct client benefit.","B":"Correct because according to Standard III (A) Loyalty, Prudence, and Care, Conflicts may arise when an investment manager uses client brokerage to purchase research services, a practice commonly called 'soft dollars' or 'soft commissions.' A member or candidate who pays a higher brokerage commission than he or she would normally pay to allow for the purchase of goods or services, without corresponding benefit to the client, violates the duty of loyalty to the client. Therefore, Standard III (A) requires members to avoid the use of soft dollars unless the services purchased have corresponding benefit for the client.","C":"Incorrect because according to Standard III (A), Loyalty, Prudence, and Care, Investment decisions must be judged in the context of the total portfolio rather than by individual investment within the portfolio. Therefore, Standard III (A) does not require members to consider each investment based solely on its characteristics, independently of other portfolio assets. Rather, the Standard requires that investment decisions must be judged in the context of the total portfolio."},"a":"B"},{"n":7,"q":"According to the GIPS standards, compliance may be claimed only:","o":{"A":"after verification has been performed.","B":"if the firm is compliant on a firm-wide basis.","C":"with respect to specific composites and not to individual portfolios."},"f":{"A":"Incorrect because according to GIPS standards, Firms may choose to have an independent third-party veriﬁcation. Therefore, verification is voluntary and is not required to claim compliance with the GIPS standards.","B":"Correct because according to GIPS standards, veriﬁcation provides assurance on whether the ﬁrm’s policies and procedures related to composite and pooled fund maintenance, as well as the calculation, presentation, and distribution of performance, have been designed in compliance with the GIPS standards and have been implemented on a ﬁrm-wide basis. Therefore, compliance may be claimed only if the firm is compliant on a firm-wide basis.","C":"Incorrect because according to the GIPS standards, veriﬁcation provides assurance on whether the ﬁrm’s policies and procedures related to composite and pooled fund maintenance, as well as the calculation, presentation, and distribution of performance, have been designed in compliance with the GIPS standards and have been implemented on a ﬁrm-wide basis. Therefore, compliance may be claimed only if the firm is compliant on a firm-wide basis and not only with respect to specific composites."},"a":"B"},{"n":8,"q":"According to the Standard relating to additional compensation agreements, a member is required to obtain permission from her employer before accepting benefits from third parties:","o":{"A":"only for services rendered to her employer.","B":"only for services that might create a conflict with her employer’s interest.","C":"both for services rendered to her employer and for services that might create a conflict with her employer’s interest."},"f":{"A":"Incorrect because according to Standard IV (B), Additional Compensation Agreements, the member is required to obtain permission both for services rendered to the employer and for services that might create a conflict with their employer’s interest.","B":"Incorrect because according to Standard IV (B), Additional Compensation Agreements, the member is required to obtain permission both for services rendered to the employer and for services that might create a conflict with their employer’s interest.","C":"Correct because Standard IV (B), Additional Compensation Agreements, requires members and candidates to obtain permission from their employer before accepting compensation or other benefits from third parties for the services rendered to the employer or for any services that might create a conflict with their employer’s interest. Compensation and benefits include direct compensation by the client and any indirect compensation or other benefits received from third parties."},"a":"C"},{"n":9,"q":"Diana Fairbanks, CFA, is married to an auditor who is employed at a large accounting firm. When her husband mentions that a computer firm he audits will receive a qualified opinion she thinks nothing of it. Later that week when she reviews a new client account she notices that there are substantial holdings of this computer firm. When she does a thorough internet search for news on the company, she does not find anything about its most recent audit or any other adverse information. Which of the following actions concerning the computer stock should Fairbanks most likely take to avoid violating the CFA Institute Standards of Professional Conduct?","o":{"A":"Take no investment action","B":"Complete a thorough and diligent analysis of the company and then sell the stock","C":"Sell the stock immediately as she has a reasonable basis for taking this investment action"},"f":{"A":"Correct because the information concerning the qualified opinion is nonpublic and if it is material she would be in violation of Standard II(A) if she took investment action based on the information. She should also make reasonable efforts to achieve public dissemination of the information.","B":"Incorrect because she should make reasonable efforts to achieve public dissemination of the information prior to selling the stock.","C":"Incorrect because she should make reasonable efforts to achieve public dissemination of the information prior to selling the stock."},"a":"A"},{"n":10,"q":"If a member self-discloses a matter that questions his professional conduct in his annual statement to the CFA Institute, an initial investigation is conducted by the:","o":{"A":"Standard of Practice Council.","B":"Disciplinary Review Committee.","C":"Professional Conduct Program staff."},"f":{"A":"Incorrect because the Standard of Practice Council (SPC) is charged with maintaining and interpreting the Code and Standards and ensuring that they are effective. The SPC does not investigate possible Standards violations.","B":"Incorrect because the CFA Institute Board of Governors maintains oversight and responsibility for the Professional Conduct Program. It does not conduct investigations.","C":"Correct because Professional Conduct inquiries come from a number of sources. First, members and candidates must self-disclose on the annual Professional Conduct Statement all matters that question their professional conduct, such as involvement in civil litigation or a criminal investigation or being the subject of a written complaint. When an inquiry is initiated, the Professional Conduct staff conducts an investigation."},"a":"C"},{"n":11,"q":"A firm manages $500 million in large-cap equity portfolios. Of this, non-fee-paying portfolios amount to $50 million, and fee-paying non-discretionary portfolios total $75 million. To be compliant with the GIPS standards, the firm must present the value of its large-cap composite as:","o":{"A":"$375 million.","B":"$425 million.","C":"$450 million."},"f":{"A":"Correct because according to the GIPS standards, a composite must include all actual, fee-paying, discretionary portfolios managed in accordance with the same investment mandate, objective, or strategy. Therefore, to be compliant with the GIPS standards, the firm must present its large-cap composite value as US$375 million, as the firm should exclude US$50 million of non-fee-paying portfolios and US$75 million of fee-paying non-discretionary portfolios.","B":"Incorrect because the GIPS standards requires firms to include all actual, fee-paying, discretionary portfolios managed in accordance with the same investment mandate. Therefore, large-cap composite value of US$425 million is incorrect because it excludes only fee-paying non-discretionary portfolios from the total portfolio value of US$500 million. As described in the response rationale for the correct answer, the firm must present its large-cap composite value as US$375 million, not as US$425 million.","C":"Incorrect because the GIPS standards requires firms to include all actual, fee-paying, discretionary portfolios managed in accordance with the same investment mandate. Therefore, the large-cap composite value of US$450 million is incorrect because it excludes only non-fee-paying portfolios from the total portfolio value of US$500 million. As described in the response rationale for the correct answer, the firm must present its large-cap composite value as US$375 million, not as US$ 450 million."},"a":"A"},{"n":12,"q":"Which of the following is among the recommended procedures for compliance with the Standard relating to misconduct? Procedure 1 Disseminate to all employees a list of past violations together with disciplinary actions. Procedure 2 Check references of potential employees to ensure that they are of good character.","o":{"A":"Procedure 1 only","B":"Procedure 2 only","C":"Both Procedure 1 and Procedure 2"},"f":{"A":"Incorrect because according to the recommended procedures for compliance with the Standard relating to misconduct, members should encourage their firms to disseminate to all employees a list of potential violations and associated disciplinary sanctions. Therefore, it is not a recommended procedure to disseminate a list of past violations.","B":"Correct because according to the recommended procedures for compliance with the Standard relating to misconduct, members should encourage their firms to check references of potential employees to ensure that they are of good character.","C":"Incorrect because according to the recommended procedures for compliance with the Standard relating to misconduct, members should encourage their firms to disseminate to all employees a list of potential violations and associated disciplinary sanctions. Therefore, it is not a recommended procedure to disseminate a list of past violations."},"a":"B"},{"n":13,"q":"A member is developing allocation procedures for block trades and new issues. According to the recommended procedures for compliance with the Standard relating to fair dealing, the member's allocation procedures should involve:","o":{"A":"prohibiting consideration of advanced interest when allocating trades for new issues.","B":"bundling orders on a first-in, first-out basis for efficiency as appropriate for the asset class.","C":"giving client accounts participating in a block trade, execution prices corresponding to order arrival time."},"f":{"A":"Incorrect because according to the recommendations for Standard III (B), Fair Dealing, when allocating trades for new issues, procedures should include obtaining advance indications of interest, allocating securities by client (rather than portfolio manager), and providing a method for calculating allocations.","B":"Correct because according to the recommendations for Standard III (B), Fair Dealing, procedures should include processing and executing orders on a first-in, first-out basis with consideration of bundling orders for efficiency as appropriate for the asset class or the security.","C":"Incorrect because according to the recommendations for Standard III (B), Fair Dealing, procedures should include giving all client accounts participating in a block trade the same execution price and charging the same commission. So, the price should be the same, not based on order arrival time."},"a":"B"},{"n":14,"q":"Ming Mei Xu, CFA, who is a well-known analyst issues a buy recommendation on a small-cap stock. Xu shares her recommendation with the public two days after communicating the recommendation with her clients. The public dissemination leads to a significant increase in the stock price. Trevor Thomas, CFA, one of Xu's clients, buys a large position in the stock. Thomas sells the entire position for a profit a month later. His action leads to a significant decline in the stock price. Has the Standard relating to market manipulation been violated?","o":{"A":"No","B":"Yes, by Xu","C":"Yes, by Thomas"},"f":{"A":"Correct because market manipulation includes (1) the dissemination of false or misleading information and (2) transactions that deceive or would be likely to mislead market participants by distorting the price-setting mechanism of financial instruments. The intent of the action is critical to determining whether it is a violation of this standard. In this case, Xu did not have the intent to mislead anyone by publishing the buy recommendation and Thomas undertook a legitimate transaction resulting in a profit but that transaction did also not intend to distort the price-setting mechanism. Therefore, both members have complied with the Standard relating to market manipulation.","B":"Incorrect because market manipulation includes (1) the dissemination of false or misleading information and (2) transactions that deceive or would be likely to mislead market participants by distorting the price-setting mechanism of financial instruments. The intent of the action is critical to determining whether it is a violation of this standard. In this case, Xu did not have the intent to mislead anyone by publishing the buy recommendation and therefore has not violated the Standard relating to market manipulation.","C":"Incorrect because market manipulation includes (1) the dissemination of false or misleading information and (2) transactions that deceive or would be likely to mislead market participants by distorting the price-setting mechanism of financial instruments. The intent of the action is critical to determining whether it is a violation of this standard. In this case, Thomas undertook a legitimate transaction resulting in a profit but that transaction did not intend to distort the price-setting mechanism. Therefore, he has not violated the Standard relating to market manipulation."},"a":"A"},{"n":15,"q":"Michael Pak has recently retired from the investment business. A CFA Institute member for 20 years, Pak has decided not to pay his CFA Institute dues or file the annual Professional Conduct Statement. Applying to join the investment committee of a charitable organization, Pak writes: “I was a CFA Institute member for 20 years.” Has Pak most likely violated the Standards?","o":{"A":"No","B":"Yes, the Standard relating to conduct as participants in CFA Institute programs","C":"Yes, the Standard relating to reference to CFA Institute, the CFA designation, and the CFA Program"},"f":{"A":"Correct because once accepted as a CFA Institute member, the member must satisfy the following requirements to maintain his or her status:\nremit annually to CFA Institute a completed Professional Conduct Statement, which renews the commitment to abide by the requirements of the Code and Standards and the CFA Institute Professional Conduct Program, and pay applicable CFA Institute membership dues on an annual basis. If a CFA Institute member fails to meet any of these requirements, the individual is no longer considered an active member.\nUntil membership is reactivated, individuals must not present themselves to others as active members. They may state, however, that they were CFA Institute members in the past or refer to the years when their membership was active. Therefore, Pak has not violated Standard VII (B), Reference to CFA Institute, the CFA Designation, and the CFA Program, by stating: “I was a CFA Institute member for 20 years.” Pak has also not violated Standard VII(A), Conduct as Participants in CFA Institute Programs, which prohibits any conduct that undermines the public's confidence that the CFA charter represents a level of achievement based on merit and ethical conduct. Pak has not engaged in any conduct that undermines the public's confidence about the CFA charter.","B":"Incorrect because Standard VII(A), Conduct as Participants in CFA Institute Programs, covers the conduct of CFA Institute members and candidates involved with the CFA Program and prohibits any conduct that undermines the public's confidence that the CFA charter represents a level of achievement based on merit and ethical conduct. Pak has not engaged in any conduct that undermines the public's confidence about the CFA charter. Therefore, Pak has not violated Standard VII (A).","C":"Incorrect because according to Standard VII (B), Reference to CFA Institute, the CFA Designation, and the CFA Program, members may state that they were CFA Institute members in the past or refer to the years when their membership was active. Therefore, Pak has not violated Standard VII (B)."},"a":"A"},{"n":16,"q":"According to the Standard relating to loyalty, members must:","o":{"A":"subordinate any personal obligations to their work.","B":"place the interests of their employer below the interests of clients.","C":"refrain from entering into an independent business while still employed."},"f":{"A":"Incorrect because according to Standard IV(A), Loyalty, the standard does not require members and candidates to subordinate important personal and family obligations to their work.","B":"Correct because according to Standard IV(A), Loyalty, members and candidates must always place the interests of clients above the interests of their employer.","C":"Incorrect because Standard IV(A), Loyalty, does not preclude members or candidates from entering into an independent business while still employed."},"a":"B"},{"n":17,"q":"Yun Hae, CFA, is a portfolio manager at Citadel Capital (CC). Hae’s brother maintains a fee-paying retirement account at CC. Hae has no beneficial ownership in her brother’s account. Whenever an IPO becomes available that is suitable for her clients, Hae first allocates shares to other clients before placing any remaining shares in her brother’s account. She adopts this procedure to avoid potential conflicts of interest. Hae's actions violate the Standard(s) relating:","o":{"A":"only to fair dealing.","B":"only to priority of transactions.","C":"both to fair dealing and to priority of transactions."},"f":{"A":"Incorrect because Standard III(B), Fair Dealing states that Members and Candidates must deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. Further, if the investment professional’s family-member accounts are managed similarly to the accounts of other clients of the firm, however, the family-member accounts should not be excluded from buying such shares. So, Hae's actions are not consistent with this Standard. In addition, Hae's actions are also not consistent with Standard VI(B), Priority of Transactions which states that investment transactions for clients and employers must have priority over investment transactions in which a Member or Candidate is the beneficial owner and family accounts that are client accounts should be treated like any other firm account and should neither be given special treatment nor be disadvantaged because of the family relationship.","B":"Incorrect because Standard VI(B), Priority of Transactions states that investment transactions for clients and employers must have priority over investment transactions in which a Member or Candidate is the beneficial owner and family accounts that are client accounts should be treated like any other firm account and should neither be given special treatment nor be disadvantaged because of the family relationship. So, Hae's actions are not consistent with this Standard. In addition, Hae's actions are also not consistent with Standard III(B), Fair Dealing which states that Members and Candidates must deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. Further, if the investment professional’s family-member accounts are managed similarly to the accounts of other clients of the firm, however, the family-member accounts should not be excluded from buying such shares.","C":"Correct because Standard VI(B), Priority of Transactions states that investment transactions for clients and employers must have priority over investment transactions in which a Member or Candidate is the beneficial owner and family accounts that are client accounts should be treated like any other firm account and should neither be given special treatment nor be disadvantaged because of the family relationship. So, Hae's actions are not consistent with this Standard. In addition, Hae's actions are not consistent with Standard III(B), Fair Dealing which states that Members and Candidates must deal fairly and objectively with all clients when providing investment analysis, making investment recommendations, taking investment action, or engaging in other professional activities. Further, if the investment professional’s family-member accounts are managed similarly to the accounts of other clients of the firm, however, the family-member accounts should not be excluded from buying such shares. So, Hae's actions are not consistent with this Standard as well."},"a":"C"},{"n":18,"q":"To claim compliance with the GIPS standards, a firm that has been in existence for two years must:","o":{"A":"wait one year to present three years of GIPS-compliant performance.","B":"wait three years to present five years of GIPS-compliant performance.","C":"initially present GIPS-compliant performance since the firm's inception date."},"f":{"A":"Incorrect because if the composite or pooled fund has been in existence less than ﬁve years, the ﬁrm must present performance since the composite or pooled fund inception date. There is a minimum requirement of five years that the firm must work up to, but initially the firm may report performance from inception to be compliant. The firm is not required to wait any particular period of time to present initial GIPS-compliant performance.","B":"Incorrect because if the composite or pooled fund has been in existence less than ﬁve years, the ﬁrm must present performance since the composite or pooled fund inception date. There is a minimum requirement of five years that the firm must work up to, but initially the firm may report performance from inception to be compliant. The firm is not required to wait any particular period of time to present initial GIPS-compliant performance.","C":"Correct because the GIPS standards state that a ﬁrm is required to initially present, at a minimum, ﬁve years of annual investment performance that is compliant with the GIPS standards. If the composite or pooled fund has been in existence less than ﬁve years, the ﬁrm must present performance since the composite or pooled fund inception date. Prospectively, the ﬁrm must present an additional year of performance each year, building up to a minimum of 10 years of GIPS-compliant performance."},"a":"C"},{"n":19,"q":"Which of the following is consistent with the recommended procedures for compliance with the Standard relating to referral fees?\nStatement 1: \"Investment professionals should provide to their clients notification of approved referral fee programs.\" Statement 2: \"Members should provide their employer at least annual updates on the amount and nature of compensation received.\"","o":{"A":"Statement 1 only","B":"Statement 2 only","C":"Both Statement 1 and Statement 2"},"f":{"A":"Correct because according to the recommended procedures for compliance with Standard VI (C), Referral Fees, employers should have investment professionals provide to the clients notification of approved referral fee programs.","B":"Incorrect because according to the recommended procedures for compliance with Standard VI (C), Referral Fees, employers should have investment professionals provide the employer regular (at least quarterly) updates on the amount and nature of compensation received. So, the frequency of the updates should be at least quarterly, not at least annually.","C":"Incorrect because only Statement 1 is correct."},"a":"A"},{"n":20,"q":"Which of the following is a recommended procedure for compliance with the Standard relating to responsibilities of supervisors? Members should encourage their firms to:","o":{"A":"adopt a code of ethics that addresses general fiduciary concepts.","B":"provide the firm's clients with a copy of detailed compliance procedures.","C":"commingle the firm's code of ethics with its detailed compliance procedures."},"f":{"A":"Correct because the recommended procedures for compliance with Standard IV (C), Responsibilities of Supervisors, state that members and candidates are encouraged to recommend that their employers adopt a code of ethics. In addition, stand-alone codes of ethics should be written in plain language and should address general fiduciary concepts.","B":"Incorrect because the recommended procedures for compliance with Standard IV (C), Responsibilities of Supervisors, state that members and candidates should encourage their employers to provide their codes of ethics to clients. In this case also, a simple, straightforward code of ethics will be best understood by clients. Unencumbered by the compliance procedures, the code of ethics will be effective in conveying that the firm is committed to conducting business in an ethical manner and in the best interests of the clients.","C":"Incorrect because the recommended procedures for compliance with Standard IV (C), Responsibilities of Supervisors, is to not combine the code of ethics with a detailed compliance procedures manual. The Standard states that mingling compliance procedures in the firm’s code of ethics goes against the goal of reinforcing the ethical obligations of employees."},"a":"A"},{"n":21,"q":"Which of the following claims can an asset management firm most likely make regarding the GIPS standards?","o":{"A":"Claim GIPS compliance using the GIPS Compliance Statement","B":"State that the firm will achieve GIPS compliance by a future date","C":"Claim partial GIPS compliance with details on areas of non-compliance"},"f":{"A":"Correct because a firm has only two options with regard to compliance with the GIPS standards: fully comply with all requirements of the GIPS standards and claim compliance through the use of the GIPS Compliance Statement; or not comply with all requirements or the GIPS standards and not claim compliance with, or make any reference to, the GIPS standards.","B":"Incorrect because the firm is referencing the GIPS standards improperly by making a statement of its intention to be in GIPS compliance by a future date. A firm has only two options with regard to compliance with the GIPS standards: fully comply with all requirements of the GIPS standards and claim compliance through the use of the GIPS Compliance Statement; or not comply with all requirements or the GIPS standards and not claim compliance with, or make any reference to, the GIPS standards.","C":"Incorrect because a firm is not allowed to claim partial compliance. A firm has only two options with regard to compliance with the GIPS standards: fully comply with all requirements of the GIPS standards and claim compliance through the use of the GIPS Compliance Statement; or not comply with all requirements or the GIPS standards and not claim compliance with, or make any reference to, the GIPS standards."},"a":"A"},{"n":22,"q":"According to the Standard relating to suitability, a member should update a client's Investment Policy Statement at least:","o":{"A":"quarterly.","B":"semiannually.","C":"annually."},"f":{"A":"Incorrect because according to Standard III (C), Suitability, updating the IPS should be repeated at least annually (not quarterly).","B":"Incorrect because according to Standard III (C), Suitability, updating the IPS should be repeated at least annually (not semiannually)","C":"Correct because according to Standard III (C), Suitability, updating the IPS should be repeated at least annually and also prior to material changes to any specific investment recommendations or decisions on behalf of the client."},"a":"C"},{"n":23,"q":"Ann Collins, CFA, manages a fund for Kreet Investments (KI). KI provides a retirement plan for employees offering a choice of ten large diversified mutual funds. The choices include two funds managed by KI employees. Collins changes her personal investment allocation to the two funds managed by her colleagues without disclosing the change to KI or to her clients. Has Collins violated the Standard relating to avoid or disclose conflicts?","o":{"A":"No","B":"Yes, by failing to disclose the allocation change to KI","C":"Yes, by failing to disclose the allocation change to her clients"},"f":{"A":"Correct because the guidance for Standard VI (A), Avoid or Disclose Conflicts, does not require Collins to disclose her personal or retirement investments in large diversified mutual funds, unless specifically required by her employer.","B":"Incorrect because the guidance for Standard VI (A) does not require Collins to disclose her personal or retirement investments in large diversified mutual funds, unless specifically required by her employer.","C":"Incorrect because the guidance for Standard VI (A) does not require Collins to disclose her personal or retirement investments in large diversified mutual funds to her firm, unless specifically required by her employer, or to her clients."},"a":"A"},{"n":24,"q":"John Clark, CFA, starts a new job and re-creates a research report on a company he covered at his previous employer. He uses information gathered directly from the covered company. He also uses his personal notes taken while working at his previous employer. Has Clark violated the Standard relating to record retention?","o":{"A":"No","B":"Yes, because he uses information he gathered directly from the covered company","C":"Yes, because he uses his personal notes taken while working at his previous employer"},"f":{"A":"Incorrect because according to Standard V(C), Record Retention, the records are the property of the prior employer, as described in the response rationale for the correct answer.","B":"Incorrect because according to Standard V(C), Record Retention, the member can use information gathered directly from the covered company, as described in the response rationale for the correct answer.","C":"Correct because according to Standard V(C), Record Retention, as a general matter, records created as part of a member’s or candidate’s professional activity on behalf of his or her employer are the property of the firm. When a member or candidate leaves a firm to seek other employment, the member or candidate cannot take the property of the firm, including original forms or copies of supporting records of the member’s or candidate’s work, to the new employer without the express consent of the previous employer. The member or candidate cannot use historical recommendations or research reports created at the previous firm because the supporting documentation is unavailable. For future use, the member or candidate must re-create the supporting records at the new firm with information gathered through public sources or directly from the covered company and not from memory or sources obtained at the previous employer."},"a":"C"},{"n":25,"q":"According to the Standard relating to misrepresentation, a member is most likely required to:","o":{"A":"disclose his intended use of an external manager.","B":"always provide a benchmark for investment strategies.","C":"provide attribution to a member who is no longer with the firm when issuing a report."},"f":{"A":"Correct because according to Standard I (C), Misrepresentation, members and candidates must disclose their intended use of external managers and must not represent those managers’ investment practices as their own.","B":"Incorrect because Standard I (C), Misrepresentation, does not require that a benchmark always be provided in order to comply. Some investment strategies may not lend themselves to displaying an appropriate benchmark because of the complexity or diversity of the investments included.","C":"Incorrect because according to Standard I (C), Misrepresentation, research and models developed while employed by a firm are the property of the firm. The firm retains the right to continue using the work completed after a member or candidate has left the organization. The firm may issue future reports without providing attribution to the prior analysts."},"a":"A"},{"n":26,"q":"With respect to issuer-paid research, members are not required to:","o":{"A":"strictly limit the type of compensation they accept from the covered company.","B":"fully disclose the nature of compensation received from the covered company.","C":"accept compensation related only to investment performance of the covered company."},"f":{"A":"Incorrect because according to Standard I (B), independent analysts must also strictly limit the type of compensation that they accept for conducting issuer-paid research. Otherwise, the content and conclusions of the reports could reasonably be expected to be determined or affected by compensation from the sponsoring companies. Compensation that might influence the research report could be direct, such as payment based on the conclusions of the report, or indirect, such as stock warrants or other equity instruments that could increase in value on the basis of positive coverage in the report. In such instances, the independent analyst has an incentive to avoid including negative information or making negative conclusions.","B":"Incorrect because analysts must engage in thorough, independent, and unbiased analysis and must fully disclose potential conflicts of interest, including the nature of their compensation. Otherwise, analysts risk misleading investors. Thus, members must disclose the general nature of compensation (for example flat fee, performance-based, issuance of equity, etc.) but are not required to disclose the amount of compensation.","C":"Correct because according to Standard I (B), Independence and Objectivity, independent analysts must also strictly limit the type of compensation that they accept for conducting issuer-paid research. Otherwise, the content and conclusions of the reports could reasonably be expected to be determined or affected by compensation from the sponsoring companies. Compensation that might influence the research report could be direct, such as payment based on the conclusions of the report, or indirect, such as stock warrants or other equity instruments that could increase in value on the basis of positive coverage in the report. In such instances, the independent analyst has an incentive to avoid including negative information or making negative conclusions."},"a":"C"},{"n":27,"q":"Joanne Rosewood, CFA, replaces one of the third-party advisers she uses to manage her clients' portfolios with an internal investment strategy. Rosewood does not notify her clients because there is no change in the portfolios' investment style. Rosewood has most likely violated the Standard relating to:","o":{"A":"avoid or disclose conflicts.","B":"loyalty, prudence, and care.","C":"communication with clients and prospective clients."},"f":{"A":"Incorrect because according to Standard VI (A), Disclosure of Conflicts, Members and Candidates must avoid or make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. By using Rosewood's firm, the client has hired the firm to manage assets and the firm using an internal manager would not be expected to impair their independence and objectivity. Thus, Rosewood has not violated the Standard.","B":"Incorrect because according to Standard III (A), Loyalty, Prudence, and Care, Members and Candidates have a duty of loyalty to their clients and must act with reasonable care and exercise prudent judgment. Members and Candidates must act for the benefit of their clients and place their clients' interests before their employer's or their own interests. There is no information to suggest that Rosewood did not act with reasonable care and did not exercise prudent judgment while changing one of the five outside advisors. Therefore, Rosewood has not violated the Standard relating to loyalty, prudence and care.","C":"Correct because according to Standard V (B), Communication with Clients and Prospective Clients, the member or candidate must keep clients and other interested parties informed on an ongoing basis about changes to the investment process, especially newly identified significant risks and limitations. Only by thoroughly understanding the nature of the investment product or service can a client determine whether changes to that product or service could materially affect his or her investment objectives. Also, Members and Candidates should inform the clients about the specialization or diversification expertise provided by the external adviser(s). This information allows clients to understand the full mix of products and strategies being applied that may affect their investment objectives. Therefore, Rosewood has violated Standard V (B) by not informing her clients about the adviser change and by not sharing any information about the expertise of the new adviser, even though there is no change in the portfolios' investment style."},"a":"C"},{"n":28,"q":"For a non-colluding oligopoly in a price war market, competitors are most likely to:","o":{"A":"match a rival's price reduction and ignore a rival's price increase.","B":"ignore a rival's price reduction and match a rival's price increase.","C":"match both a rival's price reduction as well as a rival's price increase."},"f":{"A":"Correct because the most common pricing strategy assumption in price war markets is that competitors will match a price reduction and ignore a price increase. The logic is that by lowering its price to match a competitor’s price, the firm will not experience a reduction in customer demand. Conversely, by not matching the price increase, the firm stands to attract customers away from the firm that raised its prices.","B":"Incorrect because the most common pricing strategy assumption in price war markets is that competitors will match a price reduction and ignore a price increase. The logic is that by lowering its price to match a competitor’s price, the firm will not experience a reduction in customer demand. Conversely, by not matching the price increase, the firm stands to attract customers away from the firm that raised its prices.","C":"Incorrect because this distractor is the Cournot assumption. That is, in the Cournot assumption, each firm determines its profit-maximizing production level by assuming that the other firms’ output will not change. This assumption simplifies pricing strategy because there is no need to guess what the other firm will do to retaliate."},"a":"A"},{"n":29,"q":"Which of the following sampling methods involves selecting every kth member from a population until a desired sample size is obtained?","o":{"A":"Cluster sampling","B":"Systematic sampling","C":"Convenience sampling"},"f":{"A":"Incorrect because in this method, the population is divided into clusters, each of which is essentially a mini-representation of the entire populations. Then certain clusters are chosen as a whole using simple random sampling.","B":"Correct because with systematic sampling, we select every kth member until we have a sample of the desired size. The sample that results from this procedure should be approximately random.","C":"Incorrect because in this method, an element is selected from the population based on whether or not it is accessible to a researcher or on how easy it is for a researcher to access the element. Because the samples are selected conveniently, they are not necessarily representative of the entire population, and hence the level of the sampling accuracy could be limited."},"a":"B"},{"n":30,"q":"In the year of a change in accounting policy, comparability of the presented financial statements is best with:","o":{"A":"prospective application.","B":"retrospective application.","C":"modified retrospective application."},"f":{"A":"Incorrect because prospective application involves changes to future financial statements, which would not improve historical comparability. At times, standard setters issue new standards that require companies to change accounting policies. Depending on the standard, companies may be permitted to adopt the standards prospectively (in the future) or retrospectively (restate financial statements as though the standard existed in the past).","B":"Correct because retrospective application means that the financial statements for all fiscal years shown in a company’s financial report are presented as if the newly adopted accounting principle had been used throughout the entire period. Notes to the financial statements describe the change and explain the justification for the change. Because changes in accounting principles are retrospectively applied, the financial statements that appear within a financial report are comparable.","C":"Incorrect because under the modified retrospective approach, companies were not required to revise previously reported financial statements. Instead, they adjusted opening balances of retained earnings (and other applicable accounts) for the cumulative impact of the new standard."},"a":"B"},{"n":31,"q":"An analyst calculates a portfolio's target semideviation of returns over twelve consecutive months, including seven months of below-target returns. The sum of the squared deviations below the target is 42%2. The target semideviation is closest to:","o":{"A":"1.87%.","B":"1.95%.","C":"2.65%."},"f":{"A":"Incorrect because here the candidate forgets to subtract 1 in the denominator inside the square root, i.e. √(42/12) = 1.871% ≈ 1.87%.","B":"Correct because the target semideviation, sTarget, is:sTarget = √[∑(Xi – B)2 / (n – 1)] [summation taken for all Xi ≤ B],where B is the target and n is the total number of sample observations.The formula is equivalent to √{[∑(Xi – B)2] / (n – 1)} [for all Xi ≤ B] = √[42 / (12 – 1)] = 1.954% ≈ 1.95%.Here, ∑(Xi – B)2 [for all Xi ≤ B] = 42%2 is the sum of squared deviations below the target, and n = 12.","C":"Incorrect because this is the answer if the candidate assumes n = 7 (number of months where Xi ≤ B) instead of n = 12, resulting in √[42 / (7 – 1)] = 2.646% ≈ 2.65%."},"a":"B"},{"n":32,"q":"Which of the following mature companies is most likely to use the greatest amount of leverage in its capital structure?","o":{"A":"Mining company","B":"Software company","C":"Shipping company"},"f":{"A":"Incorrect because a mining company will be more likely to raise equity funding than debt funding. In cyclical sectors, such as mining and minerals, and many industrials, revenues and cash flows vary widely through the economic cycle, which limits debt capacity. As a result, businesses in cyclical sectors may have less debt in their capital structures than companies in other less cyclical industries.","B":"Incorrect because a software company is, being capital light, less likely to need to raise debt than a shipping company which will likely need to make substantial debt-funded capital investments. Some business models are inherently \"capital light,\" that is, they require little incremental investment in fixed assets or working capital to enable revenue growth. As a result, they have no need to borrow or otherwise raise capital to grow, even though they could easily support debt. Software businesses often fit this description.","C":"Correct because in real estate, utilities, shipping, airlines, and certain other highly capital-intensive businesses, the underlying assets can be bought and sold fairly easily, tend to retain their value regardless of who owns them, and can therefore support substantial debt secured by those assets."},"a":"C"},{"n":33,"q":"Which of the following statements about company stakeholders is most accurate?","o":{"A":"Debtholders tend to prefer that a company raise more equity","B":"Shareholder–debtholder conflict is greater for short-term creditors","C":"Shareholders are more likely than debtholders to impose contractual limits on leverage"},"f":{"A":"Correct because debtholders with a fixed claim tend to be risk averse and prefer that the corporation take actions to ensure sufficient cash flow to meet its debt obligations. For this reason, debtholders tend to prefer that a company raise more equity and limit shareholder distributions.","B":"Incorrect because shareholder–debtholder conflict is greater for long-term debt, as the passage of time exposes debtholders to changes in business conditions, strategy, and management behavior.","C":"Incorrect because shareholders tend to prefer greater leverage and shareholder distributions rather than dilutive equity issuance. On the other hand, long-term creditors are more likely to impose contractual limits on leverage and shareholder distributions."},"a":"A"},{"n":34,"q":"Which of the following market structures most likely has the greatest elasticity of demand?","o":{"A":"Oligopoly","B":"Perfect competition","C":"Monopolistic competition"},"f":{"A":"Incorrect because if demand is very elastic, the market must be very close to perfect competition. If demand is rigid (inelastic), companies may have market power. An oligopoly is a market structure where one firm has some or considerable pricing power, which is market power.","B":"Correct because if demand is very elastic, the market must be very close to perfect competition. Thus, a perfectly competitive market has the greatest elasticity of demand (infinite).","C":"Incorrect because if demand is very elastic, the market must be very close to perfect competition. If demand is rigid (inelastic), companies may have market power. Monopolistic competition is a market structure where firms have some pricing power, which is market power."},"a":"B"},{"n":35,"q":"Which of the following is an assumption of Modigliani and Miller's propositions regarding capital structure?","o":{"A":"Investors have homogeneous expectations","B":"Investors can borrow and lend at a zero interest rate","C":"Financing decisions depend on investment decisions"},"f":{"A":"Correct because one of the Modigliani–Miller assumptions is about the homogeneous expectations of investors in that they agree on a given investment’s expected cash flows.","B":"Incorrect because one of the Modigliani–Miller assumptions is that investors can borrow and lend at the risk-free (not at zero) rate.","C":"Incorrect because one of the Modigliani–Miller assumptions is that financing and investment decisions are independent of each other."},"a":"A"},{"n":36,"q":"In geopolitics, cabotage is best described as a:","o":{"A":"financial tool.","B":"multi-tool approach.","C":"national security tool."},"f":{"A":"Incorrect because financial tools are the actions used to reinforce cooperative or non-cooperative stances via financial mechanisms, while cabotage is a multi-tool approach as political, economic, and financial aspects are involved, so it is not only a financial tool.","B":"Correct because just as geopolitics is multi-faceted and includes many types of actors and features, so too are the tools of geopolitics. Systems of political, economic, and financial cooperation can be, and often are, intertwined. One interesting example is cabotage, or the right to transport passengers or goods within a country by a foreign firm.","C":"Incorrect because national security tools are those used to influence or coerce a state actor through direct or indirect impact on the country’s resources, people, or borders, while cabotage is a multi-tool approach as political, economic, and financial aspects are involved, so it is not only a national security tool."},"a":"B"},{"n":37,"q":"A policy rate that is neutral will become contractionary if trend growth:","o":{"A":"increases and expected inflation increases.","B":"decreases and expected inflation remains the same.","C":"decreases and expected inflation increases by the same amount."},"f":{"A":"Incorrect because an increase in both trend growth and estimated inflation will increase the neutral rate, making it above the current policy rate. A policy rate below the neutral rate is expansionary.","B":"Correct because if trend growth decreases, the neutral rate will decrease, which will put the policy rate above the neutral rate. The Neutral rate = Trend growth + Inflation target. The analyst would therefore describe the central bank’s monetary policy as being contractionary when its policy rate is above the neutral rate, and expansionary when it is below.","C":"Incorrect because the decrease in trend growth will be offset by the increase in expected inflation, leaving the policy neutral."},"a":"B"},{"n":38,"q":"An analyst gathers the following information (in € millions) about a company's 3-year construction contract:\n§Contract price    108\n§Expected total costs    70\n§Actual costs incurred in Year 1    28\n§Bonus for on-time completion    6\nCosts are an appropriate measure of progress toward completion. The construction company has only limited experience with similar contracts and knows that many factors outside its control could cause delay. Assuming it is highly probable that revenue will not be subsequently reversed, revenue (in € millions) recognized in Year 1 is most likely:","o":{"A":"0.","B":"43.2.","C":"45.6."},"f":{"A":"Incorrect because it assumes that the company is not allowed to recognize any revenue due to the limited experience and many factors outside its control that could cause delay.","B":"Correct because it excludes the bonus for on-time completion. A company is only allowed to recognize variable consideration if it can conclude that it will not have to reverse the cumulative revenue in the future. In this case, Builder Co. does not recognize any of the bonus in year one because it cannot reach the non-reversible conclusion given its limited experience with similar contracts and potential delays from factors outside its control. Calculated as 28/70 × 108 = 40% × 108 = 43.2.","C":"Incorrect because it includes the bonus for on-time completion. A company is only allowed to recognize variable consideration if it can conclude that it will not have to reverse the cumulative revenue in the future. In this case, Builder Co. does not recognize any of the bonus in year one because it cannot reach the non-reversible conclusion given its limited experience with similar contracts and potential delays from factors outside its control. Calculated as 40% (being 28/70) × (108 + 6) = 40% × 114 = 45.6."},"a":"B"},{"n":39,"q":"The amount of time that elapses from the point when a company invests in working capital until the point at which the company collects cash is:","o":{"A":"net operating cycle.","B":"defensive interval ratio.","C":"number of days of sales outstanding."},"f":{"A":"Correct because the net operating cycle indicates the amount of time that elapses from the point when a company invests in working capital until the point at which the company collects cash.","B":"Incorrect because the defensive interval ratio measures how long the company can continue to pay its expenses from its existing liquid assets without receiving any additional cash inflow.","C":"Incorrect because the number of DSO represents the elapsed time between a sale and cash collection, reflecting how fast the company collects cash from customers to whom it offers credit."},"a":"A"},{"n":40,"q":"In the recovery phase of the business cycle, the economy is most likely:","o":{"A":"enjoying an upswing and a positive output gap opens.","B":"going through a trough and a positive output gap opens.","C":"going through a trough and a negative output gap starts to narrow."},"f":{"A":"Incorrect because this describes the expansion phase of an economy. In an expansion the recovery gathers pace, output increases, and the rate of growth is above average. Actual output rises above potential output, and the economy enters the so-called “boom” phase where the economy experiences an upswing and a positive output gap opens.","B":"Incorrect because an upswing is seen during the expansion phase.","C":"Correct because during a recovery the economy is going through the “trough” of the cycle, where actual output is at its lowest level relative to potential output. Economic activity, including consumer and business spending, is below potential but is starting to increase, closing the negative output gap."},"a":"C"},{"n":41,"q":"In periods of rising prices and increasing inventory quantities, using the last-in, first-out (LIFO) inventory valuation method instead of the first-in, first-out (FIFO) inventory valuation method most likely increases:","o":{"A":"total assets.","B":"cost of goods sold.","C":"days of inventory on hand."},"f":{"A":"Incorrect because in periods of rising inventory unit costs and constant or increasing inventory quantities, LIFO (in comparison with FIFO) will result in a lower ending inventory balance because higher-priced inventory is sold first. Due to lower inventory on the balance sheet, total assets would be smaller rather than larger.","B":"Correct because in periods of rising inventory unit costs and constant or increasing inventory quantities, LIFO (in comparison with FIFO) will allocate a higher amount of the total cost of goods available for sale to cost of sales on the income statement.","C":"Incorrect because in periods of rising inventory unit costs and constant or increasing inventory quantities, LIFO (in comparison with FIFO) will result in a lower ending inventory balance and a higher cost of goods sold. As average inventory decreases and cost of goods sold increases, inventory turnover (cost of goods sold / average inventory) increases. As inventory turnover increases, days of inventory on hand (365 / inventory turnover) decreases rather than increases."},"a":"B"},{"n":42,"q":"Risks associated with supplier relationships are typically mitigated through:","o":{"A":"contracts.","B":"regulation.","C":"board representation."},"f":{"A":"Correct because both customers and suppliers enter into contractual agreements with a company that specify the products and services underlying the relationship, the prices or fees and the payment terms, the rights and responsibilities of each party, the after-sale relationship, and any guarantees. Contracts also specify actions to be taken and recourse available if either party breaches the terms of the contract.","B":"Incorrect because supplier relations are typically managed through contracts. By contrast, employee rights are primarily protected through jurisdiction-specific labor laws.","C":"Incorrect because supplier relationships are typically managed through contracts, not board representation."},"a":"A"},{"n":43,"q":"An increase in utility for a company's products as these products become more widely adopted best describes:","o":{"A":"network effects.","B":"operating leverage.","C":"product differentiation."},"f":{"A":"Correct because network effects refer to the increase in utility for some services and products when they are widely adopted. Examples include social media networks, Airbnb, or companies marketing construction equipment that rely on having a trained network of qualified mechanics.","B":"Incorrect because operating leverage refers to the sensitivity of a firm’s operating profit to a change in revenues.","C":"Incorrect because product or service differentiation creates value for customers. This could be based on traditional attributes, such as reliability, durability, and performance; on how the product is sold, bundled, or serviced; on branding; or on network effects. It is network effects that refer to the increase in utility for some services and products when they are widely adopted. While product differentiation can create value through network effects, the description in the stem best describes network effects."},"a":"A"},{"n":44,"q":"If inventory that was written down in a previous reporting period subsequently increases in value, the amount of the original write-down can be reversed under:","o":{"A":"IFRS only.","B":"US GAAP only.","C":"both IFRS and US GAAP."},"f":{"A":"Correct because under IFRS, if inventory that was written down in a previous period subsequently increases in value, the amount of the original write-down is reversed. Subsequent reversal of an inventory write-down is not permitted under US GAAP.","B":"Incorrect because under IFRS, if inventory that was written down in a previous period subsequently increases in value, the amount of the original write-down is reversed. Subsequent reversal of an inventory write-down is not permitted under US GAAP.","C":"Incorrect because under IFRS, if inventory that was written down in a previous period subsequently increases in value, the amount of the original write-down is reversed. Subsequent reversal of an inventory write-down is not permitted under US GAAP."},"a":"A"},{"n":45,"q":"A cooperative country is most likely to have characteristics of both:","o":{"A":"technology exchange and retaliation.","B":"rules standardization and reciprocation.","C":"harmonization of tariffs and arbitrary rules."},"f":{"A":"Incorrect because retaliation is a characteristic of non-cooperation. A non-cooperative country is one with inconsistent and even arbitrary rules; restricted movement of goods, services, people, and capital across borders; retaliation; and limited technology exchange.","B":"Correct because a cooperative country is one who engages and reciprocates in rules standardization; harmonization of tariffs; international agreements on trade, immigration, or regulation; and allows for the free flow of information, including technology transfer.","C":"Incorrect because arbitrary rules are a characteristic of non-cooperation. A non-cooperative country is one with inconsistent and even arbitrary rules; restricted movement of goods, services, people, and capital across borders; retaliation; and limited technology exchange."},"a":"B"},{"n":46,"q":"All else being equal, if interest expense is not tax deductible, as a company's marginal tax rate increases, the company's WACC:","o":{"A":"decreases.","B":"remains the same.","C":"increases."},"f":{"A":"Incorrect because, when interest expense is not tax deductible, there is no need to adjust the before-tax cost of debt in the formula for WACC. Hence, the company's WACC does not change if the tax rate changes.","B":"Correct because taking the sources of capital to be common stock, preferred stock, and debt and allowing for the fact that in some jurisdictions, interest expense may be tax deductible, the expression for WACC is:WACC = wdrd(1 – t) + wprp + werewhere t is the marginal tax rate.Given that the stem states that interest expense is not tax deductible, there should be no adjustment to the before-tax cost of debt, and WACC = wdrd + wprp + were. Thus, all else being equal, a change in the marginal tax rate would have no impact on the company's WACC.","C":"Incorrect because, when interest expense is not tax deductible, there is no need to adjust the before-tax cost of debt in the formula for WACC. Hence, the company's WACC does not change if the tax rate changes."},"a":"B"},{"n":47,"q":"Consider the following 20 items listed in ascending order:\n§–41  –18  –17  –9  –8  –6  –5    3  3  3  5  5    7    7  11 12  20  21  21  61\nThe median value of the items is closest to:","o":{"A":"3.","B":"4.","C":"5."},"f":{"A":"Incorrect. It is the value of the 10th item and also the value of the mode, which is the value that appears the most.","B":"Correct. The median is the value of the middle item of a set of items that has been sorted into ascending or descending order. In an even-numbered sample, we define the median as the mean of the values of items occupying the n/2 and (n + 2)/2 positions (the two middle items). The n/2 item is the 10th item and the (n + 2)/2 item is the 11th item. The value of the 10th item is 3; the value of the 11th item is 5. The mean of 3 and 5 is 4.","C":"Incorrect. It is the value of the 11th item."},"a":"B"},{"n":48,"q":"A company is forecasting 10% organic growth in revenues. The company believes sales volume will grow by 6.4%. The forecasted price/mix impact for the company is closest to:","o":{"A":"3.4%.","B":"17.0%.","C":"56.3%"},"f":{"A":"Correct because organic revenue growth is a combination of volume growth and price/mix impact;1 + organic growth % = (1 + volume growth %) × (1 + price/mix %);1 + 10% = (1 + 6.4%) × (1 + price/mix %)1.0338 = 1 + price/mix %price/mix % = 0.0338 ≈ 3.4%.","B":"Incorrect because it computes price/mix % as (1 + organic growth %) × (1 + volume growth %) – 1; = (1 +10%) × (1 + 6.4%) – 1; = 1.1704 – 1 = 0.1704 ≈ 17.0%.","C":"Incorrect because it computes price/mix % as organic growth / volume growth – 1; 10% / 6.4% – 1 = 1.5625 – 1 = 0.5625 ≈ 56.3%."},"a":"A"},{"n":49,"q":"The term Big Data refers to:","o":{"A":"structured data only.","B":"unstructured data only.","C":"both structured and unstructured data."},"f":{"A":"Incorrect because Big Data may be structured, semi-structured, or unstructured data.","B":"Incorrect because Big Data may be structured, semi-structured, or unstructured data.","C":"Correct because Big Data may be structured, semi-structured, or unstructured data."},"a":"C"},{"n":50,"q":"Which of the following best describes the link between the cash flow statement and the balance sheet?","o":{"A":"The cash flow statement reconciles changes in all accounts on the balance sheet","B":"The statement’s investing activities section reconciles the changes in current assets on the balance sheet","C":"The cash flow statement reconciles the beginning and ending balances of cash reported on the balance sheet"},"f":{"A":"Incorrect. There could be non-cash changes in accounts on the balance sheet; therefore not all changes in the balance sheet are reconciled on the CFS.","B":"Incorrect. The changes in current assets are in the operating section of the CFS not the investing section.","C":"Correct. The statement of cash flows ultimately shows the change in cash during an accounting period. The company’s balance sheet shows the beginning and ending cash balances for the previous and current years, and the bottom of the cash flow statement reconciles beginning cash with ending cash. Non-cash changes in accounts may appear on the balance sheet; therefore, not all changes in the balance sheet are reconciled on the cash flow statement."},"a":"C"},{"n":51,"q":"Assuming its trading partner does not retaliate, which of the following conditions must hold in order for a large country to increase its national welfare by imposing a tariff?","o":{"A":"It must have a comparative advantage in the production of the imported good","B":"The deadweight loss must be smaller than the benefit of its improving terms of trade","C":"It must auction the import licenses for a fee to offset the decline in the consumer surplus"},"f":{"A":"Incorrect. If the large country had a comparative advantage, it would be exporting more than importing. This is not relevant to whether there is a net domestic gain from the tariff. The tariff hurts domestic consumers. Unless the gain from the tariff exceeds the loss to consumers, national welfare will decrease.","B":"Correct. The large country is able to cause the foreign exporter to reduce price in order to retain market share. In the large country, domestic producers gain from higher volume and the government gains from collecting the tariff. The sum of these two gains must exceed the deadweight loss to domestic consumers to achieve a national welfare gain. The change in terms of trade causes income redistribution from the foreign exporter to the domestic producer.","C":"Incorrect. An import license relates to a quota, not a tariff."},"a":"B"},{"n":52,"q":"An analyst estimates the probabilities of three possible economic scenarios and the probabilities of a stock having a positive or a negative return in each scenario. These scenarios are best represented by a:","o":{"A":"tree-map.","B":"tree diagram.","C":"probability density function."},"f":{"A":"Incorrect because a tree-map is a graphical tool to display categorical data. It consists of a set of colored rectangles to represent distinct groups, and the area of each rectangle is proportional to the value of the corresponding group. Additional dimensions of categorical data can be displayed by nested rectangles.","B":"Correct because probabilities for different scenarios and different outcomes are best represented using a tree diagram.","C":"Incorrect because the probability estimates are for two discrete random variables, not one continuous random variable. A probability function specifies the probability that the random variable takes on a specific value. For continuous random variables, the probability function is called the probability density function (pdf), or just the density."},"a":"B"},{"n":53,"q":"An inflation-targeting central bank most likely has a medium-term inflation target sufficiently:","o":{"A":"below zero to avoid the risk of deflation but high enough to ensure price stability.","B":"above zero to avoid the risk of deflation but low enough to ensure price stability.","C":"above zero to avoid the risk of inflation and high enough to ensure price stability."},"f":{"A":"Incorrect because an inflation-targeting framework normally has a clear, symmetric and forward-looking medium-term inflation target, sufficiently above 0 percent to avoid the risk of deflation but low enough to ensure a significant degree of price stability.","B":"Correct because an inflation-targeting framework normally has a clear, symmetric and forward-looking medium-term inflation target, sufficiently above 0 percent to avoid the risk of deflation but low enough to ensure a significant degree of price stability.","C":"Incorrect because an inflation-targeting framework normally has a clear, symmetric and forward-looking medium-term inflation target, sufficiently above 0 percent to avoid the risk of deflation but low enough to ensure a significant degree of price stability."},"a":"B"},{"n":54,"q":"Assuming wages and prices are stable, which of the following policy combinations most likely leads to an increase in the private sector's share of GDP?","o":{"A":"Easy fiscal and easy monetary policy","B":"Tight fiscal and easy monetary policy","C":"Easy fiscal and tight monetary policy"},"f":{"A":"Incorrect, because if both fiscal and monetary policy are easy, then the joint impact will be highly expansionary leading to—lower interest rates (at least if the monetary impact is larger), and growing private and public sectors, without the private sector's share of GDP growing.","B":"Correct because with tight fiscal policy/easy monetary policy: If a fiscal contraction is accompanied by expansionary monetary policy and low interest rates, then the private sector will be stimulated and will rise as a share of GDP, while the public sector will shrink.","C":"Incorrect, because under easy fiscal policy/tight monetary policy we have higher output and higher interest rates, and government spending (not the private sector) will be a larger proportion of overall national income."},"a":"B"},{"n":55,"q":"An investor gathers the following information:\n§Account 1    Account 2    Account 3\n§Stated annual interest rate    6.1%    6.3%    6.2%\n§Compounding frequency    Daily    Annual    Quarterly\nIf a $1,000 deposit is made today, the future value in one year will be greatest for:","o":{"A":"Account 1.","B":"Account 2.","C":"Account 3."},"f":{"A":"Incorrect because Account 3 will have the greatest future value in one year. Despite Account 1's more frequent compounding, the lower stated annual interest rate results in a lower future value when compared to Account 3.","B":"Incorrect because Account 3 will have the greatest future value in one year. Despite Account 2's higher stated annual interest rate, the less frequent compounding results in a lower future value when compared to Account 3.","C":"Correct because the account with the highest effective annual rate (EAR) will have the greatest future value in one year. The effective annual rate is calculated as follows: EAR = (1 + Periodic interest rate)m – 1. The periodic interest rate is the stated annual interest rate divided by m, where m is the number of compounding periods in one year. The EAR of Account 3 is (1 + 0.062/4)4 – 1 = 0.06346 = 6.35%, compared to (1 + 0.061/365)365 – 1 = 0.06289 = 6.29% for Account 1 and 6.30% for Account 2. The resulting future values are: $1,063.46 for Account 3, compared to $1,062.89 for Account 1 and $1,063.00 for Account 2."},"a":"C"},{"n":56,"q":"At year end, a company has non-convertible debt, ordinary shares, and employee stock options outstanding. The company’s capital structure is considered to be:","o":{"A":"simple, if the options are antidilutive.","B":"complex, because the company has both debt and equity.","C":"complex, because the options are convertible into ordinary shares."},"f":{"A":"Incorrect because a capital structure is considered complex if the company has issued any financial instruments that are potentially convertible into common stock, such as employee stock options. It does not matter if these instruments are antidilutive.","B":"Incorrect because the existence of debt does not make the capital structure complex. The structure is complex because the employee stock options are convertible into ordinary shares.","C":"Correct because when a company has issued any financial instruments that are potentially convertible into common stock, it is said to have a complex capital structure. Potentially convertible financial instruments include convertible bonds, convertible preferred stock, employee stock options, and warrants. Any antidilutive effect of a convertible security relates to the calculation of EPS and is not part of the distinction of simple vs. complex capital structure."},"a":"C"},{"n":57,"q":"Which of the following is most likely to signal manipulation of financial reporting for a large, diversified company?","o":{"A":"A history of large expense items classified as unusual","B":"Operating margins out of line with other diversified companies","C":"Changes in accounting policies to reflect new accounting standards"},"f":{"A":"Correct because a history of unusual expense items may indicate a pattern of management manipulating the way investors perceive operating income performance. Repeated use of the “unusual” or “non-recurring” category decreases the value of this classification and suggests that management may be trying to manipulate users’ perceptions of sustainable profitability levels.","B":"Incorrect because diversified companies include a mix of businesses and, depending on that mix, may or may not be expected to have similar operating margins.","C":"Incorrect because accounting policies must be changed to comply with new accounting standards. Changes for this purpose are not suspect."},"a":"A"},{"n":58,"q":"According to capital allocation principles, managers should ignore:","o":{"A":"taxes.","B":"the volatility of cash flows.","C":"expenses that were already incurred."},"f":{"A":"Incorrect because managers must reflect the impact of taxation on a project’s expected cash flows, specifically the tax benefits derived from non-cash deductions, such as depreciation and amortization.","B":"Incorrect because the forecasted timing, duration, volatility, and change in the possible direction of the expected cash flows must be considered for a capital investment.","C":"Correct because capital allocation analysis should ignore sunk costs, or those expenses that have already been incurred."},"a":"C"},{"n":59,"q":"An individual can invest $50,000 today and receive $56,000 in one year's time. If her required rate of return is 12.0%, the rate of return on the investment is:","o":{"A":"less than the required rate of return.","B":"equal to the required rate of return.","C":"greater than the required rate of return."},"f":{"A":"Incorrect because the return on the investment is mistakenly calculated as (56,000 – 50,000)/56,000 = 6,000/56,000 ≈ 10.7%, which is less than the required return of 12%.","B":"Correct because the return on the investment can be calculated as (56,000 – 50,000)/50,000 = 6,000/50,000 = 12.0%, which matches the required return.","C":"Incorrect because the return on the investment can be calculated as (56,000 – 50,000)/50,000 = 6,000/50,000 = 12.0%. Therefore, it matches the required return but does not exceed it."},"a":"B"},{"n":60,"q":"The entire cost of an intangible asset is most likely expensed when incurred if the asset is:","o":{"A":"developed internally.","B":"acquired through business combinations.","C":"purchased in a transaction other than a business combination."},"f":{"A":"Correct because the costs to internally develop intangible assets are generally expensed when incurred. There are some situations, however, in which the costs incurred to internally develop an intangible asset are capitalised. Because costs associated with internally developing intangible assets are usually expensed, a company that has internally developed such intangible assets as copyrights, patents, or brands through expenditures on R&D or advertising will recognize a lower amount of assets than a company that has obtained intangible asset through external purchase. IFRS require that expenditures on research (or during the research phase of an internal project) be expensed rather than capitalized as an intangible asset.","B":"Incorrect because when one company acquires another company, the transaction is accounted for using the acquisition method of accounting. Under the acquisition method, the company identified as the acquirer allocates the purchase price to each asset acquired (and each liability assumed) on the basis of its fair value. If the purchase price exceeds the sum of the amounts that can be allocated to individual identifiable assets and liabilities, the excess is recorded as goodwill. Therefore, an intangible asset acquired through a business combination is more likely to increase the asset and owners' equity of the acquirer than those which are internally developed.","C":"Incorrect because intangible assets purchased in situations other than business combinations, such as buying a patent, are treated at acquisition the same as long-lived tangible assets; they are recorded at their fair value when acquired, which is assumed to be equivalent to the purchase price."},"a":"A"},{"n":61,"q":"An argument for a country’s high national debt relative to GDP being a concern is when the debt:","o":{"A":"is owed to domestic citizens.","B":"is used for capital investments.","C":"reduces private sector investing."},"f":{"A":"Incorrect because an argument against being concerned is that the scale of the problem may be overstated because the debt is owed internally to fellow citizens.","B":"Incorrect because an argument against being concerned is a proportion of the money borrowed may have been used for capital investment projects or enhancing human capital (e.g., training, education); these should lead to raised future output and tax revenues.","C":"Correct because an argument in favor of being concerned is that government borrowing may divert private sector investment from taking place (an effect known as crowding out); if there is a limited amount of savings to be spent on investment, then larger government demands will lead to higher interest rates and lower private sector investing."},"a":"C"},{"n":62,"q":"An analyst gathers the following information (in £ millions) about three companies: Company 1 Company 2 Company 3\n§Days of inventory    45    62    50\n§Days sales outstanding    30    45    53\n§Days of payables    25    60    48\nThe company with the shortest cash conversion cycle is:","o":{"A":"Company 1.","B":"Company 2.","C":"Company 3."},"f":{"A":"Incorrect because Company 2 has the shortest cash conversion cycle.","B":"Correct because Company 2 has the shortest cash conversion cycle (CCC) CCC = days of inventory + days sales outstanding – days of payables: Company 1 CCC = 45 + 30 – 25 = 50. Company 2 CCC = 62 + 45 – 60 = 47. Company 3 CCC = 50 + 53 – 48 = 55.","C":"Incorrect because Company 2 has the shortest cash conversion cycle."},"a":"B"},{"n":63,"q":"Which of the following factors is most likely to lead to economies of scale?","o":{"A":"Supply constraints","B":"Duplication of product lines","C":"Specialization by workers"},"f":{"A":"Incorrect because supply constraints lead to higher resource prices, creating diseconomies.","B":"Incorrect because duplication of product lines is a diseconomy.","C":"Correct because specialization by workers can increase their proficiency, leading to lower average costs when the firm is large enough to allow specialization."},"a":"C"},{"n":64,"q":"An analyst gathers the following information (in € thousands) about a company's total current assets:\n§Cash    300\nShort-term marketable investments  400\n§Receivables    100\n§Inventory    200\nIf the current ratio is 1.0, the quick ratio is:","o":{"A":"0.7.","B":"0.8.","C":"0.9."},"f":{"A":"Incorrect because it incorrectly calculates Quick ratio = (Cash + Short-term marketable investments) / Current liabilities = (300 + 400)/1,000 = 0.7, which is the Cash ratio.","B":"Correct because Current ratio = (Cash + Short-term marketable investments + Receivables + Inventory) / Current liabilitiesRearranging gives Current liabilities = 1.0 × (300 + 400 + 100 + 200) = 1,000.Quick ratio = (Cash + Short-term marketable investments + Receivables) / Current liabilities = (300 + 400 + 100)/1,000 = 0.8.","C":"Incorrect because it incorrectly calculates Quick ratio = (Cash + Short-term marketable investments + Inventory) / Current liabilities = (300 + 400 + 200)/1,000 = 0.9."},"a":"B"
